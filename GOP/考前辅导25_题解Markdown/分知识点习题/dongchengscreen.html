<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>停车诱导箱体三视图</title>

  <style>

    body {
      margin: 0;
      padding: 24px;
      color: #172033;
      background: #dfe4ea;
      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        "Noto Sans SC",
        Arial,
        sans-serif;
    }

    .sheet {
      width: 1500px;
      margin: 0 auto;
      padding: 24px;
      background: #ffffff;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 4px;
      text-align: center;
    }

    .subtitle {
      margin: 9px 0 18px;
      color: #526074;
      font-size: 15px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
      border: 1px solid #3f4958;
    }

    @media print {
      @page {
        size: A3 landscape;
        margin: 8mm;
      }

      body {
        padding: 0;
        background: #ffffff;
      }

      .sheet {
        width: 100%;
        padding: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

        <stop offset="50%" stop-color="#204ca6"/>

        <stop offset="45%" stop-color="#010402"/>

      <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">

        <feMerge>
