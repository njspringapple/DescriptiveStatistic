<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<title>PPT 科技风背景</title>

<style>
/* =========================
   基础设置
========================= */
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #020812;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* =========================
   PPT 画布：16:9
========================= */
#stage {
  position: relative;
  width: 1600px;
  height: 900px;
  overflow: hidden;
  transform-origin: center center;

  background:
    radial-gradient(
      circle at 72% 42%,
      rgba(0, 196, 255, 0.18),
      transparent 31%
    ),
    radial-gradient(
      circle at 90% 16%,
      rgba(111, 75, 255, 0.16),
      transparent 25%
    ),
    radial-gradient(
      circle at 13% 84%,
      rgba(255, 178, 74, 0.07),
      transparent 29%
    ),
    radial-gradient(
      circle at 42% 55%,
      rgba(0, 133, 255, 0.06),
      transparent 38%
    ),
    linear-gradient(
      135deg,
      #030a16 0%,
      #07172b 46%,
      #061327 73%,
      #030a16 100%
    );
}

/* =========================
   科技网格
========================= */
.grid {
  position: absolute;
  inset: 0;
  opacity: 0.13;

  background-image:
    linear-gradient(
      rgba(68, 155, 255, 0.32) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(68, 155, 255, 0.32) 1px,
      transparent 1px
    );

  background-size: 46px 46px;

  -webkit-mask-image: linear-gradient(
    to bottom,
    transparent 1%,
    #000 17%,
    #000 88%,
    transparent 100%
  );

  mask-image: linear-gradient(
    to bottom,
    transparent 1%,
    #000 17%,
    #000 88%,
    transparent 100%
  );
}

/* =========================
   右上大型科技圆环
========================= */
.large-ring {
  position: absolute;
  right: -190px;
  top: -70px;
  width: 990px;
  height: 990px;
  border: 1px solid rgba(64, 191, 255, 0.07);
  border-radius: 50%;

  box-shadow:
    0 0 140px rgba(0, 184, 255, 0.06),
    inset 0 0 140px rgba(0, 184, 255, 0.04);
}

.large-ring::before {
  content: "";
  position: absolute;
  inset: 80px;
  border: 1px dashed rgba(75, 222, 240, 0.08);
  border-radius: 50%;
}

.large-ring::after {
  content: "";
  position: absolute;
  inset: 185px;
  border: 1px solid rgba(133, 104, 255, 0.07);
  border-radius: 50%;
}

/* =========================
   中心偏右光环
========================= */
.center-orbit {
  position: absolute;
  left: 845px;
  top: 115px;
  width: 600px;
  height: 600px;
  border: 1px solid rgba(66, 202, 239, 0.10);
  border-radius: 50%;
}

.center-orbit::before {
  content: "";
  position: absolute;
  inset: 39px;
  border: 1px dashed rgba(71, 220, 235, 0.14);
  border-radius: 50%;
}

.center-orbit::after {
  content: "";
  position: absolute;
  inset: 92px;
  border: 1px solid rgba(108, 102, 255, 0.10);
  border-radius: 50%;
}

/* =========================
   光晕
========================= */
.glow-cyan {
  position: absolute;
  right: 140px;
  top: 300px;
  width: 580px;
  height: 360px;
  border-radius: 50%;
  background: rgba(0, 199, 255, 0.09);
  filter: blur(80px);
}

.glow-purple {
  position: absolute;
  right: -60px;
  top: -80px;
  width: 520px;
  height: 400px;
  border-radius: 50%;
  background: rgba(120, 85, 255, 0.09);
  filter: blur(90px);
}

.glow-orange {
  position: absolute;
  left: -100px;
  bottom: -160px;
  width: 480px;
  height: 340px;
  border-radius: 50%;
  background: rgba(255, 166, 61, 0.05);
  filter: blur(85px);
}

/* =========================
   左上角装饰线
========================= */
.top-decoration {
  position: absolute;
  left: 56px;
  top: 48px;
  width: 310px;
  height: 2px;

  background: linear-gradient(
    90deg,
    #188fff,
    #39e6dc,
    rgba(57, 230, 220, 0)
  );

  opacity: 0.45;
  box-shadow: 0 0 12px rgba(53, 219, 239, 0.25);
}

.top-decoration::before {
  content: "";
  position: absolute;
  left: 0;
  top: -3px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #50e5ee;
  box-shadow: 0 0 10px #35d9ef;
}

/* =========================
   右上角状态装饰
========================= */
.status-decoration {
  position: absolute;
  right: 58px;
  top: 47px;
  display: flex;
  align-items: center;
  gap: 9px;
  opacity: 0.55;
}

.status-decoration span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #49e6cb;
  box-shadow: 0 0 9px #49e6cb;
}

.status-decoration i {
  display: block;
  width: 110px;
  height: 1px;
  background: linear-gradient(
    90deg,
    rgba(73, 230, 203, 0.75),
    transparent
  );
}

/* =========================
   底部装饰线
========================= */
.bottom-decoration {
  position: absolute;
  left: 56px;
  right: 56px;
  bottom: 35px;
  height: 1px;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(50, 167, 220, 0.20) 15%,
    rgba(68, 225, 232, 0.30) 50%,
    rgba(151, 124, 241, 0.18) 80%,
    transparent
  );
}

.bottom-decoration::before {
  content: "";
  position: absolute;
  left: 34px;
  top: -3px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #43e5c5;
  box-shadow: 0 0 9px #43e5c5;
}

.bottom-decoration::after {
  content: "";
  position: absolute;
  right: 130px;
  top: -2px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #a58cff;
  box-shadow: 0 0 8px #a58cff;
}

/* =========================
   SVG 数据线
========================= */
.background-svg {
  position: absolute;
  inset: 0;
  width: 1600px;
  height: 900px;
  pointer-events: none;
}

.bg-line {
  fill: none;
  stroke: url(#backgroundGradient);
  stroke-width: 1.2;
  opacity: 0.20;
}

.bg-line-secondary {
  fill: none;
  stroke: url(#backgroundGradient);
  stroke-width: 0.8;
  opacity: 0.09;
}

.bg-line-dash {
  fill: none;
  stroke: #49ddeb;
  stroke-width: 1;
  stroke-dasharray: 7 10;
  opacity: 0.14;
}

.bg-dot {
  fill: #5ce8f4;
  opacity: 0.66;
  filter: drop-shadow(0 0 6px #27d9ef);
}

.bg-dot-purple {
  fill: #ad94ff;
  opacity: 0.55;
  filter: drop-shadow(0 0 6px #9175ff);
}

.bg-dot-orange {
  fill: #ffb04b;
  opacity: 0.55;
  filter: drop-shadow(0 0 6px #e98d21);
}

/* =========================
   左下角细节装饰
========================= */
.corner-mark {
  position: absolute;
  left: 56px;
  bottom: 62px;
  width: 76px;
  height: 34px;
  opacity: 0.30;
}

.corner-mark::before {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 76px;
  height: 1px;
  background: linear-gradient(90deg, #28cde5, transparent);
}

.corner-mark::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 1px;
  height: 34px;
  background: linear-gradient(0deg, #28cde5, transparent);
}

/* =========================
   右侧竖向数据刻度
========================= */
.data-scale {
  position: absolute;
  right: 38px;
  top: 260px;
  width: 20px;
  height: 360px;
  opacity: 0.23;

  background: repeating-linear-gradient(
    to bottom,
    rgba(77, 221, 237, 0.8) 0,
    rgba(77, 221, 237, 0.8) 1px,
    transparent 1px,
    transparent 18px
  );
}

.data-scale::before {
  content: "";
  position: absolute;
  right: 0;
  top: 0;
  width: 1px;
  height: 100%;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(77, 221, 237, 0.45),
    transparent
  );
}

/* =========================
   打印与导出
========================= */
@media print {
  @page {
    size: 1600px 900px;
    margin: 0;
  }

  html,
  body {
    width: 1600px;
    height: 900px;
  }

  #stage {
    transform: none !important;
  }
}
</style>
</head>

<body>

<div id="stage">

  <!-- 背景光晕 -->
  <div class="glow-cyan"></div>
  <div class="glow-purple"></div>
  <div class="glow-orange"></div>

  <!-- 科技网格 -->
  <div class="grid"></div>

  <!-- 科技圆环 -->
  <div class="large-ring"></div>
  <div class="center-orbit"></div>

  <!-- SVG 数据曲线 -->
  <svg
    class="background-svg"
    viewBox="0 0 1600 900"
    xmlns="http://www.w3.org/2000/svg"
  >
    <defs>
      <linearGradient
        id="backgroundGradient"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
      >
        <stop offset="0%" stop-color="#188fff"/>
        <stop offset="52%" stop-color="#44e1ed"/>
        <stop offset="100%" stop-color="#716aff"/>
      </linearGradient>

      <linearGradient
        id="fadeGradient"
        x1="0"
        y1="0"
        x2="1"
        y2="0"
      >
        <stop offset="0%" stop-color="#188fff" stop-opacity="0"/>
        <stop offset="45%" stop-color="#44e1ed" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#716aff" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- 主曲线 -->
    <path
      class="bg-line"
      d="
        M0 718
        C229 658 305 755 493 680
        C690 601 717 421 904 356
        C1090 291 1305 416 1600 228
      "
    />

    <!-- 虚线数据流 -->
    <path
      class="bg-line-dash"
      d="
        M0 761
        C245 710 387 793 568 722
        C746 652 787 483 966 420
        C1168 349 1371 419 1600 326
      "
    />

    <!-- 辅助曲线 -->
    <path
      class="bg-line-secondary"
      d="
        M0 805
        C270 750 402 838 620 754
        C850 665 880 526 1058 468
        C1240 409 1406 452 1600 389
      "
    />

    <path
      class="bg-line-secondary"
      d="
        M720 0
        C810 142 905 148 1024 225
        C1160 312 1260 281 1600 158
      "
    />

    <!-- 数据节点 -->
    <circle class="bg-dot" cx="493" cy="680" r="3"/>
    <circle class="bg-dot" cx="904" cy="356" r="3"/>
    <circle class="bg-dot" cx="1305" cy="416" r="3"/>

    <circle
      class="bg-dot-purple"
      cx="1168"
      cy="349"
      r="3"
    />

    <circle
      class="bg-dot-orange"
      cx="568"
      cy="722"
      r="3"
    />

    <!-- 右侧连接线 -->
    <path
      d="M1180 178 L1390 178 L1450 238"
      fill="none"
      stroke="url(#fadeGradient)"
      stroke-width="1"
      opacity=".18"
    />

    <circle
      class="bg-dot-purple"
      cx="1390"
      cy="178"
      r="2.5"
    />
  </svg>

  <!-- 页面装饰 -->
  <div class="top-decoration"></div>

  <div class="status-decoration">
    <span></span>
    <i></i>
  </div>

  <div class="bottom-decoration"></div>
  <div class="corner-mark"></div>
  <div class="data-scale"></div>

</div>

<script>
/*
 * 根据浏览器窗口自动缩放，
 * 始终保持 1600 × 900 的 16:9 比例。
 */
function resizeStage() {
  const stage = document.getElementById("stage");

  const baseWidth = 1600;
  const baseHeight = 900;

  const scale = Math.min(
    window.innerWidth / baseWidth,
    window.innerHeight / baseHeight
  );

  stage.style.transform = `scale(${scale})`;
}

window.addEventListener("resize", resizeStage);
resizeStage();
</script>

</body>
</html>
