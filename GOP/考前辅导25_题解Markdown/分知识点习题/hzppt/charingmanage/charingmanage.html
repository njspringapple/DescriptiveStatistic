<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1724">
<title>星途充电 · 智慧运营平台</title>
<style>
:root{
  --primary:#18d6a4;
  --primary-dark:#08ad82;
  --primary-soft:#eafff8;
  --blue:#4b7dff;
  --blue-soft:#edf2ff;
  --orange:#ff9c42;
  --orange-soft:#fff4e9;
  --red:#ff5f6d;
  --red-soft:#fff0f2;
  --purple:#8b6cff;
  --purple-soft:#f3efff;
  --cyan:#1bc9e8;
  --ink:#142235;
  --sub:#718096;
  --line:#e8edf2;
  --bg:#f4f7fa;
  --card:#fff;
  --dark:#0b1724;
  --dark2:#10283a;
  --shadow:0 10px 32px rgba(28,47,74,.08);
  --shadow-lg:0 25px 70px rgba(11,23,36,.22);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cad3dd;border-radius:99px}
.hide{display:none!important}

/* 登录 */
.login{
  position:fixed;z-index:2000;inset:0;display:grid;
  grid-template-columns:minmax(440px,560px) 1fr;color:#fff;
  background:
    radial-gradient(circle at 83% 18%,rgba(24,214,164,.2),transparent 25%),
    radial-gradient(circle at 65% 78%,rgba(75,125,255,.18),transparent 30%),
    linear-gradient(145deg,#07111e,#0d2732 58%,#08765f)
}
.login.hide{display:none}
.login-panel{
  align-self:center;width:430px;margin-left:8vw;padding:28px;
  color:var(--ink);border-radius:26px;background:rgba(255,255,255,.98);
  box-shadow:0 30px 90px rgba(0,0,0,.28)
}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:18px}
.brand-logo{
  width:42px;height:42px;display:grid;place-items:center;
  border-radius:15px;color:#05261e;background:var(--primary);
  box-shadow:0 10px 25px rgba(24,214,164,.28)
}
.login-panel h1{margin:25px 0 7px;font-size:29px}
.login-panel>p{margin:0 0 22px;color:var(--sub);font-size:13px}
.login-tabs{display:flex;padding:4px;border-radius:14px;background:#edf1f4}
.login-tabs button{
  flex:1;padding:10px;border-radius:11px;color:var(--sub);
  background:transparent;font-weight:800
}
.login-tabs button.active{color:var(--ink);background:#fff;box-shadow:0 4px 12px rgba(25,43,68,.1)}
.login-form{display:none;padding-top:8px}
.login-form.active{display:block}
.login-btn{
  width:100%;height:49px;margin-top:18px;border-radius:14px;
  color:#05261e;background:var(--primary);font-weight:900;
  box-shadow:0 10px 24px rgba(24,214,164,.25)
}
.login-hero{align-self:center;padding:70px 8vw}
.login-hero h2{margin:0 0 18px;font-size:52px;line-height:1.08}
.login-hero p{max-width:700px;color:rgba(255,255,255,.68);font-size:17px;line-height:1.8}
.login-points{display:grid;grid-template-columns:repeat(2,minmax(0,240px));gap:13px;margin-top:30px}
.login-point{
  padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:18px;
  background:rgba(255,255,255,.08);backdrop-filter:blur(10px)
}

/* 页面框架 */
.app{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr)}
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;color:#aebdca;
  background:
    radial-gradient(circle at 40% 0,rgba(24,214,164,.11),transparent 22%),
    linear-gradient(180deg,#0a1623,#0d1c2a);
  border-right:1px solid rgba(255,255,255,.04)
}
.side-logo{
  height:68px;padding:0 18px;display:flex;align-items:center;gap:10px;
  color:#fff;border-bottom:1px solid rgba(255,255,255,.07);font-weight:900
}
.side-logo i{
  width:37px;height:37px;display:grid;place-items:center;border-radius:13px;
  color:#04251d;background:var(--primary);font-style:normal
}
.nav-group{padding:12px 10px 2px}
.nav-title{padding:8px 10px;color:#546779;font-size:10px;font-weight:850;letter-spacing:1px}
.nav-item{
  position:relative;width:100%;padding:10px 11px;display:flex;align-items:center;
  gap:10px;border-radius:11px;color:#aebdca;background:transparent;text-align:left;
  font-size:12px;font-weight:720;transition:.16s
}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-item.active{color:#fff;background:rgba(24,214,164,.13)}
.nav-item.active:before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;
  border-radius:99px;background:var(--primary)
}
.nav-icon{width:22px;text-align:center;font-size:16px}
.nav-badge{
  margin-left:auto;min-width:20px;height:20px;padding:0 5px;display:grid;
  place-items:center;border-radius:99px;color:#fff;background:var(--red);
  font-size:9px
}
.main{min-width:0}
.topbar{
  position:sticky;z-index:100;top:0;height:68px;padding:0 22px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(225,231,237,.9);
  background:rgba(255,255,255,.9);backdrop-filter:blur(18px)
}
.crumb h1{margin:0;font-size:18px}
.crumb p{margin:3px 0 0;color:var(--sub);font-size:10px}
.top-actions{display:flex;align-items:center;gap:9px}
.top-search{
  width:240px;height:39px;padding:0 12px;display:flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:13px;background:#f8fafb
}
.top-search input{width:100%;border:0;outline:0;background:transparent;font-size:12px}
.top-button{
  position:relative;height:39px;padding:0 12px;border:1px solid var(--line);
  border-radius:12px;color:#526074;background:#fff;font-size:11px;font-weight:750
}
.top-button em{
  position:absolute;right:-5px;top:-6px;min-width:18px;height:18px;padding:0 4px;
  display:grid;place-items:center;border:2px solid #fff;border-radius:99px;
  color:#fff;background:var(--red);font-size:8px;font-style:normal
}
.user-button{display:flex;align-items:center;gap:9px;background:transparent}
.avatar{
  width:36px;height:36px;display:grid;place-items:center;border-radius:13px;
  color:#06251e;background:linear-gradient(135deg,#78edcb,#18c897);font-weight:900
}
.user-button b{display:block;font-size:11px;text-align:left}
.user-button small{display:block;margin-top:2px;color:var(--sub);font-size:9px}
.content{padding:20px 22px 40px;max-width:1680px;margin:auto}

/* 公共 */
.page-head{
  margin-bottom:17px;display:flex;align-items:flex-start;
  justify-content:space-between;gap:16px
}
.page-head h2{margin:0;font-size:23px}
.page-head p{margin:7px 0 0;color:var(--sub);font-size:12px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  min-height:38px;padding:0 14px;display:inline-flex;align-items:center;
  justify-content:center;gap:6px;border-radius:12px;color:var(--ink);
  background:#edf1f4;font-size:11px;font-weight:820;transition:.15s
}
.btn:active{transform:scale(.97)}
.btn.primary{color:#05251e;background:var(--primary);box-shadow:0 7px 18px rgba(24,214,164,.22)}
.btn.dark{color:#fff;background:var(--dark)}
.btn.blue{color:#fff;background:var(--blue)}
.btn.danger{color:#fff;background:var(--red)}
.btn.warning{color:#a55e12;background:var(--orange-soft)}
.btn.soft{color:#087c60;background:var(--primary-soft)}
.btn.outline{color:#596679;background:#fff;border:1px solid var(--line)}
.btn.sm{min-height:31px;padding:0 10px;border-radius:9px;font-size:10px}
.btn.block{width:100%}
.notice{
  margin-bottom:15px;padding:12px 14px;display:flex;align-items:flex-start;gap:9px;
  border:1px solid #d9f4eb;border-radius:15px;color:#3e7063;
  background:linear-gradient(90deg,#effcf8,#f8fffd);font-size:11px;line-height:1.7
}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{
  min-width:0;padding:16px;border:1px solid rgba(229,234,239,.9);
  border-radius:19px;background:#fff;box-shadow:var(--shadow)
}
.card-head{
  margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px
}
.card-title{font-size:14px;font-weight:900}
.card-sub{margin-top:4px;color:var(--sub);font-size:9px}
.card-link{padding:3px;color:#078966;background:transparent;font-size:10px;font-weight:800}
.kpi{
  position:relative;min-height:126px;padding:17px;overflow:hidden;
  border:1px solid rgba(228,234,239,.9);border-radius:19px;background:#fff;
  box-shadow:var(--shadow)
}
.kpi:after{
  content:"";position:absolute;right:-30px;bottom:-42px;width:100px;height:100px;
  border:18px solid rgba(24,214,164,.06);border-radius:50%
}
.kpi-icon{
  position:absolute;right:14px;top:14px;width:38px;height:38px;
  display:grid;place-items:center;border-radius:13px;background:var(--primary-soft);
  font-size:18px
}
.kpi.blue .kpi-icon{background:var(--blue-soft)}
.kpi.orange .kpi-icon{background:var(--orange-soft)}
.kpi.red .kpi-icon{background:var(--red-soft)}
.kpi label{color:var(--sub);font-size:10px;font-weight:700}
.kpi strong{display:block;margin:9px 0 5px;font-size:25px;letter-spacing:-.5px}
.kpi small{color:var(--sub);font-size:9px}
.up{color:#07956e!important}.down{color:#df5964!important}
.toolbar{
  margin-bottom:14px;padding:11px 12px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;border:1px solid var(--line);
  border-radius:16px;background:#fff
}
.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.input{
  width:100%;height:40px;padding:0 12px;border:1px solid var(--line);
  border-radius:11px;outline:0;color:var(--ink);background:#fff;font-size:11px
}
textarea.input{height:92px;padding-top:11px;resize:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(24,214,164,.1)}
.toolbar .input{width:170px}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:6px;color:var(--sub);font-size:10px;font-weight:750}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-full{grid-column:1/-1}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:800px;font-size:11px}
th{padding:11px;background:#f7f9fb;color:#607083;text-align:left;font-size:10px;white-space:nowrap}
td{padding:11px;border-top:1px solid #edf1f4;white-space:nowrap}
tbody tr:hover{background:#fafcfb}
.cell-main{font-weight:800}
.cell-sub{display:block;margin-top:4px;color:var(--sub);font-size:9px}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:4px 8px;
  border-radius:99px;font-size:9px;font-weight:850
}
.tag:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.green{color:#07825f;background:var(--primary-soft)}
.tag.blue{color:#436ada;background:var(--blue-soft)}
.tag.orange{color:#d1781c;background:var(--orange-soft)}
.tag.red{color:#db4d59;background:var(--red-soft)}
.tag.purple{color:#7457d7;background:var(--purple-soft)}
.tag.gray{color:#798596;background:#f0f3f5}
.actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tabs{
  display:flex;gap:5px;padding:4px;overflow-x:auto;border-radius:13px;background:#eaf0f3
}
.tabs button{
  padding:8px 12px;flex:0 0 auto;border-radius:10px;color:var(--sub);
  background:transparent;font-size:10px;font-weight:800
}
.tabs button.active{color:var(--ink);background:#fff;box-shadow:0 3px 10px rgba(25,43,68,.08)}
.progress{height:7px;overflow:hidden;border-radius:99px;background:#e9edf0}
.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary-dark),var(--primary))}
.workflow{display:flex;align-items:center;overflow-x:auto;padding-bottom:3px}
.workflow-step{
  position:relative;min-width:112px;padding:10px 18px;text-align:center;color:#8a96a5;
  background:#f0f3f5;font-size:9px;font-weight:820
}
.workflow-step:first-child{border-radius:10px 0 0 10px}
.workflow-step:last-child{border-radius:0 10px 10px 0}
.workflow-step.done{color:#087d60;background:var(--primary-soft)}
.workflow-step.current{color:#05251e;background:var(--primary)}
.metric-row{display:grid;grid-template-columns:110px 1fr 55px;gap:9px;align-items:center;margin:11px 0;font-size:10px}
.bar{height:8px;overflow:hidden;border-radius:99px;background:#e9edf0}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#22c99b,#18d6a4)}
.line{
  padding:10px 0;display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;border-bottom:1px dashed var(--line);color:var(--sub);font-size:10px
}
.line:last-child{border-bottom:0}
.line b{color:var(--ink);text-align:right}
.empty{padding:55px 20px;text-align:center;color:var(--sub);font-size:11px}

/* 驾驶舱 */
.hero-card{
  position:relative;margin-bottom:15px;padding:22px;overflow:hidden;color:#fff;
  border-radius:23px;background:
    radial-gradient(circle at 85% 20%,rgba(255,255,255,.15),transparent 25%),
    linear-gradient(130deg,#0b1724,#123c45 62%,#078b6b);
  box-shadow:0 18px 40px rgba(9,33,43,.16)
}
.hero-card:after{
  content:"";position:absolute;right:-70px;bottom:-140px;width:230px;height:230px;
  border:35px solid rgba(255,255,255,.04);border-radius:50%
}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.hero-card h2{margin:0 0 7px;font-size:22px}
.hero-card p{margin:0;color:rgba(255,255,255,.62);font-size:10px}
.hero-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.hero-metric{
  padding:14px;border:1px solid rgba(255,255,255,.07);
  border-radius:15px;background:rgba(255,255,255,.07)
}
.hero-metric span{display:block;color:rgba(255,255,255,.57);font-size:9px}
.hero-metric b{display:block;margin-top:7px;font-size:20px}
.task-list{display:grid;gap:8px}
.task{
  width:100%;padding:11px;display:flex;align-items:center;justify-content:space-between;
  gap:10px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left
}
.task:hover{border-color:#b9efdf;background:#fbfffe}
.task-icon{
  width:37px;height:37px;display:grid;place-items:center;flex:0 0 auto;
  border-radius:12px;background:var(--orange-soft)
}
.task-info{flex:1}
.task-info b{display:block;font-size:11px}
.task-info small{display:block;margin-top:4px;color:var(--sub);font-size:9px}
.task-count{color:var(--red);font-weight:900}
.chart{
  position:relative;height:220px;padding:10px 0 25px;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 42px,#edf1f4 43px)
}
.chart svg{width:100%;height:180px;overflow:visible}
.chart-labels{display:flex;justify-content:space-between;color:#97a2af;font-size:8px}
.legend{display:flex;gap:14px;justify-content:center;margin-top:6px;color:var(--sub);font-size:9px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:50%}
.station-rank{display:grid;gap:12px}
.rank-row{display:grid;grid-template-columns:25px minmax(100px,1fr) 1fr 70px;gap:9px;align-items:center;font-size:10px}
.rank-no{
  width:25px;height:25px;display:grid;place-items:center;border-radius:8px;
  color:#647184;background:#f0f3f5;font-weight:900
}
.rank-row:nth-child(1) .rank-no{color:#8f6100;background:#fff0b6}
.rank-row:nth-child(2) .rank-no{background:#e7ebef}
.rank-row:nth-child(3) .rank-no{color:#955b35;background:#ffe1cc}

/* 监控 */
.monitor-board{
  padding:18px;color:#fff;border-radius:21px;
  background:linear-gradient(135deg,#102036,#0a6f60)
}
.monitor-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:15px}
.monitor-box{padding:12px;text-align:center;border-radius:13px;background:rgba(255,255,255,.08)}
.monitor-box b{display:block;font-size:17px}
.monitor-box span{display:block;margin-top:4px;color:rgba(255,255,255,.55);font-size:8px}
.device-name{display:flex;align-items:center;gap:9px}
.device-icon{
  width:37px;height:37px;display:grid;place-items:center;border-radius:12px;
  background:var(--primary-soft);font-size:17px
}
.device-icon.error{background:var(--red-soft)}
.device-icon.busy{background:var(--blue-soft)}
.device-icon.offline{background:#f0f3f5}
.camera-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.camera{
  position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:15px;color:#fff;
  background:
    linear-gradient(rgba(5,12,18,.1),rgba(5,12,18,.55)),
    repeating-linear-gradient(90deg,#2c4949 0,#2c4949 38px,#385552 39px,#385552 76px)
}
.camera-label{position:absolute;left:10px;top:10px;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.45);font-size:9px}
.camera-time{position:absolute;right:10px;top:10px;font-size:8px}
.car{
  position:absolute;left:50%;bottom:31px;width:115px;height:45px;
  transform:translateX(-50%);border-radius:30px 30px 12px 12px;background:#cad5de
}
.ai-border{
  position:absolute;left:25%;right:25%;top:35%;bottom:18%;
  border:2px solid var(--primary)
}
.ai-border span{
  position:absolute;left:-2px;top:-19px;padding:3px 5px;
  color:#05251e;background:var(--primary);font-size:7px;font-weight:850
}

/* 地图 */
.map{
  position:relative;height:430px;overflow:hidden;border-radius:19px;
  background:
    linear-gradient(32deg,transparent 72%,rgba(255,255,255,.65) 73%,transparent 76%),
    linear-gradient(120deg,transparent 69%,rgba(255,255,255,.7) 70%,transparent 74%),
    linear-gradient(145deg,#dbe9df,#dce7ed)
}
.map-pin{
  position:absolute;padding:9px 11px;transform:translate(-50%,-50%);
  border:2px solid var(--primary);border-radius:13px;color:var(--ink);
  background:#fff;box-shadow:var(--shadow);font-size:9px;font-weight:850
}
.map-pin.warning{border-color:var(--orange)}
.map-pin.error{border-color:var(--red)}
.map-panel{
  position:absolute;right:15px;top:15px;width:260px;padding:14px;
  border-radius:17px;background:rgba(255,255,255,.96);box-shadow:var(--shadow)
}

/* 抽屉和弹窗 */
.mask{
  position:fixed;z-index:1000;inset:0;display:none;
  background:rgba(5,15,27,.5);backdrop-filter:blur(3px)
}
.mask.show{display:block}
.drawer{
  position:absolute;right:0;top:0;bottom:0;width:min(720px,92vw);
  display:flex;flex-direction:column;background:var(--bg);
  box-shadow:-25px 0 70px rgba(5,15,27,.2);
  animation:drawerIn .25s ease
}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:none}}
.drawer-head{
  flex:0 0 auto;padding:18px 20px;display:flex;align-items:flex-start;
  justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);background:#fff
}
.drawer-head h3{margin:0;font-size:18px}
.drawer-head p{margin:5px 0 0;color:var(--sub);font-size:10px}
.close-btn{
  width:35px;height:35px;display:grid;place-items:center;border-radius:11px;
  color:#687589;background:#eef2f4;font-size:18px
}
.drawer-body{flex:1;padding:16px 18px 30px;overflow-y:auto}
.drawer-footer{
  flex:0 0 auto;padding:12px 18px;display:flex;justify-content:flex-end;
  gap:8px;border-top:1px solid var(--line);background:#fff
}
.dialog-mask{
  position:fixed;z-index:1100;inset:0;display:none;align-items:center;
  justify-content:center;padding:25px;background:rgba(5,15,27,.52);backdrop-filter:blur(3px)
}
.dialog-mask.show{display:flex}
.dialog{
  width:min(680px,96vw);max-height:90vh;display:flex;flex-direction:column;
  overflow:hidden;border-radius:22px;background:#fff;box-shadow:var(--shadow-lg);
  animation:dialogIn .22s ease
}

.toast{

  border-radius:13px;background:#0e1b2a;box-shadow:0 14px 32px rgba(0,0,0,.18);

}

.toast.error{background:#c84250}
.toast.warning{background:#bd6e1c}
@keyframes toastIn{from{opacity:0;transform:translateX(25px)}to{opacity:1;transform:none}}

/* 业务特殊 */
.timeline{position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:#e2e8ec}
.timeline-item{position:relative;padding:0 0 17px}
.timeline-item:before{
  content:"";position:absolute;left:-20px;top:3px;width:9px;height:9px;
  border:3px solid #fff;border-radius:50%;background:var(--primary);
  box-shadow:0 0 0 2px #b8efdf
}
.timeline-item b{display:block;font-size:10px}

.price-line{display:flex;height:58px;overflow:hidden;border-radius:12px}

.price-seg span{display:block;margin-top:5px;font-size:8px;opacity:.8}
.price-seg.low{background:#0ead82}
.price-seg.flat{background:#4b7dff}
.price-seg.peak{background:#ff9c42}
.price-seg.top{background:#ff5f6d}
.switch{
  position:relative;width:42px;height:24px;flex:0 0 auto;border-radius:99px;
  background:#d7dee4;transition:.2s
}
.switch:after{
  content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;
  border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.16);transition:.2s
}
.switch.on{background:var(--primary-dark)}
.switch.on:after{left:21px}
.switch-line{padding:11px 0;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px dashed var(--line)}

.amount{

.amount.active{color:#087d60;background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}

  $("#drawerMask").classList.add("show");
}

function closeDrawer(){
  $("#drawerMask").classList.remove("show");
}

function showDialog(title,desc,body,confirmText="确认",callback=null,wide=false){
  $("#dialogTitle").textContent=title;
  $("#dialogDesc").textContent=desc||"";
  $("#dialogBody").innerHTML=body||"";
  $("#dialogConfirm").textContent=confirmText;
  $("#dialog").classList.toggle("wide",wide);
  dialogCallback=callback;
  $("#dialogMask").classList.add("show");
}

function closeDialog(){
  $("#dialogMask").classList.remove("show");
  dialogCallback=null;
}

function addLog(action,result="成功"){
  state.logs.unshift({

}

/* 全局事件 */
document.addEventListener("click",event=>{
  const pageButton=event.target.closest("[data-page]");
  if(pageButton){
    closeDrawer();
    renderPage(pageButton.dataset.page);
    return;
  }

  const loginTab=event.target.closest("[data-login-tab]");
  if(loginTab){
    $$("[data-login-tab]").forEach(b=>b.classList.remove("active"));
    loginTab.classList.add("active");
    $("#accountLogin").classList.toggle("active",loginTab.dataset.loginTab==="account");
    $("#smsLogin").classList.toggle("active",loginTab.dataset.loginTab==="sms");
    return;
  }

  const periodButton=event.target.closest("[data-dashboard-period]");
  if(periodButton){
    $$("[data-dashboard-period]").forEach(b=>b.classList.remove("active"));
    periodButton.classList.add("active");

    const data={
      today:["18,620 kWh","¥23,846","628单"],
      week:["126,580 kWh","¥162,846","4,286单"],
      month:["486,320 kWh","¥628,650","16,826单"]
    }[periodButton.dataset.dashboardPeriod];

    $("#heroEnergy").textContent=data[0];
    $("#heroAmount").textContent=data[1];
    $("#heroOrders").textContent=data[2];
    toast("经营周期已切换");
    return;
  }

  const actionElement=event.target.closest("[data-action]");
  if(!actionElement) return;

  const action=actionElement.dataset.action;
  const id=actionElement.dataset.id;

  switch(action){
    case "login-account":{
      if(!$("#loginAccount").value.trim()||!$("#loginPassword").value.trim()){
        toast("请输入账号和密码","error");
        return;
      }
      $("#loginPage").classList.add("hide");
      toast("登录成功，欢迎进入星途充电运营平台");
      break;
    }

    case "send-login-code":
      $("#loginCode").value="668826";
      toast("验证码已发送，演示验证码为668826");
      break;

    case "login-sms":
      if($("#loginCode").value.trim()!=="668826"){
        toast("验证码错误，请输入668826","error");
        return;
      }
      $("#loginPage").classList.add("hide");
      toast("手机号验证成功");
      break;

    case "close-drawer": closeDrawer(); break;
    case "close-dialog": closeDialog(); break;

    case "global-search":{
      const keyword=$("#globalSearchInput").value.trim();
      if(!keyword){
        toast("请输入订单号、设备编号、用户或电站名称","warning");
        return;
      }

      const matchedOrder=state.orders.find(o=>o.id.includes(keyword)||o.plate.includes(keyword)||o.user.includes(keyword));
      const matchedDevice=state.devices.find(d=>d.id.includes(keyword)||d.station.includes(keyword));
      const matchedStation=state.stations.find(s=>s.name.includes(keyword));

      if(matchedOrder) orderDetail(matchedOrder.id);
      else if(matchedDevice) deviceDetail(matchedDevice.id);
      else if(matchedStation) stationDetail(matchedStation.id);
      else toast("未找到匹配的业务数据","error");
      break;
    }

    case "message-center":
      showDrawer(
        "消息中心",
        `${state.messages}条未读业务消息`,
        `
          ${[
            ["设备故障预警","A11枪发生绝缘检测异常","10分钟前","operations"],
            ["用户开票申请","新增一笔¥286.80开票申请","18分钟前","finance"],
            ["用户差评","深圳湾站停车减免未生效","25分钟前","orders"],
            ["营销待审核","夜间谷电8折活动等待审批","42分钟前","marketing"]

          i.status="已驳回";
          addLog(`驳回开票申请：${i.id}`);

          toast("开票申请已驳回","warning");

    }

    case "send-invoice":

    case "replace-invoice":{
      const i=state.invoices.find(x=>x.id===id);
      showDialog(
        "发票换开",
        "系统将先对原发票进行红冲，红冲成功后开具新发票。",
        `
          <div class="line"><span>原发票</span><b>${i.id}</b></div>
          <div class="line"><span>原开票金额</span><b>¥${i.amount.toFixed(2)}</b></div>
          <div class="field" style="margin-top:12px"><label>新发票抬头</label><input class="input" value="${i.title}"></div>
          <div class="field"><label>换开原因</label><select class="input"><option>抬头信息错误</option><option>发票类型变更</option></select></div>
        `,
        "红冲并换开",
        ()=>{
          i.status="换开中";

          renderPage("finance");
          toast("原发票红冲成功，新发票正在开具");

    }

    case "batch-invoice":
      showDialog(
        "批量开票",
        "系统将合并处理通过订单校验的待开票申请。",
        `
          <div class="line"><span>待处理申请</span><b>1笔</b></div>
          <div class="line"><span>开票总金额</span><b>¥286.80</b></div>
          <div class="line"><span>订单核验</span><b style="color:#078966">全部通过</b></div>
        `,
        "开始批量开票",
        ()=>{
          state.invoices.filter(i=>i.status==="待开票").forEach(i=>i.status="开票中");
          renderPage("finance");
          toast("批量开票任务已提交税务平台");
        }
      );
      break;

    case "reconciliation":
      showDrawer(
        "财务对账",
        "2025-06-18 · 支付渠道与业务订单核对",
        `
          <div class="grid g4">
            ${kpi("业务订单金额","¥23,846.50","628笔订单","▤")}
            ${kpi("支付渠道金额","¥23,846.50","渠道流水628笔","¥","blue")}
            ${kpi("差异金额","¥0.00","账实一致","✓","orange")}
            ${kpi("退款金额","¥368.20","7笔退款","↩","red")}
          </div>

          <article class="card" style="margin-top:14px">
            ${table(
              ["渠道","业务金额","渠道金额","差异","状态"],
              [
                ["微信支付","¥12,682.50","¥12,682.50","¥0.00",statusTag("已完成")],
                ["个人余额","¥6,286.00","¥6,286.00","¥0.00",statusTag("已完成")],
                ["企业账户","¥4,878.00","¥4,878.00","¥0.00",statusTag("已完成")]
              ]
            )}
          </article>
        `,
        `<button class="btn primary" data-action="close-reconciliation">确认对账完成</button>`
      );
      break;

    case "close-reconciliation":
      closeDrawer();
      addLog("完成2025-06-18财务对账");
      toast("对账结果已确认并归档");
      break;

    case "new-employee":
    case "edit-employee":{
      const e=state.employees.find(x=>x.id===id)||{};
      showDialog(
        action==="new-employee"?"新增员工账号":"编辑员工账号",
        "员工账号保存后根据角色获得对应菜单和数据范围。",
        `
          <div class="form-grid">
            <div class="field"><label>员工姓名</label><input class="input" id="employeeName" value="${e.name||""}"></div>
            <div class="field"><label>手机号</label><input class="input" id="employeePhone" value="${e.phone||""}"></div>
            <div class="field"><label>所属部门</label><select class="input" id="employeeDept"><option>运营部</option><option>运维部</option><option>财务部</option></select></div>
            <div class="field"><label>员工角色</label><select class="input" id="employeeRole"><option>电站站长</option><option>运维工程师</option><option>开票专员</option></select></div>
          </div>
        `,
        "保存员工账号",
        ()=>{
          if(action==="new-employee"){
            state.employees.push({
              id:"E00"+(state.employees.length+1),
              name:$("#employeeName").value||"新员工",
              phone:$("#employeePhone").value||"未设置",
              dept:$("#employeeDept").value,
              role:$("#employeeRole").value,
              status:"正常"
            });
          }else{
            e.name=$("#employeeName").value||e.name;
            e.dept=$("#employeeDept").value;
            e.role=$("#employeeRole").value;
          }
          addLog(`${action==="new-employee"?"新增":"编辑"}员工账号`);
          renderPage("enterprise");
          toast("员工账号已保存");
        }
      );
      break;
    }

    case "employee-permission":
      showDialog(
        "配置员工权限",
        "按照最小权限原则配置菜单权限和数据范围。",
        `
          <div class="line"><span>电站管理</span><button class="switch on" data-action="toggle-switch"></button></div>
          <div class="line"><span>设备监控</span><button class="switch on" data-action="toggle-switch"></button></div>
          <div class="line"><span>订单查看</span><button class="switch on" data-action="toggle-switch"></button></div>
          <div class="line"><span>退款审批</span><button class="switch" data-action="toggle-switch"></button></div>
          <div class="line"><span>财务开票</span><button class="switch" data-action="toggle-switch"></button></div>
          <div class="field" style="margin-top:12px"><label>数据范围</label><select class="input"><option>指定负责电站</option><option>企业全部电站</option></select></div>
        `,
        "保存权限",
        ()=>toast("员工权限已更新")
      );
      break;

    case "disable-employee":{
      const e=state.employees.find(x=>x.id===id);
      showDialog(
        "停用员工账号",
        "停用后员工无法登录，历史操作日志继续保留。",
        `
          <div class="line"><span>员工</span><b>${e.name}</b></div>
          <div class="line"><span>角色</span><b>${e.role}</b></div>
          <div class="field" style="margin-top:12px"><label>停用原因</label><select class="input"><option>离职</option><option>岗位调整</option><option>临时冻结</option></select></div>
        `,
        "确认停用",
        ()=>{
          e.status="已停用";
          addLog(`停用员工账号：${e.name}`);
          renderPage("enterprise");
          toast("员工账号已停用","warning");
        }
      );
      break;
    }

    case "role-manage":
      showDrawer(
        "角色权限管理",
        "角色决定员工可见菜单、操作权限与数据范围",
        `
          ${table(
            ["角色","人数","数据范围","操作"],
            [
              ["企业管理员","2人","全部企业数据",`<button class="btn sm soft" data-action="edit-role">编辑权限</button>`],
              ["电站站长","8人","负责电站",`<button class="btn sm soft" data-action="edit-role">编辑权限</button>`],
              ["运维工程师","12人","设备与工单",`<button class="btn sm soft" data-action="edit-role">编辑权限</button>`],
              ["财务专员","6人","账户与发票",`<button class="btn sm soft" data-action="edit-role">编辑权限</button>`]
            ]
          )}
          <button class="btn primary block" style="margin-top:12px" data-action="new-role">＋ 新建角色</button>
        `
      );
      break;

    case "edit-role":
    case "new-role":
      showDialog(
        action==="new-role"?"新建角色":"编辑角色权限",
        "配置角色名称、菜单权限和敏感操作范围。",
        `
          <div class="field"><label>角色名称</label><input class="input" value="${action==="new-role"?"区域运营经理":"电站站长"}"></div>
          <div class="line"><span>电站管理</span><button class="switch on" data-action="toggle-switch"></button></div>
          <div class="line"><span>设备监控</span><button class="switch on" data-action="toggle-switch"></button></div>
          <div class="line"><span>订单退款</span><button class="switch" data-action="toggle-switch"></button></div>
          <div class="line"><span>财务开票</span><button class="switch" data-action="toggle-switch"></button></div>
        `,
        "保存角色",
        ()=>toast("角色权限已保存")
      );
      break;

    case "save-settings":
      addLog("保存系统设置");
      toast("系统设置已保存");
      break;

    case "edit-security":
      showDialog(
        "编辑安全策略",
        "敏感操作策略变更将记录审计日志。",
        `
          <div class="form-grid">
            <div class="field"><label>登录有效期</label><select class="input"><option>12小时</option><option>8小时</option></select></div>
            <div class="field"><label>退款审批阈值</label><input class="input" value="50"></div>
            <div class="field"><label>设备停止验证</label><select class="input"><option>填写原因并二次确认</option></select></div>
            <div class="field"><label>异常登录提醒</label><select class="input"><option>短信+消息中心</option></select></div>
          </div>
        `,
        "保存安全策略",
        ()=>toast("安全策略已更新")
      );
      break;

    case "edit-company":
      showDialog(
        "编辑企业信息",
        "企业认证主体变更需要重新提交资质审核。",
        `
          <div class="form-grid">
            <div class="field"><label>企业名称</label><input class="input" value="深圳星途新能源科技有限公司"></div>
            <div class="field"><label>统一社会信用代码</label><input class="input" value="91440300MA5F8XXXX"></div>
            <div class="field"><label>客服电话</label><input class="input" value="400-888-6628"></div>
            <div class="field"><label>企业邮箱</label><input class="input" value="service@xingtu.example"></div>
          </div>
        `,
        "保存企业信息",
        ()=>toast("企业信息已保存")
      );
      break;

    case "channel-settings":
      showDrawer(
        "第三方渠道配置",
        "支付、地图、开票和消息渠道连接状态",
        `
          ${[
            ["微信支付","商户号 1900****826","已连接"],
            ["电子开票平台","企业税号 9144****","已连接"],
            ["腾讯地图","Key TXM****628","已连接"],
            ["短信服务","签名：星途充电","已连接"]
          ].map(c=>`
            <article class="card">
              <div class="card-head">
                <div><div class="card-title">${c[0]}</div><div class="card-sub">${c[1]}</div></div>
                ${statusTag("在线")}
              </div>
              <button class="btn soft block" data-action="test-channel" data-channel="${c[0]}">测试连接</button>
            </article>
          `).join("")}
        `
      );
      break;

    case "test-channel":
      toast(`${actionElement.dataset.channel}连接测试成功`);
      break;

    case "version-detail":
      showDrawer(
        "版本更新记录",
        "当前版本 V3.6.0",
        `
          <article class="card">
            <div class="card-head"><div class="card-title">V3.6.0</div>${statusTag("已生效")}</div>
            <div class="line"><span>发布时间</span><b>2025-06-18</b></div>
            <div style="margin-top:12px;color:var(--sub);font-size:10px;line-height:1.9">
              1. 新增完整的电价版本回滚能力；<br>
              2. 新增千里眼枪头掉地识别；<br>
              3. 优化设备故障报修与验收流程；<br>
              4. 新增营销活动预算审批；<br>
              5. 优化财务对账和换开发票流程。
            </div>
          </article>
        `
      );
      break;
  }
});

/* 选择卡片 */
document.addEventListener("click",event=>{
  const card=event.target.closest(".check-card");
  if(card){
    const parent=card.parentElement;
    $$(".check-card",parent).forEach(c=>c.classList.remove("active"));
    card.classList.add("active");
  }

  const amount=event.target.closest(".amount");
  if(amount){
    $$(".amount",amount.parentElement).forEach(a=>a.classList.remove("active"));
    amount.classList.add("active");
  }
});

/* 弹窗确认 */
$("#dialogConfirm").addEventListener("click",()=>{
  if(dialogCallback){
    const result=dialogCallback();
    if(result===false)return;
  }
  closeDialog();
});

/* 点击遮罩关闭 */
$("#drawerMask").addEventListener("click",event=>{
  if(event.target.id==="drawerMask")closeDrawer();
});
$("#dialogMask").addEventListener("click",event=>{
  if(event.target.id==="dialogMask")closeDialog();
});

/* 数据周期 */
document.addEventListener("click",event=>{
  const period=event.target.closest("[data-data-period]");
  if(!period)return;
  $$("[data-data-period]").forEach(b=>b.classList.remove("active"));
  period.classList.add("active");
  toast("经营数据周期已切换");
});

/* 实时功率 */
setInterval(()=>{
  const power=$("#heroPower");
  if(power){
    const value=2864.5+Math.sin(Date.now()/1500)*32;
    power.textContent=value.toFixed(1)+"kW";
  }
},1200);

initNav();
renderPage("dashboard");
</script>
</body>
</html>
