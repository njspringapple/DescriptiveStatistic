 if(a==='run-global-search'){const q=$('#globalKeyword').value.trim();const ds=debtors.filter(d=>d.plate.includes(q)||d.owner.includes(q)),ts=tasks.filter(t=>t.id.includes(q)||t.name.includes(q)),ps=payments.filter(p=>p.id.includes(q)||p.plate.includes(q));$('#globalResults').innerHTML=`<div class="panel" style="box-shadow:none"><div class="panel-head"><div class="panel-title">搜索结果</div><div class="panel-sub">共 ${ds.length+ts.length+ps.length} 条</div></div><div class="rank-list">${ds.map(d=>`<div class="rank-item"><div class="rank-num">车</div><div><div class="rank-name link" data-action="debtor-detail" data-id="${d.id}">${d.plate}</div><div class="rank-meta">欠费对象 · ${money(d.amount)}</div></div><div class="rank-amount">查看</div></div>`).join('')}${ts.map(t=>`<div class="rank-item"><div class="rank-num">任</div><div><div class="rank-name link" data-action="task-detail" data-id="${t.id}">${t.name}</div><div class="rank-meta">${t.id}</div></div><div class="rank-amount">${t.progress}%</div></div>`).join('')}${ps.map(p=>`<div class="rank-item"><div class="rank-num">付</div><div><div class="rank-name link" data-action="payment-detail" data-id="${p.id}">${p.id}</div><div class="rank-meta">${p.plate} · ${money(p.amount)}</div></div><div class="rank-amount">分账</div></div>`).join('')||'<div class="empty" style="padding:34px"><b>未找到匹配结果</b></div>'}</div></div>`}
});
document.addEventListener('change',e=>{if(e.target.id==='selectAll'){const arr=filteredDebtors();if(e.target.checked)arr.forEach(d=>state.selected.add(d.id));else arr.forEach(d=>state.selected.delete(d.id));renderDebtors()}if(e.target.classList.contains('debtor-check')){const id=Number(e.target.dataset.id);e.target.checked?state.selected.add(id):state.selected.delete(id);renderDebtors()}});
$('#orgSelect').addEventListener('change',e=>{state.org=e.target.value;toast('运营主体已切换',state.org)});
renderNav();renderDashboard();
</script>
