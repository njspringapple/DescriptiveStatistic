<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>停充一体化平台 · 智慧财务中心</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --warning: #d97706;
            --warning-light: #fffbeb;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --purple: #7c3aed;
            --cyan: #0891b2;
            --sidebar: #111827;
            --sidebar-hover: #1f2937;
            --text: #111827;
            --text-secondary: #6b7280;
            --text-light: #9ca3af;
            --border: #e5e7eb;
            --background: #f4f7fb;
            --card: #ffffff;
            --shadow: 0 3px 12px rgba(15, 23, 42, .06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--text);
            background: var(--background);
            font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            font-size: 14px;
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            min-height: 100vh;
        }

        /* 顶部导航 */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            color: white;
            background: #0b1220;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .16);
        }

        .brand {
            width: 260px;
            display: flex;
            align-items: center;
            gap: 11px;
            flex-shrink: 0;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            font-size: 20px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            box-shadow: 0 5px 15px rgba(37, 99, 235, .35);
        }

        .brand-title {
            font-size: 16px;
            font-weight: 700;
        }

        .brand-subtitle {
            margin-top: 2px;
            color: #94a3b8;
            font-size: 11px;
        }

        .topbar-center {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-select {
            height: 36px;
            min-width: 150px;
            padding: 0 32px 0 11px;
            color: #e5e7eb;
            border: 1px solid #334155;
            border-radius: 8px;
            outline: none;
            background: #172033;
        }

        .top-select:focus {
            border-color: #3b82f6;
        }

        .scope-tip {
            color: #94a3b8;
            font-size: 12px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-switch {
            display: flex;
            padding: 3px;
            border: 1px solid #334155;
            border-radius: 9px;
            background: #172033;
        }

        .mode-switch button {
            padding: 6px 11px;
            color: #94a3b8;
            border: 0;
            border-radius: 6px;
            background: transparent;
        }

        .mode-switch button.active {
            color: white;
            background: var(--primary);
        }

        .icon-button {
            position: relative;
            width: 36px;
            height: 36px;
            color: #d1d5db;
            border: 1px solid #334155;
            border-radius: 9px;
            background: #172033;
        }

        .notification-dot {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ef4444;
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 2px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-weight: 700;
            background: #334155;
        }

        .user-name {
            font-size: 13px;
        }

        .user-role {
            color: #94a3b8;
            font-size: 11px;
        }

        /* 侧边栏 */
        .sidebar {
            position: fixed;
            top: 64px;
            bottom: 0;
            left: 0;
            z-index: 90;
            width: 240px;
            overflow-y: auto;
            color: #cbd5e1;
            background: var(--sidebar);
            transition: width .25s ease;
        }

        .sidebar-section {
            padding: 15px 12px 6px;
        }

        .sidebar-title {
            padding: 0 10px 8px;
            color: #64748b;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .menu-item {
            width: 100%;
            min-height: 42px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 3px;
            padding: 9px 11px;
            color: #cbd5e1;
            text-align: left;
            border: 0;
            border-radius: 8px;
            background: transparent;
            transition: .2s;
        }

        .menu-item:hover {
            color: white;
            background: var(--sidebar-hover);
        }

        .menu-item.active {
            color: white;
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
        }

        .menu-icon {
            width: 20px;
            font-size: 17px;
            text-align: center;
        }

        .menu-badge {
            margin-left: auto;
            min-width: 20px;
            padding: 2px 6px;
            color: white;
            text-align: center;
            border-radius: 10px;
            font-size: 11px;
            background: #ef4444;
        }

        .menu-badge.orange {
            background: #d97706;
        }

        .sidebar-footer {
            margin: 16px 12px;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #172033;
        }

        .sidebar-footer-title {
            color: white;
            font-weight: 600;
        }

        .sidebar-footer-text {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.6;
        }

        /* 主体 */
        .main {
            margin-top: 64px;
            margin-left: 240px;
            min-height: calc(100vh - 64px);
            padding: 22px;
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .page-title {
            margin: 0;
            font-size: 23px;
        }

        .page-desc {
            margin-top: 7px;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
        }

        .btn {
            min-height: 36px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #374151;
            background: white;
        }

        .btn:hover {
            border-color: #93c5fd;
            background: #f8fbff;
        }

        .btn-primary {
            color: white;
            border-color: var(--primary);
            background: var(--primary);
        }

        .btn-primary:hover {
            color: white;
            border-color: var(--primary-dark);
            background: var(--primary-dark);
        }

        .btn-success {
            color: white;
            border-color: var(--success);
            background: var(--success);
        }

        .btn-danger {
            color: white;
            border-color: var(--danger);
            background: var(--danger);
        }

        .btn-sm {
            min-height: 29px;
            padding: 5px 9px;
            font-size: 12px;
        }

        .btn-text {
            color: var(--primary);
            border: 0;
            background: transparent;
        }

        .period-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            color: #15803d;
            background: #f0fdf4;
        }

        .period-badge.locked {
            color: #6b7280;
            border-color: #d1d5db;
            background: #f3f4f6;
        }

        /* 筛选区域 */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            box-shadow: var(--shadow);
        }

        .form-control {
            height: 36px;
            min-width: 130px;
            padding: 0 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            background: white;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .09);
        }

        .search-input {
            min-width: 220px;
        }

        .filter-label {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* 指标卡片 */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .kpi-card {
            position: relative;
            min-height: 126px;
            overflow: hidden;
            padding: 17px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            box-shadow: var(--shadow);
            transition: transform .2s, box-shadow .2s;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, .09);
        }

        .kpi-icon {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            font-size: 18px;
        }

        .kpi-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .kpi-value {
            margin-top: 13px;
            font-size: 25px;
            font-weight: 750;
            letter-spacing: -.5px;
        }

        .kpi-value small {
            margin-left: 2px;
            font-size: 13px;
            font-weight: 500;
        }

        .kpi-trend {
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .up {
            color: var(--success);
        }

        .down {
            color: var(--danger);
        }

        .blue-bg { color: #2563eb; background: #eff6ff; }
        .green-bg { color: #16a34a; background: #f0fdf4; }
        .orange-bg { color: #d97706; background: #fffbeb; }
        .red-bg { color: #dc2626; background: #fef2f2; }
        .purple-bg { color: #7c3aed; background: #f5f3ff; }
        .cyan-bg { color: #0891b2; background: #ecfeff; }

        /* 通用卡片 */
        .grid {
            display: grid;
            gap: 16px;
            margin-bottom: 16px;
        }

        .grid-2 {
            grid-template-columns: minmax(0, 2fr) minmax(330px, 1fr);
        }

        .grid-half {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .grid-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            box-shadow: var(--shadow);
        }

        .card-header {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
        }

        .card-subtitle {
            margin-top: 4px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .card-body {
            padding: 16px;
        }

        .chart-wrap {
            position: relative;
            height: 260px;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* 业务闭环 */
        .flow-card {
            margin-bottom: 16px;
        }

        .flow-container {
            display: flex;
            align-items: stretch;
            overflow-x: auto;
            padding: 18px;
        }

        .flow-step {
            position: relative;
            min-width: 132px;
            flex: 1;
            text-align: center;
        }

        .flow-step:not(:last-child)::after {
            content: "";
            position: absolute;
            z-index: 0;
            top: 22px;
            left: calc(50% + 24px);
            width: calc(100% - 48px);
            height: 2px;
            background: #dbeafe;
        }

        .flow-circle {
            position: relative;
            z-index: 1;
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            margin: auto;
            border: 2px solid #93c5fd;
            border-radius: 50%;
            color: var(--primary);
            background: #eff6ff;
            font-size: 18px;
        }

        .flow-step.done .flow-circle {
            color: white;
            border-color: var(--success);
            background: var(--success);
        }

        .flow-step.warning .flow-circle {
            color: white;
            border-color: var(--warning);
            background: var(--warning);
        }

        .flow-name {
            margin-top: 9px;
            font-weight: 650;
        }

        .flow-number {
            margin-top: 4px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .flow-step.warning .flow-number {
            color: var(--warning);
        }

        /* 表格 */
        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th {
            padding: 11px 13px;
            color: #6b7280;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
        }

        td {
            padding: 12px 13px;
            border-bottom: 1px solid #eef2f7;
        }

        tbody tr:hover {
            background: #f8fbff;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        .amount {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .negative {
            color: var(--danger);
        }

        .muted {
            color: var(--text-secondary);
        }

        .link {
            color: var(--primary);
            cursor: pointer;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

        .tag-success {
            color: #15803d;
            background: #dcfce7;
        }

        .tag-warning {
            color: #b45309;
            background: #fef3c7;
        }

        .tag-danger {
            color: #b91c1c;
            background: #fee2e2;
        }

        .tag-info {
            color: #1d4ed8;
            background: #dbeafe;
        }

        .tag-purple {
            color: #6d28d9;
            background: #ede9fe;
        }

        .tag-default {
            color: #4b5563;
            background: #f3f4f6;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            padding: 12px 15px;
            border-top: 1px solid var(--border);
        }

        .page-btn {
            min-width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
        }

        .page-btn.active {
            color: white;
            border-color: var(--primary);
            background: var(--primary);
        }

        /* 任务与风险 */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
        }

        .task-icon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 9px;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-weight: 650;
        }

        .task-desc {
            margin-top: 5px;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.5;
        }

        .task-amount {
            color: var(--danger);
            font-weight: 700;
        }

        .risk-item {
            display: flex;
            gap: 11px;
            padding: 12px 0;
            border-bottom: 1px solid #eef2f7;
        }

        .risk-item:last-child {
            border-bottom: 0;
        }

        .risk-dot {
            width: 8px;
            height: 8px;
            margin-top: 6px;
            flex-shrink: 0;
            border-radius: 50%;
        }

        /* 进度条 */
        .progress {
            height: 8px;
            overflow: hidden;
            border-radius: 10px;
            background: #e5e7eb;
        }

        .progress-bar {
            height: 100%;
            border-radius: 10px;
            background: var(--primary);
            transition: width .6s;
        }

        .progress-bar.green { background: var(--success); }
        .progress-bar.orange { background: var(--warning); }
        .progress-bar.red { background: var(--danger); }

        .metric-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .stat-box {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fafcff;
        }

        .stat-box-value {
            margin-top: 8px;
            font-size: 22px;
            font-weight: 750;
        }

        /* 快捷操作 */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .quick-action {
            padding: 14px 9px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: white;
            transition: .2s;
        }

        .quick-action:hover {
            color: var(--primary);
            border-color: #93c5fd;
            background: #eff6ff;
        }

        .quick-action-icon {
            margin-bottom: 7px;
            font-size: 21px;
        }

        /* 规则与报表 */
        .report-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(220px, 1fr));
            gap: 14px;
        }

        .report-card {
            padding: 17px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: white;
            box-shadow: var(--shadow);
        }

        .report-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            font-size: 20px;
        }

        .report-name {
            margin-top: 13px;
            font-weight: 700;
        }

        .report-desc {
            min-height: 38px;
            margin-top: 7px;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.55;
        }

        .report-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 13px;
        }

        .rule-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-size: 13px;
        }

        .form-group .form-control {
            width: 100%;
        }

        .full-column {
            grid-column: 1 / -1;
        }

        textarea.form-control {
            min-height: 84px;
            padding: 10px;
            resize: vertical;
        }

        /* 抽屉与弹窗 */
        .modal-mask {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, .52);
        }

        .modal-mask.show {
            display: flex;
        }

        .modal {
            width: min(620px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 14px;
            background: white;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 17px 20px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 17px;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 7px;
            font-size: 20px;
            background: #f3f4f6;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            padding: 14px 20px;
            border-top: 1px solid var(--border);
        }

        .toast {
            position: fixed;
            z-index: 2000;
            right: 24px;
            bottom: 24px;
            max-width: 360px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 17px;
            color: white;
            border-radius: 10px;
            background: #111827;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
            opacity: 0;
            transform: translateY(18px);
            pointer-events: none;
            transition: .25s;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 简易模式 */
        body.simple-mode .professional-only {
            display: none !important;
        }

        body.simple-mode .kpi-grid {
            grid-template-columns: repeat(4, minmax(170px, 1fr));
        }

        body.simple-mode .flow-step {
            min-width: 155px;
        }

        .empty-state {
            padding: 45px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-icon {
            margin-bottom: 12px;
            font-size: 44px;
        }

        @media (max-width: 1450px) {
            .kpi-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .report-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

    function drawIncomeChart() {
        const canvas = document.getElementById("incomeChart");
        if (!canvas) return;

        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;

        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;
        const padding = { top: 20, right: 18, bottom: 32, left: 46 };

        const data = state.role === "partner"
            ? [32, 38, 41, 36, 52, 63]
            : [62, 68, 72, 66, 82, 78, 92, 88, 105, 116, 108, 126];

        const labels = state.role === "partner"
            ? ["2月", "3月", "4月", "5月", "6月", "7月"]
            : ["7/1", "7/3", "7/5", "7/7", "7/9", "7/11", "7/13", "7/15", "7/17", "7/18", "7/19", "预测"];

        const max = Math.max(...data) * 1.18;
        const chartW = width - padding.left - padding.right;
        const chartH = height - padding.top - padding.bottom;

        ctx.clearRect(0, 0, width, height);
        ctx.font = "11px Arial";
        ctx.fillStyle = "#9ca3af";
        ctx.strokeStyle = "#e5e7eb";
        ctx.lineWidth = 1;

        for (let i = 0; i <= 4; i++) {
            const y = padding.top + chartH * i / 4;
            ctx.beginPath();
            ctx.moveTo(padding.left, y);
            ctx.lineTo(width - padding.right, y);
            ctx.stroke();

            const value = Math.round(max * (1 - i / 4));
            ctx.fillText(value + "k", 8, y + 4);
        }

        labels.forEach((label, i) => {
            const x = padding.left + chartW * i / (labels.length - 1);
            ctx.fillText(label, x - 10, height - 8);
        });

        const points = data.map((value, i) => ({
            x: padding.left + chartW * i / (data.length - 1),
            y: padding.top + chartH * (1 - value / max)
        }));

        const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
        gradient.addColorStop(0, "rgba(37,99,235,.26)");
        gradient.addColorStop(1, "rgba(37,99,235,.02)");

        ctx.beginPath();
        ctx.moveTo(points[0].x, height - padding.bottom);
        points.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(points[points.length - 1].x, height - padding.bottom);
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.beginPath();
        points.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        });
        ctx.strokeStyle = "#2563eb";
        ctx.lineWidth = 3;
        ctx.stroke();

        points.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.strokeStyle = "#2563eb";
            ctx.lineWidth = 2;
            ctx.stroke();
        });
    }

        toast.classList.add("show");
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function updateScope() {
        const subject = subjectNames[state.subject];
        const project = projectNames[state.project];
        document.getElementById("scopeTip").innerText =
            `当前数据范围：${subject} / ${project}`;
    }

    function updateRoleView() {
        const roleName = roleNames[state.role];
        document.getElementById("userName").innerText = roleName.replace("管理员", "");
        document.getElementById("userRole").innerText =
            state.mode === "professional" ? "专业财务视图" : "简易财务视图";

        if (state.role === "propertyManager" && state.mode === "professional") {
            setMode("simple", false);
        }

        if (state.role === "partner") {
            state.page = "dashboard";
        }

        renderSidebar();
        renderPage();
    }

    function setMode(mode, rerender = true) {
        state.mode = mode;
        document.body.classList.toggle("simple-mode", mode === "simple");
        document.getElementById("simpleModeBtn").classList.toggle("active", mode === "simple");
        document.getElementById("professionalModeBtn").classList.toggle("active", mode === "professional");
        document.getElementById("userRole").innerText =
            mode === "professional" ? "专业财务视图" : "简易财务视图";

        const simplePages = ["dashboard", "income", "receivables", "refunds", "reconciliation", "settlement", "reports", "settings"];
        if (mode === "simple" && !simplePages.includes(state.page)) {
            state.page = "dashboard";
        }

        if (rerender) {
            renderSidebar();
            renderPage();
        }
    }

    document.getElementById("simpleModeBtn").addEventListener("click", () => setMode("simple"));
    document.getElementById("professionalModeBtn").addEventListener("click", () => setMode("professional"));

    document.getElementById("roleSelector").addEventListener("change", function () {
        state.role = this.value;
        updateRoleView();
    });

    document.getElementById("subjectSelector").addEventListener("change", function () {
        state.subject = this.value;
        updateScope();
        renderPage();
    });

    document.getElementById("projectSelector").addEventListener("change", function () {
        state.project = this.value;
        updateScope();
        renderPage();
    });

    document.getElementById("modalMask").addEventListener("click", function (event) {
        if (event.target === this) closeModal();
    });

    window.addEventListener("resize", () => {
        if (document.getElementById("incomeChart")) drawIncomeChart();
    });

    renderSidebar();
    renderPage();
    updateScope();
</script>
</body>
</html>
