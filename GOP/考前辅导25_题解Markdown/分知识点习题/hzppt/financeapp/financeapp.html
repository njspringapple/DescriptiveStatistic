<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4f7fb">
<title>智慧财务管理小程序</title>

<style>
/* =========================================================
   基础变量
========================================================= */
:root {
  --primary: #1677ff;
  --primary-dark: #0958d9;
  --primary-light: #eaf3ff;

  --success: #19a974;
  --success-light: #e9f9f3;

  --warning: #f59e0b;
  --warning-light: #fff7e8;

  --danger: #ef4444;
  --danger-light: #fff0f0;

  --purple: #7c5cff;
  --purple-light: #f1efff;

  --text: #172033;
  --text-secondary: #667085;
  --text-light: #98a2b3;

  --border: #e8edf3;
  --background: #f4f7fb;
  --card: #ffffff;

  --shadow: 0 5px 20px rgba(29, 44, 77, .07);
  --radius: 16px;

  --app-width: 390px;
  --app-height: 844px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at 30% 10%, rgba(22,119,255,.10), transparent 30%),
    #dfe5ee;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    Arial,
    sans-serif;
  color: var(--text);
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

/* =========================================================
   手机框架
========================================================= */
.phone {
  position: relative;
  width: min(100vw, var(--app-width));
  height: min(100dvh, var(--app-height));
  overflow: hidden;
  background: var(--background);
  box-shadow:
    0 30px 80px rgba(15, 23, 42, .24),
    0 0 0 1px rgba(255,255,255,.7);
}

.status-bar {
  position: absolute;
  z-index: 60;
  top: 0;
  left: 0;
  right: 0;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  color: #26354d;
  font-size: 11px;
  font-weight: 600;
  background: rgba(255,255,255,.96);
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 5px;
}

.signal {
  display: flex;
  align-items: flex-end;
  gap: 1px;
  height: 10px;
}

.signal i {
  display: block;
  width: 2px;
  border-radius: 1px;
  background: #26354d;
}

.signal i:nth-child(1) { height: 4px; }
.signal i:nth-child(2) { height: 6px; }
.signal i:nth-child(3) { height: 8px; }
.signal i:nth-child(4) { height: 10px; }

.battery {
  position: relative;
  width: 19px;
  height: 9px;
  padding: 1px;
  border: 1px solid #26354d;
  border-radius: 2px;
}

.battery::after {
  content: "";
  position: absolute;
  top: 2px;
  right: -3px;
  width: 2px;
  height: 4px;
  border-radius: 0 1px 1px 0;
  background: #26354d;
}

.battery-level {
  width: 75%;
  height: 100%;
  border-radius: 1px;
  background: #26354d;
}

/* =========================================================
   顶部栏
========================================================= */
.app-header {
  position: absolute;
  z-index: 50;
  top: 24px;
  left: 0;
  right: 0;
  height: 58px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  border-bottom: 1px solid rgba(230,235,242,.85);
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(16px);
}

.header-left {
  min-width: 0;
  flex: 1;
}

.header-title {
  overflow: hidden;
  color: #172033;
  font-size: 18px;
  font-weight: 750;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.header-subtitle {
  display: flex;
  align-items: center;
  gap: 3px;
  max-width: 260px;
  margin-top: 3px;
  overflow: hidden;
  color: var(--text-secondary);
  font-size: 10px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-icon {
  position: relative;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 12px;
  color: #354052;
  background: #f4f7fb;
  font-size: 18px;
}

.header-dot {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 7px;
  height: 7px;
  border: 2px solid white;
  border-radius: 50%;
  background: var(--danger);
}

/* =========================================================
   页面内容
========================================================= */
.page-container {
  position: absolute;
  top: 82px;
  bottom: 68px;
  left: 0;
  right: 0;
  overflow: hidden;
}

.page {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
}

.page::-webkit-scrollbar,
.horizontal-scroll::-webkit-scrollbar {
  display: none;
}

.page-content {
  min-height: 100%;
  padding: 13px 13px 24px;
}

/* =========================================================
   底部导航
========================================================= */
.tab-bar {
  position: absolute;
  z-index: 55;
  left: 0;
  right: 0;
  bottom: 0;
  height: 68px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 5px 4px max(5px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(16px);
}

.tab-item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 0;
  color: #8b96a8;
  border: 0;
  background: transparent;
  font-size: 10px;
}

.tab-icon {
  position: relative;
  width: 30px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  font-size: 20px;
  transition: .2s;
}

.tab-item.active {
  color: var(--primary);
  font-weight: 650;
}

.tab-item.active .tab-icon {
  background: var(--primary-light);
}

.tab-badge {
  position: absolute;
  top: -1px;
  right: -3px;
  min-width: 15px;
  height: 15px;
  padding: 0 4px;
  color: white;
  border: 2px solid white;
  border-radius: 9px;
  background: var(--danger);
  font-size: 8px;
  line-height: 11px;
}

/* =========================================================
   通用卡片
========================================================= */
.card {
  margin-bottom: 11px;
  overflow: hidden;
  border: 1px solid rgba(232,237,243,.94);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
}

.card-body {
  padding: 14px;
}

.card-header {
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid #f0f2f5;
}

.card-title {
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
}

.card-subtitle {
  margin-top: 3px;
  color: var(--text-light);
  font-size: 10px;
}

.card-link {
  flex-shrink: 0;
  padding: 5px 0;
  color: var(--primary);
  border: 0;
  background: transparent;
  font-size: 11px;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 15px 2px 9px;
}

.section-title strong {
  font-size: 15px;
}

.section-title span {
  color: var(--text-light);
  font-size: 10px;
}

/* =========================================================
   标签、按钮
========================================================= */
.tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 21px;
  padding: 2px 7px;
  border-radius: 8px;
  font-size: 10px;
  line-height: 1.2;
}

.tag-blue {
  color: #1468d6;
  background: #eaf3ff;
}

.tag-green {
  color: #13865e;
  background: #e9f9f3;
}

.tag-orange {
  color: #b66a03;
  background: #fff3dc;
}

.tag-red {
  color: #d73535;
  background: #fff0f0;
}

.tag-purple {
  color: #6346d8;
  background: #f0edff;
}

.tag-gray {
  color: #667085;
  background: #f2f4f7;
}

.btn {
  height: 38px;
  padding: 0 16px;
  color: #344054;
  border: 1px solid #d9e0e8;
  border-radius: 11px;
  background: white;
  font-size: 13px;
  font-weight: 600;
}

.btn-primary {
  color: white;
  border-color: var(--primary);
  background: var(--primary);
}

.btn-danger {
  color: white;
  border-color: var(--danger);
  background: var(--danger);
}

.btn-light-danger {
  color: var(--danger);
  border-color: #ffc9c9;
  background: var(--danger-light);
}

.btn-block {
  width: 100%;
}

.btn-sm {
  height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 11px;
}

/* =========================================================
   顶部范围筛选
========================================================= */
.scope-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 11px;
  padding: 10px 12px;
  border: 1px solid #e4ebf4;
  border-radius: 14px;
  background: white;
  box-shadow: var(--shadow);
}

.scope-main {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
}

.scope-icon {
  width: 34px;
  height: 34px;
  display: grid;
  flex: 0 0 34px;
  place-items: center;
  border-radius: 10px;
  color: var(--primary);
  background: var(--primary-light);
  font-size: 17px;
}

.scope-name {
  overflow: hidden;
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.scope-time {
  margin-top: 3px;
  color: var(--text-light);
  font-size: 9px;
}

.scope-arrow {
  color: var(--text-light);
  font-size: 17px;
}

/* =========================================================
   财务首页头部
========================================================= */
.finance-hero {
  position: relative;
  min-height: 172px;
  margin-bottom: 11px;
  overflow: hidden;
  padding: 17px;
  color: white;
  border-radius: 20px;
  background:
    radial-gradient(circle at 88% 25%, rgba(255,255,255,.20), transparent 26%),
    linear-gradient(135deg, #1677ff, #3857dc 62%, #664de1);
  box-shadow: 0 12px 30px rgba(22,119,255,.25);
}

.finance-hero::before {
  content: "";
  position: absolute;
  right: -45px;
  top: -75px;
  width: 180px;
  height: 180px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 50%;
}

.finance-hero::after {
  content: "";
  position: absolute;
  right: 20px;
  bottom: -80px;
  width: 150px;
  height: 150px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 50%;
}

.hero-top {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.hero-label {
  color: rgba(255,255,255,.80);
  font-size: 12px;
}

.hero-date {
  padding: 4px 8px;
  border: 1px solid rgba(255,255,255,.20);
  border-radius: 9px;
  color: rgba(255,255,255,.90);
  background: rgba(255,255,255,.10);
  font-size: 9px;
}

.hero-amount {
  position: relative;
  z-index: 2;
  margin-top: 12px;
  font-size: 31px;
  font-weight: 800;
  letter-spacing: -.8px;
}

.hero-amount small {
  margin-right: 3px;
  font-size: 18px;
}

.hero-meta {
  position: relative;
  z-index: 2;
  display: flex;
  gap: 14px;
  margin-top: 8px;
  color: rgba(255,255,255,.78);
  font-size: 10px;
}

.hero-meta b {
  color: #d9fff2;
}

.hero-footer {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 15px;
}

.hero-progress {
  flex: 1;
  height: 6px;
  overflow: hidden;
  border-radius: 5px;
  background: rgba(255,255,255,.20);
}

.hero-progress-bar {
  width: 72%;
  height: 100%;
  border-radius: 5px;
  background: #67f0cb;
}

.hero-progress-text {
  color: rgba(255,255,255,.82);
  font-size: 9px;
}

/* =========================================================
   首页指标卡
========================================================= */
.metric-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin-bottom: 11px;
}

.metric-card {
  position: relative;
  min-height: 101px;
  overflow: hidden;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: white;
  box-shadow: var(--shadow);
}

.metric-icon {
  position: absolute;
  top: 11px;
  right: 11px;
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  font-size: 14px;
}

.metric-label {
  color: var(--text-secondary);
  font-size: 11px;
}

.metric-value {
  margin-top: 11px;
  font-size: 19px;
  font-weight: 760;
  letter-spacing: -.3px;
}

.metric-desc {
  margin-top: 7px;
  color: var(--text-light);
  font-size: 9px;
  line-height: 1.4;
}

.metric-desc .up {
  color: var(--success);
}

.metric-desc .down {
  color: var(--danger);
}

.icon-blue {
  color: var(--primary);
  background: var(--primary-light);
}

.icon-red {
  color: var(--danger);
  background: var(--danger-light);
}

.icon-orange {
  color: var(--warning);
  background: var(--warning-light);
}

.icon-purple {
  color: var(--purple);
  background: var(--purple-light);
}

/* =========================================================
   图表
========================================================= */
.chart-wrap {
  height: 145px;
  padding: 8px 4px 0;
}

.chart-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.chart-label {
  fill: #98a2b3;
  font-size: 8px;
}

.donut-layout {
  display: flex;
  align-items: center;
  gap: 20px;
}

.donut {
  position: relative;
  width: 110px;
  height: 110px;
  flex: 0 0 110px;
  border-radius: 50%;
  background:
    conic-gradient(
      #1677ff 0 46%,
      #35c6b0 46% 70%,
      #7c5cff 70% 84%,
      #f5a623 84% 94%,
      #d9e1ea 94% 100%
    );
}

.donut::after {
  content: "";
  position: absolute;
  inset: 19px;
  border-radius: 50%;
  background: white;
}

.donut-center {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
}

.donut-center strong {
  font-size: 16px;
}

.donut-center span {
  margin-top: 2px;
  color: var(--text-light);
  font-size: 8px;
}

.legend-list {
  min-width: 0;
  flex: 1;
}

.legend-row {
  display: flex;
  align-items: center;
  margin-bottom: 9px;
  color: var(--text-secondary);
  font-size: 10px;
}

.legend-dot {
  width: 8px;
  height: 8px;
  margin-right: 7px;
  border-radius: 3px;
}

.legend-value {
  margin-left: auto;
  color: var(--text);
  font-weight: 650;
}

/* =========================================================
   快捷入口
========================================================= */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px 4px;
  padding: 13px 8px 12px;
}

.quick-item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 3px 0;
  color: var(--text-secondary);
  border: 0;
  background: transparent;
  font-size: 10px;
}

.quick-icon {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  font-size: 20px;
}

.quick-badge {
  position: absolute;
  top: -1px;
  right: 9px;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  color: white;
  border: 2px solid white;
  border-radius: 9px;
  background: var(--danger);
  font-size: 8px;
  line-height: 13px;
}

/* =========================================================
   列表
========================================================= */
.list-card {
  overflow: hidden;
}

.list-item {
  position: relative;
  display: flex;
  gap: 11px;
  min-height: 73px;
  padding: 13px 14px;
  border-bottom: 1px solid #f0f2f5;
  background: white;
}

.list-item:last-child {
  border-bottom: 0;
}

.list-item:active {
  background: #f8fafc;
}

.list-icon {
  width: 40px;
  height: 40px;
  display: grid;
  flex: 0 0 40px;
  place-items: center;
  border-radius: 12px;
  font-size: 18px;
}

.list-main {
  min-width: 0;
  flex: 1;
}

.list-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 7px;
}

.list-title {
  min-width: 0;
  overflow: hidden;
  font-size: 13px;
  font-weight: 650;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.list-amount {
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 750;
}

.list-desc {
  margin-top: 5px;
  overflow: hidden;
  color: var(--text-secondary);
  font-size: 10px;
  line-height: 1.4;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.list-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 7px;
  color: var(--text-light);
  font-size: 9px;
}

.list-arrow {
  align-self: center;
  color: #c1c8d1;
  font-size: 18px;
}

/* =========================================================
   项目排行
========================================================= */
.rank-item {
  display: grid;
  grid-template-columns: 26px minmax(0,1fr) auto;
  align-items: center;
  gap: 9px;
  margin-bottom: 14px;
}

.rank-item:last-child {
  margin-bottom: 0;
}

.rank-no {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: #667085;
  background: #f2f4f7;
  font-size: 10px;
  font-weight: 700;
}

.rank-item:nth-child(1) .rank-no {
  color: #9a5c00;
  background: #fff1cc;
}

.rank-item:nth-child(2) .rank-no {
  color: #596579;
  background: #e9edf3;
}

.rank-item:nth-child(3) .rank-no {
  color: #9b5c36;
  background: #f8e2d3;
}

.rank-info {
  min-width: 0;
}

.rank-name-row {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  font-size: 11px;
}

.rank-name {
  overflow: hidden;
  font-weight: 600;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.rank-bar {
  height: 5px;
  margin-top: 7px;
  overflow: hidden;
  border-radius: 5px;
  background: #edf1f5;
}

.rank-bar i {
  display: block;
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, #1677ff, #5aa5ff);
}

.rank-change {
  min-width: 38px;
  text-align: right;
  font-size: 10px;
}

/* =========================================================
   财务模块功能菜单
========================================================= */
.finance-menu-card {
  padding: 13px;
}

.finance-menu-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px 4px;
}

.finance-menu-item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 0;
  color: #475467;
  border: 0;
  background: transparent;
  font-size: 10px;
}

.finance-menu-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  font-size: 20px;
}

/* =========================================================
   横向筛选
========================================================= */
.horizontal-scroll {
  display: flex;
  gap: 8px;
  margin: 0 -13px 11px;
  padding: 0 13px;
  overflow-x: auto;
  scrollbar-width: none;
}

.filter-chip {
  height: 31px;
  flex: 0 0 auto;
  padding: 0 13px;
  color: #667085;
  border: 1px solid #e1e7ee;
  border-radius: 16px;
  background: white;
  font-size: 11px;
}

.filter-chip.active {
  color: white;
  border-color: var(--primary);
  background: var(--primary);
}

/* =========================================================
   页面数据概览
========================================================= */
.summary-card {
  padding: 15px;
}

.summary-head {

}

.summary-label {
  color: var(--text-secondary);

}

.summary-value {
  margin-top: 7px;

}

.summary-trend {
  margin-top: 7px;

  font-size: 10px;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid #edf0f4;
}

.summary-grid-item {
  text-align: center;
}

.summary-grid-item:not(:last-child) {
  border-right: 1px solid #edf0f4;
}

.summary-grid-item strong {
  display: block;
  font-size: 13px;
}

.summary-grid-item span {
  display: block;
  margin-top: 5px;

  font-size: 9px;
}

/* =========================================================
   审批
========================================================= */
.approval-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-bottom: 11px;
  padding: 4px;
  border-radius: 13px;
  background: #e9eef5;
}

.approval-tab {
  height: 34px;
  padding: 0 4px;
  color: #667085;
  border: 0;
  border-radius: 10px;
  background: transparent;
  font-size: 10px;
}

.approval-tab.active {
  color: var(--primary);
  background: white;
  box-shadow: 0 3px 10px rgba(31,48,77,.08);
  font-weight: 650;
}

.approval-card {
  margin-bottom: 10px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: white;
  box-shadow: var(--shadow);
}

.approval-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.approval-type {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 700;
}

.approval-time {
  color: var(--text-light);
  font-size: 9px;
}

.approval-title {
  margin-top: 12px;
  font-size: 13px;
  font-weight: 650;
}

.approval-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 11px;
  padding: 10px;
  border-radius: 10px;
  background: #f7f9fc;
}

.approval-info span {
  color: var(--text-light);
  font-size: 9px;
}

.approval-info strong {
  display: block;
  margin-top: 4px;
  font-size: 11px;
}

.risk-tip {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  margin-top: 10px;
  padding: 9px 10px;
  color: #b85e16;
  border: 1px solid #ffe1b2;
  border-radius: 9px;
  background: #fff8ea;
  font-size: 9px;
  line-height: 1.45;
}

.approval-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 11px;
}

.approval-node {
  color: var(--text-secondary);
  font-size: 9px;
}

.approval-actions {
  display: flex;
  gap: 7px;
}

/* =========================================================
   账龄分布
========================================================= */
.aging-row {
  margin-bottom: 13px;
}

.aging-row:last-child {
  margin-bottom: 0;
}

.aging-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
  font-size: 10px;
}

.aging-head span {
  color: var(--text-secondary);
}

.aging-progress {

  border-radius: 6px;
  background: #edf1f5;
}

.aging-progress i {
  display: block;

}

/* =========================================================
   预警
========================================================= */
.warning-card {
  display: flex;
  gap: 11px;

  border-radius: 15px;
  background: white;

}

.warning-level {
  width: 42px;
  height: 42px;
  display: grid;
  flex: 0 0 42px;
  place-items: center;
  border-radius: 13px;
  font-size: 19px;
}

.warning-main {
  min-width: 0;
  flex: 1;
}

.warning-title-row {
  display: flex;
  justify-content: space-between;
  gap: 7px;
}

.warning-title {
  font-size: 13px;
  font-weight: 650;
}

.warning-time {
  flex-shrink: 0;
  color: var(--text-light);
  font-size: 9px;
}

.warning-desc {
  margin-top: 6px;
  color: var(--text-secondary);
  font-size: 10px;
  line-height: 1.5;
}

.warning-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
}

/* =========================================================
   我的
========================================================= */
.profile-card {
  position: relative;
  min-height: 135px;
  margin-bottom: 11px;
  overflow: hidden;
  padding: 20px 16px;
  color: white;
  border-radius: 19px;
  background:
    radial-gradient(circle at 90% 10%, rgba(255,255,255,.18), transparent 30%),
    linear-gradient(135deg, #1c73e8, #5545cf);
  box-shadow: 0 12px 28px rgba(50,84,192,.22);
}

.profile-head {
  display: flex;
  align-items: center;
  gap: 13px;
}

.avatar {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  border: 2px solid rgba(255,255,255,.45);
  border-radius: 18px;
  background: rgba(255,255,255,.16);
  font-size: 23px;
  font-weight: 750;
}

.profile-name {
  font-size: 18px;
  font-weight: 750;
}

.profile-role {
  margin-top: 5px;
  color: rgba(255,255,255,.75);
  font-size: 10px;
}

.profile-permission {
  display: flex;
  gap: 7px;
  margin-top: 17px;
}

.profile-tag {
  padding: 5px 8px;
  border-radius: 8px;
  color: rgba(255,255,255,.85);
  background: rgba(255,255,255,.12);
  font-size: 9px;
}

.setting-item {
  min-height: 52px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 14px;
  border-bottom: 1px solid #f0f2f5;
  background: white;
}

.setting-item:last-child {
  border-bottom: 0;
}

.setting-icon {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  font-size: 15px;
}

.setting-name {
  flex: 1;
  font-size: 12px;
}

.setting-value {
  color: var(--text-light);
  font-size: 10px;
}

/* =========================================================
   底部弹层
========================================================= */
.overlay {
  position: absolute;
  z-index: 200;
  inset: 0;
  display: none;
  background: rgba(15,23,42,.48);
  backdrop-filter: blur(2px);
}

.overlay.show {
  display: block;
}

.bottom-sheet {
  position: absolute;
  z-index: 210;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: calc(100% - 36px);
  overflow: hidden;
  border-radius: 22px 22px 0 0;
  background: #f7f9fc;
  box-shadow: 0 -15px 45px rgba(15,23,42,.18);
  transform: translateY(105%);
  transition: transform .27s ease;
}

.overlay.show .bottom-sheet {
  transform: translateY(0);
}

.sheet-handle {
  width: 38px;
  height: 4px;
  margin: 8px auto 4px;
  border-radius: 3px;
  background: #d5dbe3;
}

.sheet-header {
  min-height: 55px;
  display: flex;
  align-items: center;
  padding: 8px 16px 10px;
  border-bottom: 1px solid #e9edf2;
  background: white;
}

.sheet-title {
  flex: 1;
  font-size: 16px;
  font-weight: 750;
}

.sheet-close {
  width: 31px;
  height: 31px;
  padding: 0;
  color: #667085;
  border: 0;
  border-radius: 10px;
  background: #f2f4f7;
  font-size: 18px;
}

.sheet-body {
  max-height: calc(100dvh - 190px);
  overflow-y: auto;
  padding: 12px 13px 15px;
}

.sheet-footer {
  display: flex;
  gap: 9px;
  padding: 11px 13px max(11px, env(safe-area-inset-bottom));
  border-top: 1px solid #e8edf3;
  background: white;
}

.sheet-footer .btn {
  flex: 1;
}

.detail-card {
  margin-bottom: 10px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: white;
}

.detail-title {
  margin-bottom: 10px;
  font-size: 12px;
  font-weight: 700;
}

.detail-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  min-height: 31px;
  padding: 6px 0;
  border-bottom: 1px dashed #edf0f3;
  font-size: 11px;
}

.detail-row:last-child {
  border-bottom: 0;
}

.detail-row span {
  color: var(--text-secondary);
}

.detail-row strong {
  max-width: 62%;
  text-align: right;
  word-break: break-all;
}

.timeline {
  position: relative;
  padding-left: 20px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 6px;
  bottom: 8px;
  width: 1px;
  background: #d8e1eb;
}

.timeline-item {
  position: relative;
  margin-bottom: 13px;
}

.timeline-item:last-child {
  margin-bottom: 0;
}

.timeline-item::before {
  content: "";
  position: absolute;
  left: -19px;
  top: 3px;
  width: 9px;
  height: 9px;
  border: 2px solid white;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 0 1px #b7d5ff;
}

.timeline-item.pending::before {
  background: #cbd2dc;
  box-shadow: 0 0 0 1px #dce1e7;
}

.timeline-title {
  font-size: 11px;
  font-weight: 650;
}

.timeline-desc {
  margin-top: 4px;
  color: var(--text-light);
  font-size: 9px;
  line-height: 1.5;
}

.form-group {
  margin-bottom: 13px;
}

.form-label {
  display: block;
  margin-bottom: 7px;
  color: #475467;
  font-size: 11px;
  font-weight: 600;
}

.form-control {
  width: 100%;
  min-height: 40px;
  padding: 9px 11px;
  color: var(--text);
  border: 1px solid #dce2e9;
  border-radius: 11px;
  outline: none;
  background: white;
  font-size: 12px;
}

textarea.form-control {
  min-height: 78px;
  resize: none;
}

.option-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.option-item {
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border: 1px solid #e0e6ed;
  border-radius: 11px;
  background: white;
  font-size: 11px;
}

.option-item.selected {
  color: var(--primary);
  border-color: #83b8ff;
  background: var(--primary-light);
}

/* =========================================================
   Toast
========================================================= */
.toast {
  position: absolute;
  z-index: 300;
  left: 50%;
  bottom: 88px;
  max-width: 82%;
  padding: 10px 14px;
  color: white;
  border-radius: 11px;
  background: rgba(18,25,38,.92);
  box-shadow: 0 8px 25px rgba(15,23,42,.24);
  font-size: 11px;
  line-height: 1.45;
  text-align: center;
  opacity: 0;
  transform: translate(-50%, 12px);
  pointer-events: none;
  transition: .24s;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* =========================================================
   空状态
========================================================= */
.empty-state {
  padding: 48px 20px;
  text-align: center;
}

.empty-icon {
  width: 64px;
  height: 64px;
  display: grid;
  margin: 0 auto;
  place-items: center;
  border-radius: 20px;
  color: var(--primary);
  background: var(--primary-light);
  font-size: 29px;
}

.empty-title {
  margin-top: 15px;
  font-size: 14px;
  font-weight: 650;
}

.empty-desc {
  margin-top: 7px;
  color: var(--text-light);
  font-size: 10px;
}

/* =========================================================
   桌面端手机圆角，移动端全屏
========================================================= */
@media (min-width: 601px) {
  .phone {
    border-radius: 32px;
  }

  .status-bar {
    border-radius: 32px 32px 0 0;
  }

  .tab-bar {
    border-radius: 0 0 32px 32px;
  }
}

@media (max-width: 600px) {
  .phone {
    width: 100vw;
    height: 100dvh;
    box-shadow: none;
  }
}
</style>
</head>

<body>

<div class="phone" id="phone">

  <!-- 手机状态栏 -->
  <div class="status-bar">
    <span id="systemTime">14:32</span>

    <div class="status-icons">
      <div class="signal">
        <i></i><i></i><i></i><i></i>
      </div>
      <span>5G</span>
      <div class="battery">
        <div class="battery-level"></div>
      </div>
    </div>
  </div>

  <!-- 顶部导航 -->
  <header class="app-header">
    <div class="header-left">
      <div class="header-title" id="headerTitle">经营首页</div>
      <div class="header-subtitle" id="headerSubtitle">
        华城智慧交通集团 · 全部项目
      </div>
    </div>

    <div class="header-actions">
      <button class="header-icon" onclick="openSearch()">⌕</button>

      <button class="header-icon" onclick="openMessages()">
        ♢
        <span class="header-dot"></span>
      </button>
    </div>
  </header>

  <!-- 页面 -->
  <main class="page-container">
    <div class="page" id="page">
      <div class="page-content" id="pageContent"></div>
    </div>
  </main>

  <!-- 底部导航 -->
  <nav class="tab-bar">
    <button class="tab-item active" data-route="home" onclick="navigate('home')">
      <span class="tab-icon">⌂</span>
      <span>首页</span>
    </button>

    <button class="tab-item" data-route="project" onclick="navigate('project')">
      <span class="tab-icon">▦</span>
      <span>项目</span>
    </button>

    <button class="tab-item" data-route="finance" onclick="navigate('finance')">
      <span class="tab-icon">¥</span>
      <span>财务</span>
    </button>

    <button class="tab-item" data-route="approval" onclick="navigate('approval')">
      <span class="tab-icon">
        ✓
        <i class="tab-badge" id="approvalBadge">8</i>
      </span>
      <span>审批</span>
    </button>

    <button class="tab-item" data-route="mine" onclick="navigate('mine')">
      <span class="tab-icon">♙</span>
      <span>我的</span>
    </button>
  </nav>

  <!-- 底部弹层 -->
  <div class="overlay" id="overlay" onclick="overlayClick(event)">
    <div class="bottom-sheet" id="bottomSheet">
      <div class="sheet-handle"></div>

      <div class="sheet-header">
        <div class="sheet-title" id="sheetTitle">详情</div>
        <button class="sheet-close" onclick="closeSheet()">×</button>
      </div>

      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-footer" id="sheetFooter"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* =========================================================
   应用状态
========================================================= */
const state = {
  route: "home",
  financePage: "overview",
  approvalTab: "pending",

  scope: "华城智慧交通集团",
  project: "全部项目",
  period: "今日",

  pendingApproval: 8,
  warnings: 9,

  approvedItems: [],
  collectedCustomers: [],
  reconciledItems: []
};

const pageMeta = {
  home: ["经营首页", "华城智慧交通集团 · 全部项目"],
  project: ["项目经营", "12个项目 · 5种经营业态"],
  finance: ["智慧财务", "看数 · 预警 · 跟进"],
  approval: ["审批中心", "退款、减免、结算与付款"],
  mine: ["我的", "权限、消息与管理设置"]
};

/* =========================================================
   通用方法
========================================================= */
function money(value) {
  return "¥" + value;
}

function navigate(route) {
  state.route = route;

  document.querySelectorAll(".tab-item").forEach(item => {
    item.classList.toggle(
      "active",
      item.dataset.route === route
    );
  });

  updateHeader();
  renderPage();

  document.getElementById("page").scrollTop = 0;
}

function updateHeader() {
  const meta = pageMeta[state.route] || pageMeta.home;

  document.getElementById("headerTitle").textContent = meta[0];
  document.getElementById("headerSubtitle").textContent =
    state.route === "home" || state.route === "finance"
      ? `${state.scope} · ${state.project}`
      : meta[1];
}

function renderPage() {
  const templates = {
    home: homePage,
    project: projectPage,
    finance: financePage,
    approval: approvalPage,
    mine: minePage
  };

  document.getElementById("pageContent").innerHTML =
    templates[state.route]();

  updateBadges();
}

function updateBadges() {
  const badge = document.getElementById("approvalBadge");

  if (badge) {
    badge.textContent = state.pendingApproval;
    badge.style.display = state.pendingApproval > 0 ? "block" : "none";
  }
}

function showToast(text) {
  const toast = document.getElementById("toast");

  toast.textContent = text;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2400);
}

/* =========================================================
   通用模板
========================================================= */
function scopeCard() {
  return `
    <button class="scope-card" style="width:100%;text-align:left;border:1px solid #e4ebf4"
            onclick="openScopeSelector()">
      <div class="scope-main">
        <div class="scope-icon">⌾</div>
        <div style="min-width:0">
          <div class="scope-name">${state.scope} · ${state.project}</div>
          <div class="scope-time">${state.period} · 数据更新于 2026-07-19 14:32</div>
        </div>
      </div>
      <span class="scope-arrow">›</span>
    </button>
  `;
}

function lineChart() {
  return `
    <div class="chart-wrap">
      <svg class="chart-svg" viewBox="0 0 340 140">
        <defs>
          <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1677ff" stop-opacity=".28"/>
            <stop offset="100%" stop-color="#1677ff" stop-opacity=".02"/>
          </linearGradient>
        </defs>

        <line x1="18" y1="20" x2="330" y2="20" stroke="#edf1f5"/>
        <line x1="18" y1="53" x2="330" y2="53" stroke="#edf1f5"/>
        <line x1="18" y1="86" x2="330" y2="86" stroke="#edf1f5"/>
        <line x1="18" y1="118" x2="330" y2="118" stroke="#edf1f5"/>

        <path
          d="M18 101
             L68 82
             L118 91
             L168 57
             L218 68
             L268 37
             L320 49
             L320 118
             L18 118 Z"
          fill="url(#areaGradient)"
        />

        <path
          d="M18 101
             L68 82
             L118 91
             L168 57
             L218 68
             L268 37
             L320 49"
          fill="none"
          stroke="#1677ff"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        ${[
          [18,101],[68,82],[118,91],[168,57],
          [218,68],[268,37],[320,49]
        ].map(point => `
          <circle
            cx="${point[0]}"
            cy="${point[1]}"
            r="3.5"
            fill="#fff"
            stroke="#1677ff"
            stroke-width="2"
          />
        `).join("")}

        <text x="8" y="136" class="chart-label">7/13</text>
        <text x="58" y="136" class="chart-label">7/14</text>
        <text x="108" y="136" class="chart-label">7/15</text>
        <text x="158" y="136" class="chart-label">7/16</text>
        <text x="208" y="136" class="chart-label">7/17</text>
        <text x="258" y="136" class="chart-label">7/18</text>
        <text x="309" y="136" class="chart-label">今日</text>
      </svg>
    </div>
  `;
}

function metricCard(icon, iconClass, label, value, desc) {
  return `
    <div class="metric-card">
      <div class="metric-icon ${iconClass}">${icon}</div>
      <div class="metric-label">${label}</div>
      <div class="metric-value">${value}</div>
      <div class="metric-desc">${desc}</div>
    </div>
  `;
}

/* =========================================================
   首页
========================================================= */
function homePage() {
  return `
    ${scopeCard()}

    <section class="finance-hero">
      <div class="hero-top">
        <span class="hero-label">今日实收</span>
        <span class="hero-date">2026年7月19日</span>
      </div>

      <div class="hero-amount">
        <small>¥</small>86,420.50
      </div>

      <div class="hero-meta">
        <span>订单 <b>3,268</b> 笔</span>
        <span>较昨日 <b>+12.6%</b></span>
      </div>

      <div class="hero-footer">
        <div class="hero-progress">
          <div class="hero-progress-bar"></div>
        </div>
        <span class="hero-progress-text">本月目标 72%</span>
      </div>
    </section>

    <div class="metric-grid">
      ${metricCard(
        "月",
        "icon-blue",
        "本月收入",
        "¥1,286,300",
        "环比 <span class='up'>+8.2%</span>"
      )}

      ${metricCard(
        "收",
        "icon-orange",
        "应收未收",
        "¥326,800",
        "收缴率 84.5%"

function openSheet(title, body, footer = "") {
  document.getElementById("sheetTitle").textContent = title;
  document.getElementById("sheetBody").innerHTML = body;
  document.getElementById("sheetFooter").innerHTML = footer;
  document.getElementById("overlay").classList.add("show");
}

function closeSheet() {
  document.getElementById("overlay").classList.remove("show");
}

function overlayClick(event) {
  if (event.target.id === "overlay") {
    closeSheet();
  }
}

  element.parentElement
    .querySelectorAll(".option-item")
    .forEach(item => item.classList.remove("selected"));

  element.classList.add("selected");
}

function selectOption(element) {
  element.parentElement
    .querySelectorAll(".option-item")
    .forEach(item => item.classList.remove("selected"));

  element.classList.add("selected");
}

    document.querySelector("#sheetBody [data-scope].selected");

        ${messageItem("结", "云湖花园结算单等待审批", "本期应结¥36,827.70", "2小时前", "settlement")}
      </section>
    `,
    `
      <button class="btn btn-block" onclick="showToast('全部消息已标记为已读')">
        全部标记已读
      </button>
    `
  );
}

function messageItem(icon, title, desc, time, target) {
  return `
    <div class="list-item" onclick="closeSheet();${
      target === "approval"
        ? "navigate('approval')"
        : `openFinancePage('${target}')`
    }">
      <div class="list-icon icon-blue">${icon}</div>
      <div class="list-main">
        <div class="list-title">${title}</div>
        <div class="list-desc">${desc}</div>
        <div class="list-meta">${time}</div>
      </div>
      <span class="list-arrow">›</span>
    </div>
  `;
}

function openSearch() {
  openSheet(
    "全局搜索",
    `
      <div class="form-group">
        <input class="form-control"
          placeholder="订单号、车牌、客户、项目或审批单号"
          autofocus>
      </div>

      <div class="detail-card">
        <div class="detail-title">常用搜索</div>
        <div class="option-grid">
          <div class="option-item" onclick="showToast('正在搜索停车订单')">停车订单</div>
          <div class="option-item" onclick="showToast('正在搜索欠费客户')">欠费客户</div>
          <div class="option-item" onclick="showToast('正在搜索审批单')">审批单</div>
          <div class="option-item" onclick="showToast('正在搜索结算单')">结算单</div>
        </div>
      </div>
    `,
    `
      <button class="btn btn-primary btn-block" onclick="showToast('搜索结果已更新')">
        搜索
      </button>
    `
  );
}

/* =========================================================
   系统时间
========================================================= */
function updateSystemTime() {
  const now = new Date();

  document.getElementById("systemTime").textContent =
    now.toLocaleTimeString("zh-CN", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });
}

/* =========================================================
   初始化
========================================================= */
updateSystemTime();
setInterval(updateSystemTime, 30000);

updateHeader();
renderPage();
</script>

</body>
