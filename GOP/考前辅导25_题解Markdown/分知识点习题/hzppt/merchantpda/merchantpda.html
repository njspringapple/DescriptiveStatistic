<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>
<title>惠泊商户通｜停车优惠券管理</title>

<style>
:root {
  --primary: #1769e8;
  --primary-dark: #0d55c5;
  --primary-soft: #eaf3ff;
  --cyan: #11a8bd;
  --green: #15966f;
  --green-soft: #e8f8f2;
  --orange: #e88224;
  --orange-soft: #fff3e5;
  --red: #d84e4e;
  --red-soft: #fff0f0;
  --purple: #7257ce;
  --purple-soft: #f1edff;

  --text: #1c2d3d;
  --text-2: #526579;
  --text-3: #81909d;
  --line: #e4eaf0;
  --line-dark: #d6e0e8;
  --page: #f2f5f8;
  --card: #ffffff;
  --shadow: 0 8px 24px rgba(35, 61, 83, .08);

  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  background:
    radial-gradient(circle at 25% 12%, rgba(31, 132, 255, .13), transparent 27%),
    radial-gradient(circle at 84% 70%, rgba(28, 199, 165, .10), transparent 25%),
    linear-gradient(145deg, #071426, #0a1e35 55%, #06101f);
  font-family:
    "Microsoft YaHei",
    "PingFang SC",
    "Noto Sans SC",
    Arial,
    sans-serif;
  color: var(--text);
}

body {
  display: flex;
  justify-content: center;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

input,
select,
textarea {
  outline: none;
}

/* ========================================
   PDA设备容器
======================================== */

.device-shell {
  position: relative;
  width: 430px;
  min-height: 100vh;
  overflow: hidden;
  background: var(--page);
}

@media (min-width: 700px) {
  body {
    align-items: center;
    padding: 22px;
  }

  .device-shell {
    min-height: 860px;
    height: min(900px, calc(100vh - 44px));
    border: 9px solid #122638;
    border-radius: 31px;
    box-shadow:
      0 35px 90px rgba(0, 0, 0, .48),
      0 0 0 1px rgba(100, 214, 245, .18),
      inset 0 1px 0 rgba(255, 255, 255, .12);
  }

  .device-shell::before {
    content: "";
    position: absolute;
    z-index: 1000;
    left: 50%;
    top: 5px;
    width: 72px;
    height: 5px;
    transform: translateX(-50%);
    border-radius: 5px;
    background: #263d4e;
  }
}

.app {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--page);
}

/* ========================================
   顶部状态栏和导航
======================================== */

.status-bar {
  position: absolute;
  z-index: 50;
  left: 0;
  right: 0;
  top: 0;
  height: 25px;
  padding: 6px 15px 0;
  display: flex;
  justify-content: space-between;
  color: #fff;
  background: #1768d6;
  font-size: 10px;
  font-weight: 700;
}

.app-header {
  position: absolute;
  z-index: 45;
  left: 0;
  right: 0;
  top: 25px;
  height: 59px;
  padding: 0 14px;
  display: grid;
  grid-template-columns: 42px 1fr 76px;
  align-items: center;
  color: #fff;
  background:
    radial-gradient(circle at 85% 0%, rgba(105, 229, 255, .25), transparent 36%),
    linear-gradient(135deg, #1769e8, #118da9);
  box-shadow: 0 4px 16px rgba(20, 100, 185, .19);
}

.header-back,
.header-action {
  height: 38px;
  display: grid;
  place-items: center;
  color: #fff;
  background: transparent;
}

.header-back {
  width: 38px;
  border-radius: 12px;
  font-size: 26px;
}

.header-back.hidden {
  visibility: hidden;
}

.header-title {
  min-width: 0;
  text-align: center;
}

.header-title strong {
  display: block;
  overflow: hidden;
  font-size: 16px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.header-title span {
  display: block;
  margin-top: 3px;
  overflow: hidden;
  color: rgba(255, 255, 255, .72);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.header-actions {
  display: flex;
  justify-content: flex-end;
}

.header-action {
  position: relative;
  width: 36px;
  border-radius: 10px;
  font-size: 19px;
}

.message-dot {
  position: absolute;
  right: 5px;
  top: 5px;
  min-width: 15px;
  height: 15px;
  padding: 0 4px;
  display: grid;
  place-items: center;
  border: 2px solid #1683c4;
  border-radius: 9px;
  color: #fff;
  background: #f04f59;
  font-size: 7px;
  font-style: normal;
}

/* ========================================
   页面和底部导航
======================================== */

.page-container {
  position: absolute;
  left: 0;
  right: 0;
  top: 84px;
  bottom: 68px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
}

.page-container::-webkit-scrollbar {
  display: none;
}

.page {
  min-height: 100%;
  padding: 12px 12px 24px;
}

.bottom-nav {
  position: absolute;
  z-index: 45;
  left: 0;
  right: 0;
  bottom: 0;
  height: calc(68px + var(--safe-bottom));
  padding: 7px 5px var(--safe-bottom);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid #e0e7ed;
  background: rgba(255, 255, 255, .97);
  box-shadow: 0 -5px 18px rgba(34, 58, 78, .05);
  backdrop-filter: blur(14px);
}

.nav-button {
  position: relative;
  min-width: 0;
  padding: 3px 0;
  color: #85929d;
  background: transparent;
  text-align: center;
}

.nav-icon {
  display: grid;
  width: 28px;
  height: 28px;
  margin: 0 auto;
  place-items: center;
  border-radius: 9px;
  font-size: 17px;
}

.nav-button span {
  display: block;
  margin-top: 2px;
  font-size: 9px;
}

.nav-button.active {
  color: var(--primary);
  font-weight: 700;
}

.nav-button.active .nav-icon {
  background: var(--primary-soft);
}

/* ========================================
   通用组件
======================================== */

.card {
  margin-bottom: 10px;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--card);
  box-shadow: 0 5px 17px rgba(34, 64, 88, .045);
}

.card.compact {
  padding: 11px;
}

.section-header {
  margin: 15px 2px 9px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #304558;
  font-size: 13px;
  font-weight: 800;
}

.section-title::before {
  content: "";
  width: 4px;
  height: 14px;
  border-radius: 3px;
  background: linear-gradient(180deg, var(--primary), var(--cyan));
}

.section-more {
  padding: 5px;
  color: var(--primary);
  background: transparent;
  font-size: 10px;
}

.muted {
  color: var(--text-3);
}

.link-button {
  padding: 4px;
  color: var(--primary);
  background: transparent;
  font-size: 11px;
  font-weight: 700;
}

.primary-btn,
.secondary-btn,
.danger-btn,
.warning-btn,
.ghost-btn {
  min-height: 42px;
  padding: 0 15px;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 800;
}

.primary-btn {
  color: #fff;
  background: linear-gradient(135deg, var(--primary), #149eb3);
  box-shadow: 0 7px 16px rgba(23, 105, 232, .20);
}

.secondary-btn {
  color: var(--primary);
  border: 1px solid #cfe0f3;
  background: #edf5ff;
}

.warning-btn {
  color: #a25d18;
  border: 1px solid #f0d1ae;
  background: var(--orange-soft);
}

.danger-btn {
  color: var(--red);
  border: 1px solid #f0caca;
  background: var(--red-soft);
}

.ghost-btn {
  color: var(--text-2);
  border: 1px solid var(--line-dark);
  background: #fff;
}

.small-btn {
  min-height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 10px;
}

.full-btn {
  width: 100%;
}

.button-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.button-row.three {
  grid-template-columns: repeat(3, 1fr);
}

.badge {
  display: inline-flex;
  min-height: 22px;
  padding: 0 8px;
  align-items: center;
  border-radius: 11px;
  color: #1769b6;
  background: #e7f2ff;
  font-size: 9px;
  font-weight: 700;
}

.badge.green {
  color: #12785a;
  background: var(--green-soft);
}

.badge.orange {
  color: #a9601d;
  background: var(--orange-soft);
}

.badge.red {
  color: #b83f3f;
  background: var(--red-soft);
}

.badge.purple {
  color: #664dbb;
  background: var(--purple-soft);
}

.badge.gray {
  color: #677684;
  background: #edf1f4;
}

.amount-positive {
  color: var(--green) !important;
}

.amount-negative {
  color: var(--red) !important;
}

.amount-warning {
  color: var(--orange) !important;
}

.empty-state {
  padding: 42px 18px;
  color: var(--text-3);
  text-align: center;
}

.empty-icon {
  width: 62px;
  height: 62px;
  margin: 0 auto 13px;
  display: grid;
  place-items: center;
  border-radius: 20px;
  color: #6fa9d6;
  background: #e9f3fb;
  font-size: 28px;
}

.empty-state strong {
  display: block;
  color: var(--text-2);
  font-size: 14px;
}

.empty-state span {
  display: block;
  margin-top: 7px;
  font-size: 11px;
  line-height: 1.6;
}

/* ========================================
   表单
======================================== */

.form-group {
  margin-bottom: 13px;
}

.form-label {
  margin-bottom: 7px;
  display: flex;
  justify-content: space-between;
  color: #536678;
  font-size: 11px;
  font-weight: 700;
}

.form-label em {
  color: var(--red);
  font-style: normal;
}

.form-control {
  width: 100%;
  height: 43px;
  padding: 0 12px;
  border: 1px solid #dce4eb;
  border-radius: 11px;
  color: var(--text);
  background: #fff;
  font-size: 13px;
  transition: border-color .2s, box-shadow .2s;
}

textarea.form-control {
  height: 78px;
  padding-top: 10px;
  resize: none;
}

.form-control:focus {
  border-color: #64a6ed;
  box-shadow: 0 0 0 3px rgba(51, 133, 224, .10);
}

.form-control.invalid {
  border-color: #e36b6b;
  background: #fffafa;
}

.form-tip {
  margin-top: 6px;
  color: var(--text-3);
  font-size: 9px;
  line-height: 1.5;
}

.form-error {
  margin-top: 5px;
  color: var(--red);
  font-size: 9px;
}

.input-action {
  position: relative;
}

.input-action .form-control {
  padding-right: 92px;
}

.input-inner-btn {
  position: absolute;
  right: 5px;
  top: 5px;
  height: 33px;
  padding: 0 12px;
  border-radius: 8px;
  color: #fff;
  background: var(--primary);
  font-size: 11px;
  font-weight: 700;
}

.radio-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.radio-card {
  position: relative;
  min-height: 63px;
  padding: 10px;
  border: 1px solid #dfe6ec;
  border-radius: 11px;
  background: #fff;
  cursor: pointer;
}

.radio-card.active {
  border-color: var(--primary);
  background: #edf5ff;
  box-shadow: 0 0 0 2px rgba(23, 105, 232, .07);
}

.radio-card.disabled {
  opacity: .48;
  cursor: not-allowed;
}

.radio-card strong {
  display: block;
  color: #354b5d;
  font-size: 11px;
}

.radio-card span {
  display: block;
  margin-top: 5px;
  color: var(--text-3);
  font-size: 9px;
  line-height: 1.4;
}

.radio-card.active strong {
  color: var(--primary);
}

.radio-check {
  position: absolute;
  right: 7px;
  top: 7px;
  width: 16px;
  height: 16px;
  display: none;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: var(--primary);
  font-size: 9px;
}

.radio-card.active .radio-check {
  display: grid;
}

/* ========================================
   首页
======================================== */

.merchant-banner {
  position: relative;
  overflow: hidden;
  padding: 16px;
  border-radius: 17px;
  color: #fff;
  background:
    radial-gradient(circle at 90% 0%, rgba(255, 255, 255, .22), transparent 35%),
    linear-gradient(135deg, #1769e8, #138eac);
  box-shadow: 0 11px 25px rgba(19, 107, 195, .24);
}

.merchant-banner::after {
  content: "P";
  position: absolute;
  right: 14px;
  bottom: -42px;
  color: rgba(255, 255, 255, .08);
  font-size: 130px;
  font-weight: 900;
}

.merchant-head {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.merchant-name {
  font-size: 16px;
  font-weight: 800;
}

.merchant-store {
  margin-top: 5px;
  color: rgba(255, 255, 255, .74);
  font-size: 10px;
}

.mode-badge {
  padding: 5px 8px;
  border: 1px solid rgba(255, 255, 255, .23);
  border-radius: 10px;
  background: rgba(255, 255, 255, .13);
  font-size: 9px;
}

.balance-label {
  position: relative;
  z-index: 2;
  margin-top: 17px;
  color: rgba(255, 255, 255, .72);
  font-size: 10px;
}

.balance-value {
  position: relative;
  z-index: 2;
  margin-top: 4px;
  font-size: 29px;
  font-weight: 800;
}

.balance-detail {
  position: relative;
  z-index: 2;
  margin-top: 13px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.balance-item {
  padding: 8px 7px;
  border-radius: 9px;
  background: rgba(255, 255, 255, .12);
}

.balance-item span {
  display: block;
  color: rgba(255, 255, 255, .68);
  font-size: 8px;
}

.balance-item strong {
  display: block;
  margin-top: 4px;
  font-size: 11px;
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}

.quick-button {
  min-width: 0;
  padding: 10px 4px;
  border: 1px solid var(--line);
  border-radius: 13px;
  color: var(--text-2);
  background: #fff;
  box-shadow: 0 5px 14px rgba(37, 64, 86, .04);
}

.quick-icon {
  width: 38px;
  height: 38px;
  margin: 0 auto;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: var(--primary);
  background: var(--primary-soft);
  font-size: 19px;
}

.quick-button:nth-child(2) .quick-icon {
  color: var(--purple);
  background: var(--purple-soft);
}

.quick-button:nth-child(3) .quick-icon {
  color: var(--orange);
  background: var(--orange-soft);
}

.quick-button:nth-child(4) .quick-icon {
  color: var(--green);
  background: var(--green-soft);
}

.quick-button span {
  display: block;
  margin-top: 7px;
  overflow: hidden;
  font-size: 10px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.plate-quick-card {
  padding: 13px;
  border: 1px solid #d7e5f1;
  border-radius: 14px;
  background: #f6fbff;
}

.plate-input-row {
  display: grid;
  grid-template-columns: 1fr 78px;
  gap: 8px;
}

.plate-input {
  height: 44px;
  padding: 0 12px;
  border: 1px solid #cee0ee;
  border-radius: 11px;
  color: #244159;
  background: #fff;
  font-size: 15px;
  font-weight: 800;
  text-transform: uppercase;
}

.plate-search-btn {
  border-radius: 11px;
  color: #fff;
  background: linear-gradient(135deg, var(--primary), #139eb1);
  font-size: 12px;
  font-weight: 800;
}

.recent-plates {
  margin-top: 9px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
}

.plate-chip {
  flex: 0 0 auto;
  padding: 6px 8px;
  border: 1px solid #dbe5ec;
  border-radius: 9px;
  color: #526a7b;
  background: #fff;
  font-size: 9px;
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.metric-card {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fff;
}

.metric-card span {
  color: var(--text-3);
  font-size: 9px;
}

.metric-card strong {
  display: block;
  margin-top: 5px;
  color: #294155;
  font-size: 19px;
}

.metric-card em {
  display: block;
  margin-top: 4px;
  color: var(--green);
  font-size: 8px;
  font-style: normal;
}

.task-list {
  display: grid;
  gap: 8px;
}

.task-item {
  padding: 11px;
  display: grid;
  grid-template-columns: 34px 1fr auto;
  align-items: center;
  gap: 9px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
}

.task-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: var(--orange);
  background: var(--orange-soft);
}

.task-item strong {
  display: block;
  color: #354b5e;
  font-size: 11px;
}

.task-item span {
  display: block;
  margin-top: 4px;
  color: var(--text-3);
  font-size: 8px;
}

/* ========================================
   车牌查询和发券
======================================== */

.plate-search-panel {
  padding: 14px;
  border: 1px solid #d7e4ef;
  border-radius: 15px;
  background:
    radial-gradient(circle at 95% 0%, rgba(70, 169, 255, .10), transparent 35%),
    #fff;
}

.search-tools {
  margin-top: 9px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.tool-btn {
  height: 37px;
  border: 1px solid #dbe5ed;
  border-radius: 9px;
  color: #5b7182;
  background: #f8fafc;
  font-size: 10px;
  font-weight: 700;
}

.order-status-card {
  position: relative;
  overflow: hidden;
  border-color: #cae1f1;
  background:
    radial-gradient(circle at 90% 0%, rgba(30, 145, 224, .09), transparent 31%),
    #fff;
}

.order-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.order-plate {
  color: #1d3e58;
  font-size: 21px;
  font-weight: 900;
  letter-spacing: 1px;
}

.order-lot {
  margin-top: 5px;
  color: var(--text-3);
  font-size: 9px;
}

.order-data {
  margin-top: 11px;
  padding-top: 9px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  border-top: 1px solid #edf1f4;
}

.order-data-item span {
  display: block;
  color: var(--text-3);
  font-size: 8px;
}

.order-data-item strong {
  display: block;
  margin-top: 4px;
  color: #354c5e;
  font-size: 11px;
}

.fee-summary {
  margin-top: 10px;
  padding: 11px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-radius: 11px;
  background: #f4f7fa;
}

.fee-item {
  text-align: center;
  border-right: 1px solid #dfe6eb;
}

.fee-item:last-child {
  border-right: 0;
}

.fee-item span {
  display: block;
  color: var(--text-3);
  font-size: 8px;
}

.fee-item strong {
  display: block;
  margin-top: 5px;
  color: #354c5e;
  font-size: 13px;
}

.fee-item.payable strong {
  color: var(--orange);
}

.existing-discount {
  margin-top: 9px;
  padding: 9px;
  display: flex;
  justify-content: space-between;
  border-radius: 9px;
  color: #466b84;
  background: #edf7ff;
  font-size: 9px;
}

.coupon-choice-list {
  display: grid;
  gap: 8px;
}

.coupon-choice {
  position: relative;
  padding: 12px 42px 12px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
}

.coupon-choice.active {
  border-color: var(--primary);
  background: #f3f8ff;
}

.coupon-choice.disabled {
  opacity: .48;
  cursor: not-allowed;
}

/* ========================================
   弹窗、抽屉、Toast
======================================== */

.overlay {
  position: absolute;
  z-index: 200;
  inset: 0;
  display: none;
  align-items: flex-end;
  background: rgba(7, 17, 28, .54);
  backdrop-filter: blur(2px);
}

.overlay.show {
  display: flex;
}

.modal {
  width: 100%;
  max-height: 88%;
  overflow-y: auto;
  border-radius: 22px 22px 0 0;
  background: var(--page);
  box-shadow: 0 -12px 40px rgba(0, 0, 0, .20);
  animation: modalIn .22s ease-out;
}

@keyframes modalIn {
  from {
    transform: translateY(45px);
    opacity: .4;
  }

  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.modal-header {
  position: sticky;
  z-index: 3;
  top: 0;
  min-height: 57px;
  padding: 0 14px;
  display: grid;
  grid-template-columns: 40px 1fr 40px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(12px);
}

.modal-header strong {
  text-align: center;
  font-size: 15px;
}

.modal-close {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  color: #657685;
  background: #f0f3f6;
  font-size: 20px;
}

.modal-body {
  padding: 13px 13px calc(22px + var(--safe-bottom));
}

.confirm-dialog {
  width: calc(100% - 38px);
  margin: auto;
  overflow: hidden;
  border-radius: 17px;
  background: #fff;
  animation: confirmIn .18s ease-out;
}

@keyframes confirmIn {
  from {
    transform: scale(.92);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }
}

.confirm-content {
  padding: 21px 18px 16px;
  text-align: center;
}

.confirm-icon {
  width: 50px;
  height: 50px;
  margin: 0 auto 12px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  color: var(--orange);
  background: var(--orange-soft);
  font-size: 24px;
}

.confirm-content strong {
  display: block;
  font-size: 15px;
}

.confirm-content p {
  margin: 9px 0 0;
  color: var(--text-3);
  font-size: 11px;
  line-height: 1.65;
}

.confirm-actions {
  padding: 10px 13px 13px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.toast-container {
  position: absolute;
  z-index: 500;
  left: 16px;
  right: 16px;
  top: 94px;
  pointer-events: none;
}

.toast {
  margin-bottom: 8px;
  padding: 11px 13px;
  display: grid;
  grid-template-columns: 22px 1fr;
  align-items: center;
  gap: 8px;
  border-radius: 11px;
  color: #fff;
  background: rgba(24, 46, 64, .94);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .20);
  font-size: 11px;
  line-height: 1.45;
  animation: toastIn .22s ease-out;
}

.toast.success {
  background: rgba(18, 126, 94, .96);
}

.toast.error {
  background: rgba(189, 63, 63, .96);
}

.toast.warning {
  background: rgba(183, 104, 30, .96);
}

@keyframes toastIn {
  from {
    transform: translateY(-10px);
    opacity: 0;
  }
}

   加载、成功页
======================================== */

.loading-mask {

/* ========================================

.switch {
  position: relative;

  height: 24px;
  flex: 0 0 42px;
  border-radius: 13px;
  background: #ccd5dc;
  cursor: pointer;
  transition: background .2s;

.switch::after {
  content: "";

  top: 3px;

  border-radius: 50%;

function deepClone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : deepClone(seedState);
  } catch (error) {
    return deepClone(seedState);
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  updateMessageCount();
}

function resetState() {
  state = deepClone(seedState);
  saveState();
}

/* =========================================================
   工具
========================================================= */

function money(value) {
  return "¥" + Number(value || 0).toLocaleString("zh-CN", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function formatInteger(value) {
  return Number(value || 0).toLocaleString("zh-CN");
}

function nowString() {
  return new Date().toLocaleString("zh-CN", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).replace(/\//g, "-");
}

function generateId(prefix) {
  return prefix + Date.now().toString().slice(-10);
}

function getInventory(id) {
  return state.inventory.find(item => item.id === id);
}

function getOrder(id) {
  return state.parkingOrders.find(item => item.id === id);
}

function getBill(id) {
  return state.bills.find(item => item.id === id);
}

function getEmployee(id) {
  return state.employees.find(item => item.id === id);
}

function hasPermission(permission) {
  return state.currentUser.permissions.includes(permission);
}

function unreadCount() {
  return state.messages.filter(item => !item.read).length;
}

function updateMessageCount() {
  const count = unreadCount();
  const element = document.getElementById("messageCount");
  element.textContent = count;
  element.style.display = count ? "grid" : "none";
}

function durationText(minutes) {
  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;

  if (!hours) return `${mins}分钟`;
  return `${hours}小时${mins ? mins + "分钟" : ""}`;
}

function settlementModeName(mode) {
  return {
    prepaid: "预付费",
    postpaid: "后付费",
    mixed: "混合结算"
  }[mode] || mode;
}

function couponStatusBadge(status) {
  const map = {
    issued: '<span class="badge orange">待核销</span>',
    used: '<span class="badge green">已核销</span>',
    refunded: '<span class="badge gray">已撤回</span>',
    expired: '<span class="badge red">已过期</span>'
  };

  return map[status] || `<span class="badge gray">${status}</span>`;
}

function billStatusBadge(status) {
  const map = {
    pending_confirm: '<span class="badge orange">待确认</span>',
    confirmed: '<span class="badge purple">已确认</span>',
    disputed: '<span class="badge red">有异议</span>',
    pending_payment: '<span class="badge orange">待付款</span>',
    settled: '<span class="badge green">已结清</span>'
  };

  return map[status] || `<span class="badge gray">${status}</span>`;
}

function toast(message, type = "") {
  const container = document.getElementById("toastContainer");
  const element = document.createElement("div");
  element.className = `toast ${type}`;
  element.innerHTML = `
    <span>${type === "success" ? "✓" : type === "error" ? "×" : type === "warning" ? "!" : "i"}</span>
    <span>${message}</span>
  `;

  container.appendChild(element);

  setTimeout(() => {
    element.style.opacity = "0";
    element.style.transform = "translateY(-8px)";
  }, 2600);

  setTimeout(() => element.remove(), 3000);
}

function showLoading(text = "正在处理...") {
  document.getElementById("loadingText").textContent = text;
  document.getElementById("loadingMask").classList.add("show");
}

function hideLoading() {
  document.getElementById("loadingMask").classList.remove("show");
}

function simulateRequest(callback, text = "正在处理...") {
  showLoading(text);

  setTimeout(() => {
    try {
      callback();
    } finally {
      hideLoading();
    }
  }, 650);
}

  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalOverlay").classList.add("show");

function closeModal() {

  message,
  icon = "!",
  confirmText = "确认",
  danger = false,
  onConfirm

  document.getElementById("confirmTitle").textContent = title;

function navigate(route, params = {}, pushHistory = true) {
  if (pushHistory && currentRoute !== route) {
    routeHistory.push({
      route: currentRoute,
      params: pageParams
    });
  }

  currentRoute = route;
  pageParams = params;

  const [title, subtitle] = routeMeta[route] || routeMeta.home;
  document.getElementById("pageTitle").textContent = title;
  document.getElementById("pageSubtitle").textContent = subtitle;

  document.getElementById("headerBack").classList.toggle(
    "hidden",
    ["home", "issue", "coupons", "finance", "profile"].includes(route)
  );

  document.querySelectorAll(".nav-button").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.route === route ||
      (
        button.dataset.route === "coupons" &&
        ["records"].includes(route)
      ) ||
      (
        button.dataset.route === "finance" &&
        ["settlement", "invoices", "flows", "statistics"].includes(route)
      ) ||
      (
        button.dataset.route === "profile" &&
        ["employees", "audit"].includes(route)
      )
    );
  });

  renderRoute();
  document.getElementById("pageContainer").scrollTop = 0;
}

function goBack() {
  const previous = routeHistory.pop();

  if (previous) {
    currentRoute = previous.route;
    pageParams = previous.params || {};
    navigate(currentRoute, pageParams, false);
  } else {
    navigate("home", {}, false);
  }
}

function renderRoute() {
  const renderer = {
    home: renderHome,
    issue: renderIssue,
    coupons: renderCoupons,
    finance: renderFinance,
    profile: renderProfile,
    records: renderRecords,
    statistics: renderStatistics,
    settlement: renderSettlement,
    invoices: renderInvoices,
    employees: renderEmployees,
    flows: renderFlows,
    audit: renderAudit
  }[currentRoute] || renderHome;

  document.getElementById("pageContainer").innerHTML = renderer();
}

function findOrderByPlate(plate) {
  const normalized = plate.trim().toUpperCase().replace(/\s/g, "");

  return state.parkingOrders.find(item =>
    item.plateNo.toUpperCase().replace(/\s/g, "") === normalized
  );
}

function searchParkingOrder(plate) {
  if (!plate || plate.trim().length < 6) {
    toast("请输入完整车牌号", "warning");
    return;
  }

  simulateRequest(() => {
    const order = findOrderByPlate(plate);

    if (!order) {
      openModal("未查询到停车订单", `
        <div class="empty-state">
          <div class="empty-icon">P</div>
          <strong>没有找到当前有效停车订单</strong>
          <span>
            请核对车牌号，或确认车辆是否已入场。<br>
            如识别错误，可重新拍照或手动输入。
          </span>
        </div>

        <button class="primary-btn full-btn" data-action="close-modal">
          返回修改车牌
        </button>
      `);
      return;
    }

    issueDraft.plateNo = order.plateNo;
    issueDraft.orderId = order.id;

    if (!state.recentPlates.includes(order.plateNo)) {
      state.recentPlates.unshift(order.plateNo);
      state.recentPlates = state.recentPlates.slice(0, 5);
    }

    saveState();

    if (order.status === "paid" || order.paid) {
      openModal("车辆已完成缴费", `
        <div class="card">
          <div class="order-head">
            <div>
              <div class="order-plate">${order.plateNo}</div>
              <div class="order-lot">${order.parkingLot}</div>
            </div>
            <span class="badge green">已缴费</span>
          </div>

          <div class="risk-notice">
            当前订单已经完成缴费。根据停车场规则，已缴费订单不可直接补发优惠券。
            如确需处理，请联系停车场管理员进入异常补券审批流程。
          </div>
        </div>

        <button class="ghost-btn full-btn" data-action="close-modal">

      `);
      return;

    if (order.status !== "parking") {
      toast("当前订单状态不允许发券", "error");
      return;
    }

    issueDraft.step = "select";
    renderRoute();
  }, "正在查询停车订单...");

function validateIssueDraft() {
  const item = getInventory(issueDraft.templateId);
  const order = getOrder(issueDraft.orderId);
  const remark = document.getElementById("issueRemark")?.value.trim() || "";
  const consumptionNo =
    document.getElementById("issueConsumptionNo")?.value.trim() || "";

  issueDraft.remark = remark;
  issueDraft.consumptionNo = consumptionNo;

  if (!order) return "停车订单不存在，请重新查询";
  if (!item) return "请选择要发放的优惠券";
  if (!issueDraft.fundingMode) return "请选择扣费方式";
  if (!remark) return "请填写发券备注";
  if (order.status !== "parking" || order.paid) return "车辆当前状态不允许发券";

  if (order.existingCoupons.length && !item.stackable) {
    return "该停车订单已有优惠，当前券不支持叠加";
  }

  if (
    state.currentUser.todayIssuedCount + 1 >
    state.currentUser.dailyLimitCount
  ) {
    return "已达到员工今日发券数量上限";
  }

  if (
    state.currentUser.todayIssuedAmount + item.merchantPrice >
    state.currentUser.dailyLimitAmount
  ) {
    return "本次发券将超过员工今日金额额度";
  }

  if (issueDraft.fundingMode === "inventory" && item.stock < 1) {
    return "当前优惠券库存不足";
  }

  if (
    issueDraft.fundingMode === "balance" &&
    state.merchant.balance < item.merchantPrice
  ) {
    return "账户余额不足，请先充值";
  }

  if (
    issueDraft.fundingMode === "gift" &&
    state.merchant.giftBalance < item.merchantPrice
  ) {
    return "平台赠送额度不足";
  }

  if (
    issueDraft.fundingMode === "credit" &&
    state.merchant.creditLimit - state.merchant.creditUsed <
    item.merchantPrice
  ) {
    return "后付费授信额度不足";
  }

  return null;
}

function submitIssue() {
  const error = validateIssueDraft();

  if (error) {
    toast(error, "error");
    return;
  }

  const order = getOrder(issueDraft.orderId);
  const item = getInventory(issueDraft.templateId);

  const duplicate = state.issuedCoupons.find(coupon =>
    coupon.parkingOrderId === order.id &&
    coupon.templateId === item.id &&
    coupon.status === "issued"
  );

  if (duplicate) {
    toast("该订单已发放相同优惠券，请勿重复提交", "warning");
    return;
  }

  confirmAction({
    title: "确认向该车辆发券？",
    message: `
      车牌 <b>${order.plateNo}</b><br>
      优惠券：${item.name}<br>
      商户成本：<b>${money(item.merchantPrice)}</b>
    `,
    icon: "券",
    confirmText: "确认发放",
    onConfirm: () => {
      closeConfirm();

      simulateRequest(() => {
        const couponId = generateId("C");

        if (issueDraft.fundingMode === "inventory") {
          item.stock -= 1;
        }

        if (issueDraft.fundingMode === "balance") {
          state.merchant.balance -= item.merchantPrice;
        }

        if (issueDraft.fundingMode === "gift") {
          state.merchant.giftBalance -= item.merchantPrice;
        }

        if (issueDraft.fundingMode === "credit") {
          state.merchant.creditUsed += item.merchantPrice;
          state.merchant.currentPayable += item.merchantPrice;
        }

        let discountAmount = 0;

        if (item.type === "amount") {
          discountAmount = Math.min(item.value, order.payableAmount);
        } else if (item.type === "free") {
          discountAmount = order.payableAmount;
        } else if (item.type === "duration") {
          const hourlyRate = order.currentFee /
            Math.max(order.durationMinutes / 60, 1);

          discountAmount = Math.min(
            order.payableAmount,
            Math.round(hourlyRate * (item.value / 60) * 100) / 100
          );
        }

        order.discountAmount += discountAmount;
        order.payableAmount = Math.max(
          0,
          order.currentFee - order.discountAmount
        );
        order.existingCoupons.push(item.name);

        state.issuedCoupons.unshift({
          id: couponId,
          templateId: item.id,
          templateName: item.name,
          plateNo: order.plateNo,
          parkingOrderId: order.id,
          status: item.approvalRequired ? "pending_approval" : "issued",
          statusName: item.approvalRequired ? "待审批" : "待核销",
          issueTime: nowString(),
          issuerId: state.currentUser.id,
          issuerName: state.currentUser.name,
          cost: item.merchantPrice,
          discountValue: item.faceText,
          discountAmount,
          fundingMode: issueDraft.fundingMode,
          remark: issueDraft.remark,
          consumptionNo: issueDraft.consumptionNo,
          canRefund: true,
          settlementLocked: false
        });

        state.currentUser.todayIssuedAmount += item.merchantPrice;
        state.currentUser.todayIssuedCount += 1;
        state.statistics.today.issued += 1;
        state.statistics.today.merchantCost += item.merchantPrice;

        state.flows.unshift({
          id: generateId("F"),
          type: "issue",
          name: `${item.name}发放`,
          amount:
            issueDraft.fundingMode === "inventory" ||
            issueDraft.fundingMode === "credit"
              ? 0
              : -item.merchantPrice,
          balanceAfter: state.merchant.balance,
          time: nowString(),
          relatedId: couponId,
          operator: state.currentUser.name
        });

        addAudit(
          "发放优惠券",
          `向${order.plateNo}发放${item.name}，扣费方式${issueDraft.fundingMode}`
        );

        pageParams.lastIssuedCouponId = couponId;
        issueDraft.step = "success";
        saveState();
        renderRoute();
      }, "正在校验并同步停车系统...");
    }
  });
}

function updatePurchaseSummary() {

  const item = getInventory(templateElement.value);
  const quantity = Math.max(0, Number(quantityElement.value || 0));
  const total = item.merchantPrice * quantity;

  document.getElementById("purchaseRule").textContent =
    `${item.minPurchase}张起购，单次最多${item.maxPurchase}张，购买后有效期${item.validDays}天。`;

function selectedModalRadio(group) {
  return document.querySelector(
    `.radio-card.active[data-group="${group}"]`
  )?.dataset.value;
}

function submitPurchase() {
  const item = getInventory(
    document.getElementById("purchaseTemplate")?.value
  );
  const quantity = Number(
    document.getElementById("purchaseQuantity")?.value
  );
  const payMode = selectedModalRadio("purchasePay");

  if (!item || !Number.isInteger(quantity)) {
    toast("请填写正确的购买数量", "error");
    return;
  }

  if (quantity < item.minPurchase || quantity > item.maxPurchase) {
    toast(
      `购买数量需在${item.minPurchase}至${item.maxPurchase}张之间`,
      "error"
    );
    return;
  }

  const total = item.merchantPrice * quantity;

  if (payMode === "balance" && state.merchant.balance < total) {
    toast("账户余额不足，请充值或选择其他支付方式", "error");
    return;
  }

  if (
    payMode === "credit" &&
    state.merchant.creditLimit - state.merchant.creditUsed < total
  ) {
    toast("后付费授信额度不足", "error");
    return;
  }

  if (payMode === "corporate") {
    openCorporateTransferPurchase(item, quantity, total);
    return;
  }

  confirmAction({
    title: "确认购买优惠券？",
    message: `
      ${item.name} × ${quantity}张<br>
      应付金额：<b>${money(total)}</b>
    `,
    icon: "购",
    confirmText: payMode === "wechat" ? "生成支付码" : "确认购买",
    onConfirm: () => {
      closeConfirm();

      if (payMode === "wechat") {
        showPaymentQr({
          title: "购买优惠券",
          amount: total,
          onPaid: () => completePurchase(item, quantity, total, "wechat")
        });
      } else {
        completePurchase(item, quantity, total, payMode);
      }
    }
  });
}

function completePurchase(item, quantity, total, payMode) {
  simulateRequest(() => {
    if (payMode === "balance") {
      state.merchant.balance -= total;
    }

    if (payMode === "credit") {
      state.merchant.creditUsed += total;
      state.merchant.currentPayable += total;
    }

    item.stock += quantity;

    state.flows.unshift({
      id: generateId("F"),
      type: "purchase",
      name: `购买${item.name} ${quantity}张`,
      amount: payMode === "balance" ? -total : 0,
      balanceAfter: state.merchant.balance,
      time: nowString(),
      relatedId: generateId("BUY"),
      operator: state.currentUser.name
    });

    addAudit(
      "购买优惠券",
      `${item.name}${quantity}张，金额${money(total)}，支付方式${payMode}`
    );

    saveState();
    closeModal();
    toast(`购买成功，${item.name}库存增加${quantity}张`, "success");
    renderRoute();
  }, "正在创建购券订单...");
}

function refundIssuedCoupon(id) {

    !coupon.canRefund ||

function completeIssuedRefund(id) {
  const coupon = state.issuedCoupons.find(item => item.id === id);
  const reason = document.getElementById("refundIssuedReason")?.value;

  if (!reason) {
    toast("请选择撤回原因", "warning");
    return;
  }

  if (!coupon || coupon.status !== "issued") {
    toast("优惠券状态已变化，请刷新后重试", "error");
    return;
  }

  const template = getInventory(coupon.templateId);
  const order = getOrder(coupon.parkingOrderId);

  simulateRequest(() => {
    coupon.status = "refunded";
    coupon.statusName = "已撤回";
    coupon.refundTime = nowString();
    coupon.refundReason = reason;
    coupon.canRefund = false;

    if (coupon.fundingMode === "inventory") {
      template.stock += 1;
    }

    if (coupon.fundingMode === "balance") {
      state.merchant.balance += coupon.cost;
    }

    if (coupon.fundingMode === "gift") {
      state.merchant.giftBalance += coupon.cost;
    }

    if (coupon.fundingMode === "credit") {
      state.merchant.creditUsed = Math.max(
        0,
        state.merchant.creditUsed - coupon.cost
      );
      state.merchant.currentPayable = Math.max(
        0,
        state.merchant.currentPayable - coupon.cost
      );
    }

    if (order) {
      order.existingCoupons = order.existingCoupons.filter(
        name => name !== coupon.templateName
      );

      order.discountAmount = Math.max(
        0,
        order.discountAmount - Number(coupon.discountAmount || 0)
      );

      order.payableAmount = Math.max(
        0,
        order.currentFee - order.discountAmount
      );
    }

    state.statistics.today.refunded += 1;

    state.flows.unshift({
      id: generateId("F"),
      type: "refund",
      name: `${coupon.templateName}撤回`,
      amount:
        ["balance", "gift"].includes(coupon.fundingMode)
          ? coupon.cost
          : 0,
      balanceAfter: state.merchant.balance,
      time: nowString(),
      relatedId: coupon.id,
      operator: state.currentUser.name
    });

    addAudit(
      "撤回优惠券",
      `${coupon.id}，车牌${coupon.plateNo}，原因：${reason}`
    );

    saveState();
    closeModal();
    toast("优惠券已撤回，资金或库存已恢复", "success");
    renderRoute();
  }, "正在撤回并同步停车订单...");
}

function payBill(id) {
  const bill = getBill(id);
  if (!bill) return;

  if (state.merchant.balance >= bill.finalAmount) {
    confirmAction({
      title: "使用账户余额支付账单？",
      message: `
        账单金额：<b>${money(bill.finalAmount)}</b><br>
        当前余额：${money(state.merchant.balance)}
      `,
      icon: "¥",
      confirmText: "确认支付",
      onConfirm: () => {
        closeConfirm();

        simulateRequest(() => {
          state.merchant.balance -= bill.finalAmount;
          state.merchant.creditUsed = Math.max(
            0,
            state.merchant.creditUsed - bill.finalAmount
          );
          state.merchant.currentPayable = Math.max(
            0,
            state.merchant.currentPayable - bill.finalAmount
          );

          bill.status = "settled";
          bill.statusName = "已结清";
          bill.paymentTime = nowString();

          state.flows.unshift({
            id: generateId("F"),
            type: "settlement",
            name: `${bill.period}结算账单付款`,
            amount: -bill.finalAmount,
            balanceAfter: state.merchant.balance,
            time: nowString(),
            relatedId: bill.id,
            operator: state.currentUser.name
          });

          addAudit("支付结算账单", `${bill.id}，支付${money(bill.finalAmount)}`);
          saveState();
          toast("账单支付成功", "success");
          renderRoute();
        }, "正在支付结算账单...");
      }
    });
  } else {
    showPaymentQr({
      title: `${bill.period}结算账单`,
      amount: bill.finalAmount,
      onPaid: () => {
        bill.status = "settled";
        bill.statusName = "已结清";
        bill.paymentTime = nowString();
        addAudit("支付结算账单", `${bill.id}，外部支付${money(bill.finalAmount)}`);
        saveState();
        closeModal();
        toast("账单支付成功", "success");
        renderRoute();
      }
    });
  }
}

function submitInvoice() {
  const amount = Number(document.getElementById("invoiceAmount")?.value);
  const source = document.getElementById("invoiceSource")?.value;
  const type = document.getElementById("invoiceType")?.value;
  const title = document.getElementById("invoiceTitle")?.value.trim();
  const taxNo = document.getElementById("invoiceTaxNo")?.value.trim();
  const email = document.getElementById("invoiceEmail")?.value.trim();

  if (!amount || amount <= 0) {
    toast("请输入正确的开票金额", "error");
    return;
  }

  if (amount > state.merchant.invoiceableAmount) {
    toast("申请金额超过当前可开票金额", "error");
    return;
  }

  if (!title || !taxNo || !email.includes("@")) {
    toast("请完善发票抬头、税号和接收邮箱", "error");
    return;
  }

  simulateRequest(() => {
    state.merchant.invoiceableAmount -= amount;

    state.invoices.unshift({
      id: generateId("INV"),
      sourceType: source,
      sourceName: source === "settlement" ? "后付费结算" : "账户充值与购券",
      amount,
      title,
      taxNo,
      type,
      email,
      status: "reviewing",
      statusName: "审核中",
      applyTime: nowString()
    });

    addAudit("申请开票", `${type}，金额${money(amount)}，抬头${title}`);
    saveState();
    closeModal();
    toast("开票申请已提交，预计1至3个工作日完成", "success");
    renderRoute();
  }, "正在提交发票系统...");
}

function saveEmployee(employeeId) {
  const name = document.getElementById("employeeName")?.value.trim();
  const mobile = document.getElementById("employeeMobile")?.value.trim();
  const employeeNo = document.getElementById("employeeNo")?.value.trim();
  const role = document.getElementById("employeeRole")?.value;
  const dailyLimitCount = Number(
    document.getElementById("employeeCountLimit")?.value
  );
  const dailyLimitAmount = Number(
    document.getElementById("employeeAmountLimit")?.value
  );

  if (!name || !mobile || !employeeNo) {
    toast("请完整填写员工姓名、手机号和工号", "error");
    return;
  }

  if (!dailyLimitCount || !dailyLimitAmount) {
    toast("请填写有效的发券额度", "error");
    return;
  }

  const permissions = Array.from(
    document.querySelectorAll(".switch.on[data-permission]")
  ).map(item => item.dataset.permission);

  const roleNames = {
    employee: "收银员",
    manager: "值班店长",
    admin: "商户管理员"
  };

  let employee = getEmployee(employeeId);

  if (employee) {
    Object.assign(employee, {
      name,
      mobile,
      employeeNo,
      role,
      roleName: roleNames[role],
      dailyLimitCount,
      dailyLimitAmount,
      permissions
    });

    addAudit("编辑员工账号", `${name}，角色${roleNames[role]}`);
  } else {
    employee = {
      id: generateId("E"),
      name,
      mobile,
      employeeNo,
      role,
      roleName: roleNames[role],
      storeName: state.merchant.storeName,
      status: "enabled",
      dailyLimitAmount,
      dailyLimitCount,
      todayCount: 0,
      todayAmount: 0,
      lastLogin: "尚未登录",
      permissions
    };

    state.employees.push(employee);
    addAudit("新增员工账号", `${name}，角色${roleNames[role]}`);
  }

  saveState();
  closeModal();
  toast(employeeId ? "员工信息已更新" : "员工账号创建成功", "success");
  renderRoute();
}

function toggleEmployee(id) {
  const employee = getEmployee(id);
  if (!employee) return;

  const enable = employee.status !== "enabled";

  confirmAction({
    title: enable ? "恢复员工账号？" : "停用员工账号？",
    message: enable
      ? `恢复后，${employee.name}可重新登录商户PDA。`
      : `停用后，${employee.name}将立即退出登录，已绑定设备会话同时失效。`,
    icon: "员",
    confirmText: enable ? "确认恢复" : "确认停用",
    danger: !enable,
    onConfirm: () => {
      closeConfirm();
      employee.status = enable ? "enabled" : "disabled";
      addAudit(
        enable ? "恢复员工账号" : "停用员工账号",
        `${employee.name}（${employee.employeeNo}）`
      );
      saveState();
      toast(enable ? "员工账号已恢复" : "员工账号已停用", "success");
      renderRoute();
    }
  });
}

}

   消息、搜索和辅助弹窗
========================================================= */

function openMessages() {
  state.messages.forEach(item => item.read = true);
  saveState();

  openModal("消息中心", `
    <div class="record-list">
      ${state.messages.map(item => `
        <article class="record-item">
          <div class="record-head">
            <div>
              <strong>${item.title}</strong>
              <span>${item.time}</span>
            </div>

            <span class="badge ${
              item.type === "warning"
                ? "orange"
                : item.type === "risk"
                  ? "red"
                  : "purple"
            }">
              ${item.type === "warning" ? "库存" : item.type === "risk" ? "风控" : "账单"}
            </span>
          </div>

          <p style="
            margin:9px 0 0;
            color:#71818e;
            font-size:10px;
            line-height:1.6;
          ">
            ${item.content}
          </p>

          <div class="record-actions">
            <button
              class="secondary-btn small-btn"
              data-action="message-go"
              data-route="${item.action}"
            >
              立即处理
            </button>
          </div>
        </article>
      `).join("")}
    </div>
  `);
}

function openGlobalSearch() {
  openModal("全局业务查询", `
    <div class="form-group">
      <label class="form-label">
        <span>查询关键词</span>
      </label>

      <input
        class="form-control"
        id="globalSearchInput"
        placeholder="车牌、券号、订单号、账单号或员工姓名"
      >
    </div>

    <button class="primary-btn full-btn" data-action="submit-global-search">
      查询业务数据
    </button>

    <div id="globalSearchResult" style="margin-top:12px"></div>
  `);
}

function submitGlobalSearch() {
  const keyword = document.getElementById("globalSearchInput")?.value.trim();

  if (!keyword) {
    toast("请输入查询关键词", "warning");
    return;
  }

  const coupons = state.issuedCoupons.filter(item =>
    JSON.stringify(item).includes(keyword)
  );
  const orders = state.parkingOrders.filter(item =>
    JSON.stringify(item).includes(keyword)
  );
  const employees = state.employees.filter(item =>
    JSON.stringify(item).includes(keyword)
  );
  const bills = state.bills.filter(item =>
    JSON.stringify(item).includes(keyword)
  );

  const result = document.getElementById("globalSearchResult");

  result.innerHTML = `
    ${orders.map(order => `
      <div class="card compact">
        <div class="card-heading">
          <strong>停车订单 · ${order.plateNo}</strong>
          <span class="badge green">${order.status}</span>
        </div>
        <p class="muted" style="font-size:9px">
          ${order.id} · ${order.parkingLot} · ${money(order.payableAmount)}
        </p>
      </div>
    `).join("")}

    ${coupons.map(item => `
      <div class="card compact">
        <div class="card-heading">
          <strong>优惠券 · ${item.templateName}</strong>
          ${couponStatusBadge(item.status)}
        </div>
        <p class="muted" style="font-size:9px">
          ${item.id} · ${item.plateNo} · ${item.issueTime}
        </p>
      </div>
    `).join("")}

    ${employees.map(item => `
      <div class="card compact">
        <div class="card-heading">
          <strong>员工 · ${item.name}</strong>
          <span class="badge ${item.status === "enabled" ? "green" : "gray"}">
            ${item.roleName}
          </span>
        </div>
        <p class="muted" style="font-size:9px">
          ${item.employeeNo} · ${item.mobile}
        </p>
      </div>
    `).join("")}

    ${bills.map(item => `
      <div class="card compact">
        <div class="card-heading">
          <strong>结算账单 · ${item.period}</strong>
          ${billStatusBadge(item.status)}
        </div>
        <p class="muted" style="font-size:9px">
          ${item.id} · ${money(item.finalAmount)}
        </p>
      </div>
    `).join("")}

    ${
      !orders.length && !coupons.length && !employees.length && !bills.length
        ? renderEmpty("未找到相关业务数据", "请核对关键词后重新查询")
        : ""
    }
  `;
}

function renderEmpty(title, description) {
  return `
    <div class="empty-state">
      <div class="empty-icon">◇</div>
      <strong>${title}</strong>
      <span>${description}</span>
    </div>
  `;
}

/* =========================================================
   事件代理
========================================================= */

document.addEventListener("click", event => {
  const routeButton = event.target.closest("[data-route]");

  if (routeButton && !routeButton.dataset.action) {
    closeModal();
    navigate(routeButton.dataset.route);
    return;
  }

  const actionTarget = event.target.closest("[data-action]");
  if (!actionTarget) return;

  const action = actionTarget.dataset.action;

  const handlers = {
    "close-modal": closeModal,
    "cancel-confirm": closeConfirm,
    "open-messages": openMessages,
    "open-search": openGlobalSearch,
    "open-purchase": () => openPurchaseModal(),
    "open-recharge": openRechargeModal,
    "open-inventory-refund": () => openInventoryRefund(),
    "add-employee": () => openEmployeeForm(),
    "new-issue": () => {
      issueDraft = {
        step: "search",
        plateNo: "",
        orderId: null,
        templateId: null,
        fundingMode: null,
        remark: "",
        consumptionNo: "",
        notifyOwner: true
      };
      pageParams = {};
      renderRoute();
    },
    "change-issue-plate": () => {
      issueDraft.step = "search";
      issueDraft.orderId = null;
      issueDraft.templateId = null;
      issueDraft.fundingMode = null;
      renderRoute();
    },
    "back-issue-select": () => {
      issueDraft.step = "select";
      renderRoute();
    },
    "submit-issue": submitIssue,
    "submit-purchase": submitPurchase,
    "submit-recharge": submitRecharge,
    "submit-invoice": submitInvoice,
    "submit-global-search": submitGlobalSearch,
    "download-invoice": () => toast("电子发票已加入下载任务", "success"),
    "request-bill-export": () => toast("核销明细将在5分钟内发送到财务邮箱", "success"),
    "request-stat-export": () => toast("经营报表导出任务已创建", "success"),
    "custom-stat-date": () => toast("请选择开始日期和结束日期", "warning"),
    "mock-upload-voucher": () => {
      actionTarget.textContent = "✓ 银行回单已上传";
      actionTarget.className = "secondary-btn full-btn";
      actionTarget.dataset.uploaded = "true";
      toast("凭证上传成功", "success");
    },
    "merchant-info": () => openModal("商户与门店信息", `
      <div class="card compact">
        <div class="confirm-row"><span>商户名称</span><strong>${state.merchant.name}</strong></div>
        <div class="confirm-row"><span>商户编号</span><strong>${state.merchant.id}</strong></div>
        <div class="confirm-row"><span>门店名称</span><strong>${state.merchant.storeName}</strong></div>
        <div class="confirm-row"><span>结算模式</span><strong>${settlementModeName(state.merchant.settlementMode)}</strong></div>
        <div class="confirm-row"><span>商户状态</span><strong class="amount-positive">正常合作</strong></div>
      </div>
    `),
    "device-info": () => openModal("授权设备信息", `
      <div class="card compact">
        <div class="confirm-row"><span>设备编号</span><strong>PDA-XY-008</strong></div>
        <div class="confirm-row"><span>设备型号</span><strong>Android PDA X8</strong></div>
        <div class="confirm-row"><span>系统版本</span><strong>Android 14</strong></div>
        <div class="confirm-row"><span>绑定时间</span><strong>2026-06-08 10:30</strong></div>
        <div class="confirm-row"><span>安全状态</span><strong class="amount-positive">设备可信</strong></div>
      </div>
      <button class="danger-btn full-btn" data-action="unbind-device">解除设备绑定</button>
    `),
    "security-settings": () => openModal("账号与安全", `
      <div class="menu-list">
        <button class="menu-item" data-action="change-password">
          <span class="menu-icon">密</span>
          <span><strong>修改登录密码</strong><span>建议每90天更换一次</span></span>
          <span class="menu-arrow">›</span>
        </button>
        <button class="menu-item">
          <span class="menu-icon">验</span>
          <span><strong>高风险操作二次验证</strong><span>充值、退券、结算和员工停用</span></span>
          <span class="switch on"></span>
        </button>
        <button class="menu-item">
          <span class="menu-icon">退</span>
          <span><strong>无操作自动退出</strong><span>当前设置：30分钟</span></span>
          <span class="menu-arrow">›</span>
        </button>
      </div>
    `),
    "logout": () => confirmAction({
      title: "退出当前账号？",
      message: "退出后需要重新输入账号密码或手机验证码登录。",
      icon: "退",
      confirmText: "确认退出",
      danger: true,
      onConfirm: () => {
        closeConfirm();
        toast("已安全退出当前账号", "success");
      }
    }),
    "reset-app": () => confirmAction({
      title: "重置本地业务数据？",
      message: "将恢复初始商户、库存、账单和员工数据。此操作仅影响当前浏览器。",
      icon: "!",
      confirmText: "确认重置",
      danger: true,
      onConfirm: () => {
        closeConfirm();
        resetState();
        issueDraft.step = "search";
        navigate("home", {}, false);
        toast("业务数据已恢复初始状态", "success");
      }
    })
  };

  if (handlers[action]) {
    handlers[action]();
    return;
  }

  switch (action) {
    case "home-search-plate": {
      const plate = document.getElementById("homePlateInput")?.value;
      issueDraft = {
        ...issueDraft,
        step: "search",
        plateNo: plate || ""
      };
      navigate("issue");
      setTimeout(() => searchParkingOrder(plate), 20);
      break;
    }

    case "quick-plate":
    case "search-history-plate": {
      const plate = actionTarget.dataset.plate;
      issueDraft.plateNo = plate;

      if (currentRoute !== "issue") {
        navigate("issue");
      }

      searchParkingOrder(plate);
      break;
    }

    case "search-parking-order": {
      const plate = document.getElementById("issuePlateInput")?.value;
      searchParkingOrder(plate);
      break;
    }

    case "simulate-camera-scan":
      simulateRequest(() => {
        const plate = "粤B·A12345";
        issueDraft.plateNo = plate;
        toast(`识别成功：${plate}`, "success");
        searchParkingOrder(plate);
      }, "正在识别车牌...");
      break;

    case "select-history-plate":
      openModal("选择历史车牌", `
        <div class="menu-list">
          ${state.recentPlates.map(plate => `
            <button
              class="menu-item"
              data-action="modal-history-plate"
              data-plate="${plate}"
            >
              <span class="menu-icon">P</span>
              <span><strong>${plate}</strong><span>查询当前停车订单</span></span>
              <span class="menu-arrow">›</span>
            </button>
          `).join("")}
        </div>
      `);
      break;

    case "modal-history-plate":
      closeModal();
      searchParkingOrder(actionTarget.dataset.plate);
      break;

    case "select-issue-coupon":
      issueDraft.templateId = actionTarget.dataset.id;

      if (!issueDraft.fundingMode) {
        const item = getInventory(issueDraft.templateId);
        issueDraft.fundingMode =
          item.stock > 0
            ? "inventory"
            : state.merchant.balance >= item.merchantPrice
              ? "balance"
              : "credit";
      }

      renderRoute();
      break;

    case "select-funding-mode":
      issueDraft.fundingMode = actionTarget.dataset.mode;
      renderRoute();
      break;

    case "go-issue-confirm": {
      const error = validateIssueDraft();

      if (error) {
        toast(error, "error");
        break;
      }

      issueDraft.step = "confirm";
      renderRoute();
      break;
    }

    case "coupon-tab":
      currentCouponTab = actionTarget.dataset.tab;
      renderRoute();
      break;

    case "purchase-template":
      openPurchaseModal(actionTarget.dataset.id);
      break;

    case "refund-inventory-template":
      openInventoryRefund(actionTarget.dataset.id);
      break;

    case "select-modal-radio": {
      const group = actionTarget.dataset.group;

      document.querySelectorAll(`.radio-card[data-group="${group}"]`)
        .forEach(item => item.classList.remove("active"));

      actionTarget.classList.add("active");
      break;
    }

    case "set-recharge-amount":
      document.getElementById("rechargeAmount").value =
        actionTarget.dataset.value;
      break;

    case "record-status":
      currentRecordStatus = actionTarget.dataset.status;
      renderRoute();
      break;

    case "refund-issued-coupon":
      refundIssuedCoupon(actionTarget.dataset.id);
      break;

    case "confirm-refund-issued":
      completeIssuedRefund(actionTarget.dataset.id);
      break;

    case "search-records": {
      const keyword =
        document.getElementById("recordSearchInput")?.value.trim() || "";

      const list = state.issuedCoupons.filter(item =>
        (currentRecordStatus === "all" || item.status === currentRecordStatus) &&
        JSON.stringify(item).includes(keyword)
      );

      document.getElementById("recordList").innerHTML =
        list.length
          ? list.map(renderRecordItem).join("")
          : renderEmpty("未找到匹配记录", "请修改查询条件后重试");
      break;
    }

    case "filter-flows": {
      const type = document.getElementById("flowTypeFilter")?.value;
      const list = state.flows.filter(item =>
        type === "all" || item.type === type
      );

      document.getElementById("flowList").innerHTML =
        list.length
          ? list.map(renderFlowItem).join("")
          : renderEmpty("暂无流水", "当前筛选条件下没有账户流水");
      break;
    }

    case "view-bill":
      viewBill(actionTarget.dataset.id);
      break;

    case "confirm-bill":
      confirmBill(actionTarget.dataset.id);
      break;

    case "dispute-bill":
      disputeBill(actionTarget.dataset.id);
      break;

    case "submit-bill-dispute": {
      const bill = getBill(actionTarget.dataset.id);
      const type = document.getElementById("billDisputeType")?.value;
      const description =
        document.getElementById("billDisputeDescription")?.value.trim();

      if (!type || !description) {
        toast("请选择异议类型并填写问题说明", "error");
        break;
      }

      simulateRequest(() => {
        bill.status = "disputed";
        bill.statusName = "有异议";
        bill.disputeType = type;
        bill.disputeDescription = description;
        bill.disputeTime = nowString();

        addAudit("提交账单异议", `${bill.id}，${type}`);
        saveState();
        closeModal();
        toast("账单异议已提交，平台财务将进行复核", "success");
        renderRoute();
      }, "正在提交账单异议...");
      break;
    }

    case "pay-bill":
      payBill(actionTarget.dataset.id);
      break;

    case "stat-range":
      currentStatRange = actionTarget.dataset.range;
      renderRoute();
      break;

    case "edit-employee":
      openEmployeeForm(actionTarget.dataset.id);
      break;

    case "toggle-employee":
      toggleEmployee(actionTarget.dataset.id);
      break;

    case "toggle-permission-switch":
      actionTarget.classList.toggle("on");
      break;

    case "save-employee":
      saveEmployee(actionTarget.dataset.id);
      break;

    case "message-go":
      closeModal();
      navigate(actionTarget.dataset.route);
      break;

    case "submit-inventory-refund": {
      const item = getInventory(
        document.getElementById("refundInventoryTemplate")?.value
      );
      const quantity = Number(
        document.getElementById("refundInventoryQuantity")?.value
      );
      const method =
        document.getElementById("refundInventoryMethod")?.value;
      const reason =
        document.getElementById("refundInventoryReason")?.value.trim();

      if (!item || !quantity || quantity < 1 || quantity > item.stock) {
        toast("请输入有效的退券数量", "error");
        break;
      }

      if (!reason) {
        toast("请填写退券原因", "error");
        break;
      }

      if (quantity >= 100) {
        toast("大额退券已进入平台审核流程", "warning");
      }

      simulateRequest(() => {
        const refundAmount = item.merchantPrice * quantity;
        item.stock -= quantity;

        if (method === "balance") {
          state.merchant.balance += refundAmount;
        }

        state.flows.unshift({
          id: generateId("F"),
          type: "refund",
          name: `库存退券：${item.name} ${quantity}张`,
          amount: method === "balance" ? refundAmount : 0,
          balanceAfter: state.merchant.balance,
          time: nowString(),
          relatedId: generateId("REF"),
          operator: state.currentUser.name
        });

        addAudit(
          "库存退券",
          `${item.name}${quantity}张，退款${money(refundAmount)}，原因${reason}`
        );

        saveState();
        closeModal();
        toast("退券申请处理成功，库存及资金已更新", "success");
        renderRoute();
      }, "正在校验退券规则...");
      break;
    }

    case "submit-corporate-purchase": {
      const serial =
        document.getElementById("corporateSerial")?.value.trim();

      if (!serial) {
        toast("请输入银行转账流水号", "error");
        break;
      }

      simulateRequest(() => {
        addAudit(
          "提交对公购券申请",
          `流水号${serial}，金额${money(actionTarget.dataset.total)}`
        );
        saveState();
        closeModal();
        toast("购券申请已提交财务审核", "success");
      }, "正在提交财务审核...");
      break;
    }

    case "submit-corporate-recharge": {
      const serial =
        document.getElementById("rechargeCorporateSerial")?.value.trim();

      if (!serial) {
        toast("请输入银行转账流水号", "error");
        break;
      }

      simulateRequest(() => {
        addAudit(
          "提交对公充值申请",
          `流水号${serial}，金额${money(actionTarget.dataset.amount)}`
        );
        saveState();
        closeModal();
        toast("充值申请已提交，审核通过后自动入账", "success");
      }, "正在提交对公充值申请...");
      break;
    }

    case "unbind-device":
      confirmAction({
        title: "解除当前设备绑定？",
        message: "解绑后当前账号将立即退出，本设备需管理员重新授权后才能登录。",
        icon: "机",
        confirmText: "确认解绑",
        danger: true,
        onConfirm: () => {
          closeConfirm();
          closeModal();
          toast("设备解绑申请已提交", "success");
        }
      });
      break;

    case "change-password":
      openModal("修改登录密码", `
        <div class="form-group">
          <label class="form-label"><span>原密码</span><em>必填</em></label>
          <input type="password" class="form-control" id="oldPassword">
        </div>
        <div class="form-group">
          <label class="form-label"><span>新密码</span><em>必填</em></label>
          <input type="password" class="form-control" id="newPassword">
          <div class="form-tip">至少8位，需包含字母、数字和特殊字符。</div>
        </div>
        <div class="form-group">
          <label class="form-label"><span>确认新密码</span><em>必填</em></label>
          <input type="password" class="form-control" id="confirmPassword">
        </div>
        <button class="primary-btn full-btn" data-action="submit-password">确认修改</button>
      `);
      break;

    case "submit-password": {
      const oldPassword =
        document.getElementById("oldPassword")?.value;
      const newPassword =
        document.getElementById("newPassword")?.value;
      const confirmPassword =
        document.getElementById("confirmPassword")?.value;

      if (!oldPassword || newPassword?.length < 8) {
        toast("请填写原密码，新密码至少8位", "error");
        break;
      }

      if (newPassword !== confirmPassword) {
        toast("两次输入的新密码不一致", "error");
        break;
      }

      closeModal();
      addAudit("修改登录密码", "账号密码修改成功");
      saveState();
      toast("密码修改成功，请妥善保管", "success");
      break;
    }
  }
});

document.getElementById("confirmSubmit").addEventListener("click", () => {
  if (typeof confirmHandler === "function") {
    const handler = confirmHandler;
    confirmHandler = null;
    handler();
  }
});

document.getElementById("headerBack").addEventListener("click", goBack);

document.addEventListener("change", event => {
  if (
    event.target.id === "purchaseTemplate" ||
    event.target.id === "purchaseQuantity"
  ) {
    updatePurchaseSummary();
  }

  if (event.target.id === "refundInventoryTemplate") {
    const item = getInventory(event.target.value);
    const quantity = document.getElementById("refundInventoryQuantity");

    if (quantity && item) {
      quantity.max = item.stock;
      quantity.value = 1;
    }
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    if (event.target.id === "issuePlateInput") {
      searchParkingOrder(event.target.value);
    }

    if (event.target.id === "homePlateInput") {
      issueDraft.plateNo = event.target.value;
      navigate("issue");
      setTimeout(() => searchParkingOrder(event.target.value), 20);
    }

    if (event.target.id === "globalSearchInput") {
      submitGlobalSearch();
    }
  }
});

/* =========================================================
   初始化
========================================================= */

updateClock();
setInterval(updateClock, 30000);
updateMessageCount();
navigate("home", {}, false);
</script>

</body>
