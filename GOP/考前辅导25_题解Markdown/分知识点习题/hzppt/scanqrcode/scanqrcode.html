<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#1769d6">
    <title>惠泊停车缴费</title>

    <style>
        :root {
            --primary: #1769e8;
            --primary-dark: #0e57c6;
            --primary-soft: #eaf3ff;
            --cyan: #16a6bd;

            --green: #15966f;
            --green-soft: #e8f8f2;

            --orange: #e77c28;
            --orange-soft: #fff3e7;

            --red: #d84e4e;
            --red-soft: #fff0f0;

            --purple: #7257ce;
            --purple-soft: #f1edff;

            --text: #1e3142;
            --text-2: #536779;
            --text-3: #85939f;

            --line: #e2e9ef;
            --line-dark: #d4dfe7;
            --page: #f2f5f8;
            --card: #fff;

            --shadow: 0 7px 22px rgba(35, 61, 83, .08);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background:
                radial-gradient(circle at 20% 12%, rgba(35, 146, 255, .13), transparent 27%),
                radial-gradient(circle at 86% 76%, rgba(39, 211, 173, .10), transparent 26%),
                linear-gradient(145deg, #071426, #0b2037 55%, #06101e);
            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                "Noto Sans SC",
                Arial,
                sans-serif;
            color: var(--text);
        }

        body {
            display: flex;
            justify-content: center;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        input,
        select,
        textarea {
            outline: none;
        }

        @media (min-width: 700px) {
            body {
                align-items: center;
                padding: 22px;
            }
        }

        .app {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: var(--page);
        }

        /* ========================================
   顶部状态栏
======================================== */

        .status-bar {
            position: absolute;
            z-index: 60;
            left: 0;
            right: 0;
            top: 0;
            height: 25px;
            padding: 6px 15px 0;
            display: flex;
            justify-content: space-between;
            color: #fff;
            background: #1769d6;
            font-size: 10px;
            font-weight: 700;
        }

        .app-header {
            position: absolute;
            z-index: 55;
            left: 0;
            right: 0;
            top: 25px;
            height: 63px;
            padding: 0 14px;
            display: grid;
            grid-template-columns: 40px 1fr 40px;
            align-items: center;
            color: #fff;
            background:
                radial-gradient(circle at 85% 0%, rgba(112, 230, 255, .26), transparent 36%),
                linear-gradient(135deg, #1769e8, #118fa9);
            box-shadow: 0 4px 16px rgba(20, 100, 185, .18);
        }

        .header-back,
        .header-more {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            color: #fff;
            background: transparent;
        }

        .header-back {
            font-size: 27px;
        }

        .header-back.hidden {
            visibility: hidden;
        }

        .header-more {
            font-size: 18px;
        }

        .header-title {
            min-width: 0;
            text-align: center;
        }

        .header-title strong {
            display: block;
            overflow: hidden;
            font-size: 16px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-title span {
            display: block;
            margin-top: 4px;
            overflow: hidden;
            color: rgba(255, 255, 255, .74);
            font-size: 10px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ========================================
   页面
======================================== */

        .page-container {
            position: absolute;
            left: 0;
            right: 0;
            top: 88px;
            bottom: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: none;
        }

        .page-container::-webkit-scrollbar {
            display: none;
        }

        .page {
            min-height: 100%;
            padding: 13px 13px calc(28px + var(--safe-bottom));
        }

        .page.with-payment-bar {
            padding-bottom: calc(96px + var(--safe-bottom));
        }

        /* ========================================
   通用组件
======================================== */

        .card {
            margin-bottom: 11px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: var(--card);
            box-shadow: 0 5px 17px rgba(34, 64, 88, .045);
        }

        .card.compact {
            padding: 11px;
        }

        .section-header {
            margin: 17px 2px 9px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-header:first-child {
            margin-top: 2px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #304558;
            font-size: 14px;
            font-weight: 800;
        }

        .section-title::before {
            content: "";
            width: 4px;
            height: 15px;
            border-radius: 3px;
            background: linear-gradient(180deg, var(--primary), var(--cyan));
        }

        .section-more {
            padding: 5px;
            color: var(--primary);
            background: transparent;
            font-size: 11px;
        }

        .muted {
            color: var(--text-3);
        }

        .badge {
            display: inline-flex;
            min-height: 23px;
            padding: 0 8px;
            align-items: center;
            border-radius: 12px;
            color: #1769b6;
            background: #e7f2ff;
            font-size: 10px;
            font-weight: 700;
        }

        .badge.green {
            color: #13785b;
            background: var(--green-soft);
        }

        .badge.orange {
            color: #aa611b;
            background: var(--orange-soft);
        }

        .badge.red {
            color: #b93f3f;
            background: var(--red-soft);
        }

        .badge.purple {
            color: #674fba;
            background: var(--purple-soft);
        }

        .badge.gray {
            color: #677784;
            background: #edf1f4;
        }

        .primary-btn,
        .secondary-btn,
        .ghost-btn,
        .warning-btn {
            min-height: 44px;
            padding: 0 15px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 800;
        }

        .primary-btn {
            color: #fff;
            background: linear-gradient(135deg, var(--primary), #149eb3);
            box-shadow: 0 7px 16px rgba(23, 105, 232, .20);
        }

        .secondary-btn {
            color: var(--primary);
            border: 1px solid #cfe0f3;
            background: #edf5ff;
        }

        .ghost-btn {
            color: var(--text-2);
            border: 1px solid var(--line-dark);
            background: #fff;
        }

        .warning-btn {
            color: #a45d18;
            border: 1px solid #efd1af;
            background: var(--orange-soft);
        }

        .full-btn {
            width: 100%;
        }

        .small-btn {
            min-height: 34px;
            padding: 0 11px;
            border-radius: 9px;
            font-size: 11px;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 9px;
        }

        .alert {
            margin-bottom: 10px;
            padding: 11px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            border: 1px solid #cfe2f2;
            border-radius: 11px;
            color: #47708e;
            background: #edf7ff;
            font-size: 11px;
            line-height: 1.55;
        }

        .alert i {
            width: 7px;
            height: 7px;
            flex: 0 0 7px;
            margin-top: 5px;
            border-radius: 50%;
            background: #2d9cdc;
            box-shadow: 0 0 6px rgba(45, 156, 220, .45);
        }

        .alert.green {
            color: #427d6f;
            border-color: #cce9e0;
            background: #eefaf6;
        }

        .alert.green i {
            background: var(--green);
        }

        .alert.orange {
            color: #94642d;
            border-color: #efd9bb;
            background: #fff8ee;
        }

        .alert.orange i {
            background: var(--orange);
        }

        .empty-state {
            padding: 45px 20px;
            color: var(--text-3);
            text-align: center;
        }

        .empty-icon {
            width: 66px;
            height: 66px;
            margin: 0 auto 14px;
            display: grid;
            place-items: center;
            border-radius: 21px;
            color: #6fa9d6;
            background: #e9f3fb;
            font-size: 29px;
        }

        .empty-state strong {
            display: block;
            color: var(--text-2);
            font-size: 15px;
        }

        .empty-state span {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            line-height: 1.65;
        }

        /* ========================================
   表单
======================================== */

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            margin-bottom: 7px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #526678;
            font-size: 12px;
            font-weight: 700;
        }

        .form-label em {
            color: var(--red);
            font-style: normal;
        }

        .form-control {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            border: 1px solid #d9e3ea;
            border-radius: 11px;
            color: var(--text);
            background: #fff;
            font-size: 15px;
        }

        .form-control:focus {
            border-color: #66a7ed;
            box-shadow: 0 0 0 3px rgba(50, 132, 225, .10);
        }

        .form-tip {
            margin-top: 6px;
            color: var(--text-3);
            font-size: 10px;
            line-height: 1.5;
        }

        .plate-input-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .plate-input {
            height: 47px;
            padding: 0 12px;
            border: 1px solid #cadce9;
            border-radius: 11px;
            color: #203e56;
            background: #fff;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ========================================
   扫码来源场景卡片
======================================== */

        .scene-card {
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
            padding: 16px;
            border-radius: 17px;
            color: #fff;
            background:
                radial-gradient(circle at 90% 0%, rgba(255, 255, 255, .20), transparent 35%),
                linear-gradient(135deg, #1769e8, #1599b1);
            box-shadow: 0 10px 24px rgba(20, 106, 190, .22);
        }

        .scene-card.road {
            background:
                radial-gradient(circle at 90% 0%, rgba(255, 255, 255, .19), transparent 35%),
                linear-gradient(135deg, #5b50bf, #716dd2);
        }

        .scene-card.coupon {
            background:
                radial-gradient(circle at 90% 0%, rgba(255, 255, 255, .18), transparent 35%),
                linear-gradient(135deg, #c56b20, #e19b39);
        }

        .scene-card.monthly {
            background:
                radial-gradient(circle at 90% 0%, rgba(255, 255, 255, .18), transparent 35%),
                linear-gradient(135deg, #168a77, #21ab99);
        }

        .scene-card::after {
            content: "P";
            position: absolute;
            right: 10px;
            bottom: -48px;
            color: rgba(255, 255, 255, .08);
            font-size: 145px;
            font-weight: 900;
        }

        .scene-head,
        .scene-main,
        .scene-meta {
            position: relative;
            z-index: 2;
        }

        .scene-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .scene-head strong {
            font-size: 13px;
        }

        .scene-tag {
            padding: 5px 8px;
            border: 1px solid rgba(255, 255, 255, .20);
            border-radius: 9px;
            background: rgba(255, 255, 255, .13);
            font-size: 9px;
        }

        .scene-main {
            margin-top: 14px;
            font-size: 20px;
            font-weight: 800;
        }

        .scene-meta {
            margin-top: 7px;
            color: rgba(255, 255, 255, .76);
            font-size: 11px;
            line-height: 1.55;
        }

        /* ========================================
   订单详情
======================================== */

        .order-card {
            border-color: #cfe1ef;
        }

        .order-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .order-plate {
            color: #1f4059;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .order-location {
            margin-top: 5px;
            color: var(--text-3);
            font-size: 10px;
            line-height: 1.45;
        }

        .info-list {
            margin-top: 11px;
            padding-top: 8px;
            border-top: 1px solid #edf1f4;
        }

        .info-row {
            min-height: 31px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid #edf1f4;
            color: var(--text-3);
            font-size: 11px;
        }

        .info-row:last-child {
            border-bottom: 0;
        }

        .info-row strong {
            color: #3c5264;
            font-size: 11px;
            text-align: right;
        }

        .fee-grid {
            margin-top: 10px;
            padding: 11px 5px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-radius: 11px;
            background: #f4f7fa;
        }

        .fee-cell {
            text-align: center;
            border-right: 1px solid #dfe6eb;
        }

        .fee-cell:last-child {
            border-right: 0;
        }

        .fee-cell span {
            display: block;
            color: var(--text-3);
            font-size: 9px;
        }

        .fee-cell strong {
            display: block;
            margin-top: 5px;
            color: #354c5e;
            font-size: 14px;
        }

        .fee-cell.payable strong {
            color: var(--orange);
        }

        /* ========================================
   待缴费用选择
======================================== */

        .fee-list {
            display: grid;
            gap: 9px;
        }

        .fee-select-card {
            position: relative;
            padding: 13px 48px 13px 13px;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: #fff;
            cursor: pointer;
        }

        .fee-select-card.selected {
            border-color: var(--primary);
            background: #f3f8ff;
        }

        .fee-select-card.mandatory {
            border-color: #e9d0b2;
            background: #fff8ee;
            cursor: default;
        }

        .fee-select-card strong {
            display: block;
            color: #3a5062;
            font-size: 13px;
        }

        .fee-select-card p {
            margin: 6px 0 0;
            color: var(--text-3);
            font-size: 10px;
            line-height: 1.5;
        }

        .fee-card-meta {
            margin-top: 9px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .fee-card-meta span {
            color: var(--text-3);
            font-size: 10px;
        }

        .fee-card-meta b {
            color: var(--orange);
            font-size: 15px;
        }

        .select-check {
            position: absolute;
            right: 14px;
            top: 50%;
            width: 23px;
            height: 23px;
            display: grid;
            place-items: center;
            transform: translateY(-50%);
            border: 1px solid #cfd9e0;
            border-radius: 7px;
            color: transparent;
            background: #fff;
            font-size: 11px;
        }

        .fee-select-card.selected .select-check {
            color: #fff;
            border-color: var(--primary);
            background: var(--primary);
        }

        .fee-select-card.mandatory .select-check {
            color: #fff;
            border-color: var(--orange);
            background: var(--orange);
        }

        /* ========================================
   充电超时占位费
======================================== */

        .charging-card {
            border-color: #cce8df;
            background:
                radial-gradient(circle at 95% 0%, rgba(38, 180, 145, .09), transparent 35%),
                #f5fcf9;
        }

        .charging-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .charging-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(135deg, #159777, #27b69a);
            font-size: 20px;
        }

        .charging-head strong {
            display: block;
            color: #315e53;
            font-size: 13px;
        }

        .charging-head span {
            display: block;
            margin-top: 4px;
            color: #75998f;
            font-size: 10px;
        }

        .charging-amount {
            margin-left: auto;
            color: var(--orange);
            font-size: 17px;
            font-weight: 800;
        }

        /* ========================================
   商户优惠券
======================================== */

        .coupon-hero {
            position: relative;
            overflow: hidden;
            padding: 17px;
            border-radius: 17px;
            color: #fff;
            background:
                radial-gradient(circle at 90% 0%, rgba(255, 255, 255, .22), transparent 34%),
                linear-gradient(135deg, #c96e22, #e4a23e);
            box-shadow: 0 10px 24px rgba(202, 116, 30, .20);
        }

        .coupon-hero::before,
        .coupon-hero::after {
            content: "";
            position: absolute;
            left: 105px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--page);
        }

        .coupon-hero::before {
            top: -10px;
        }

        .coupon-hero::after {
            bottom: -10px;
        }

        .coupon-merchant {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .coupon-merchant strong {
            font-size: 13px;
        }

        .coupon-status {
            padding: 5px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .16);
            font-size: 9px;
        }

        .coupon-value {
            margin-top: 18px;
            font-size: 28px;
            font-weight: 900;
        }

        .coupon-name {
            margin-top: 4px;
            font-size: 14px;
            font-weight: 700;
        }

        .coupon-rule {
            margin-top: 11px;
            color: rgba(255, 255, 255, .78);
            font-size: 10px;
            line-height: 1.55;
        }

        .coupon-code {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, .30);
            color: rgba(255, 255, 255, .78);
            font-size: 9px;
        }

        /* ========================================
   包月车位续费
======================================== */

        .owner-card {
            display: grid;
            grid-template-columns: 45px 1fr auto;
            align-items: center;
            gap: 10px;
        }

        .owner-avatar {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, #168d78, #28b29b);
            font-size: 16px;
            font-weight: 800;
        }

        .owner-info strong {
            display: block;
            color: #365348;
            font-size: 13px;
        }

        .owner-info span {
            display: block;
            margin-top: 5px;
            color: var(--text-3);
            font-size: 10px;
        }

        .space-list {
            display: grid;
            gap: 10px;
        }

        .space-card {
            position: relative;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fff;
        }

        .space-card.selected {
            border-color: var(--green);
            background: #f3fbf8;
        }

        .space-top {
            padding-right: 33px;
        }

        .space-top strong {
            display: block;
            color: #395348;
            font-size: 13px;
        }

        .space-top span {
            display: block;
            margin-top: 5px;
            color: var(--text-3);
            font-size: 10px;
        }

        .space-check {
            position: absolute;
            right: 13px;
            top: 15px;
            width: 23px;
            height: 23px;
            display: grid;
            place-items: center;
            border: 1px solid #d0dbd7;
            border-radius: 7px;
            color: transparent;
            background: #fff;
        }

        .space-card.selected .space-check {
            color: #fff;
            border-color: var(--green);
            background: var(--green);
        }

        .space-validity {
            margin-top: 10px;
            padding: 9px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 9px;
            background: #f4f7f6;
        }

        .space-validity span {
            color: #768a83;
            font-size: 10px;
        }

        .space-validity strong {
            color: #3f5f55;
            font-size: 10px;
        }

        .duration-options {
            margin-top: 10px;
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
        }

        .space-card.selected .duration-options {
            display: grid;
        }

        .duration-option {
            min-height: 42px;
            padding: 5px;
            border: 1px solid #dbe4e1;
            border-radius: 9px;
            color: #6d817a;
            background: #fff;
            font-size: 10px;
            text-align: center;
        }

        .duration-option strong {
            display: block;
            margin-bottom: 3px;
            font-size: 11px;
        }

        .duration-option.active {
            color: #13795e;
            border-color: var(--green);
            background: #eaf8f3;
        }

        .new-expiry {
            margin-top: 8px;
            display: none;
            color: #18836a;
            font-size: 10px;
        }

        .space-card.selected .new-expiry {
            display: block;
        }

        /* ========================================
   费用汇总
======================================== */

        .summary-card {
            overflow: hidden;
        }

        .summary-row {
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;

        function money(value) {
            return "¥" + Number(value || 0).toLocaleString("zh-CN", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function detectPaymentEnvironment() {
            const ua = navigator.userAgent.toLowerCase();

            if (ua.includes("alipayclient")) return "alipay";
            return "wechat";
        }

        function paymentMethodName(method) {
            return method === "alipay" ? "支付宝支付" : "微信支付";
        }

        function normalizePlate(plate) {
            let value = String(plate || "")
                .trim()
                .toUpperCase()
                .replace(/\s+/g, "")
                .replace(/[•．。]/g, "·");

            // 先移除所有分隔点，统一转成无点车牌
            value = value.replace(/·/g, "");

            // 中国大陆普通/新能源车牌：省份简称 + 字母 + 后续号码
            // 自动在第2位后补标准分隔点
            if (/^[\u4e00-\u9fa5][A-Z][A-Z0-9]{5,6}$/.test(value)) {
                value = value.slice(0, 2) + "·" + value.slice(2);
            }

            return value;
        }

        function validatePlate(plate) {
            const value = normalizePlate(plate);

            // 普通车牌：省份+字母+中点+5位
            // 新能源车牌：省份+字母+中点+6位
            return /^[\u4e00-\u9fa5][A-Z]·[A-Z0-9]{5,6}$/.test(value);

        function addMonths(dateString, months) {
            const date = new Date(dateString + "T00:00:00");
            date.setMonth(date.getMonth() + Number(months));

            return [
                date.getFullYear(),
                String(date.getMonth() + 1).padStart(2, "0"),
                String(date.getDate()).padStart(2, "0")
            ].join("-");
        }

            setTimeout(function () {

            const element = document.createElement("div");

            element.className = "toast " + type;

            element.innerHTML = `

      ${type === "success" ? "✓" : type === "error" ? "×" : type === "warning" ? "!" : "i"}
    </span>
    <span>${message}</span>
  `;

            container.appendChild(element);

            setTimeout(function () {
                element.style.opacity = "0";
                element.style.transform = "translateY(-8px)";
            }, 2500);

            setTimeout(function () {
                element.remove();
            }, 2900);

        /* =========================================================
           路由
        ========================================================= */

        function navigate(route, pushHistory = true) {
            if (pushHistory && appState.route !== route) {
                appState.history.push(appState.route);
            }

            appState.route = route;
            render();
            document.getElementById("pageContainer").scrollTop = 0;
        }

        function goBack() {
            const previous = appState.history.pop();

            if (previous) {
                appState.route = previous;
                render();
            } else {
                initializeScene();
            }
        }

        function render() {
            const renderer = {
                parkingEntry: renderParkingEntry,
                parkingFees: renderParkingFees,

                roadTicket: renderRoadTicket,

                couponEntry: renderCouponEntry,
                couponFees: renderCouponFees,

                monthlyEntry: renderMonthlyEntry,
                monthlySpaces: renderMonthlySpaces,

                cashier: renderCashier,
                success: renderSuccess,
                invalid: renderInvalid
            }[appState.route] || renderInvalid;

            document.getElementById("pageContainer").innerHTML = renderer();
            setPaymentBar(false);
            bindPageEvents();
        }

        /* =========================================================
           场景初始化
        ========================================================= */

        function initializeScene() {
            appState.history = [];

            if (scene === "parking") {
                const site = database.sites[siteId];

                if (!site) {
                    appState.route = "invalid";
                    render();
                    return;
                }

                appState.route = "parkingEntry";
                render();
                return;
            }

            if (scene === "road") {
                const ticket = database.roadTickets[ticketId];

                if (!ticket) {
                    appState.route = "invalid";
                    render();
                    return;
                }

                appState.roadTicket = JSON.parse(JSON.stringify(ticket));
                appState.plateNo = ticket.plateNo;
                appState.arrears = JSON.parse(
                    JSON.stringify(database.arrears[ticket.plateNo] || [])
                );

                appState.route = "roadTicket";
                render();
                return;
            }

            if (scene === "coupon") {
                const coupon = database.coupons[couponToken];

                if (!coupon) {
                    appState.route = "invalid";
                    render();
                    return;
                }

                appState.coupon = JSON.parse(JSON.stringify(coupon));
                appState.route = "couponEntry";
                render();
                return;
            }

            if (scene === "monthly") {
                appState.route = "monthlyEntry";
                render();
                return;
            }

            appState.route = "invalid";
            render();
        }

        function calculateParkingFees() {
            const currentFee = appState.includeCurrentOrder
                ? Number(appState.order?.payable || 0)
                : 0;

            const occupancy = appState.includeChargingOccupancy
                ? Number(appState.order?.chargingOccupancy?.amount || 0)
                : 0;

            const arrears = appState.arrears
                .filter(item => item.selected)
                .reduce((sum, item) => sum + Number(item.amount), 0);

            const couponDiscount = appState.couponApplied
                ? Math.min(
                    Number(appState.coupon?.estimatedDiscount || 0),
                    currentFee
                )
                : 0;

            return {
                currentFee,
                occupancy,
                arrears,
                couponDiscount,
                total: Math.max(
                    0,
                    currentFee + occupancy + arrears - couponDiscount
                )
            };
        }

        function queryMonthlySpaces() {
            const input = document.getElementById("monthlyPlateInput");
            const plate = normalizePlate(input.value);

            if (!validatePlate(plate)) {
                toast("请输入完整、有效的车牌号码", "warning");
                return;
            }

            simulateRequest(function () {
                const owner = database.monthlySpaces[plate];

                if (!owner) {
                    openModal("未查询到包月停车权益", `

          <div class="empty-icon">月</div>
          <strong>该车牌没有可续费的包月车位</strong>
          <span>

        </div>

        <button class="primary-btn full-btn" id="monthlyModalReturn">
          返回修改车牌
        </button>
      `);

                    setTimeout(function () {

                        if (button) button.onclick = closeModal;
                    }, 0);

                    return;
                }

                appState.plateNo = plate;
                appState.monthlyOwner = {
                    ownerName: owner.ownerName,
                    mobile: owner.mobile,
                    verified: owner.verified
                };
                appState.monthlySpaces = JSON.parse(
                    JSON.stringify(owner.spaces)
                );
                appState.arrears = JSON.parse(
                    JSON.stringify(database.arrears[plate] || [])
                );

                navigate("monthlySpaces");
            }, "正在查询实名账户及包月车位...");
        }

        function getSpaceDiscountRate(months) {
            if (Number(months) === 3) return 0.03;
            if (Number(months) === 12) return 0.08;
            return 0;
        }

        function calculateMonthlyFees() {
            let original = 0;
            let discount = 0;
            let selectedCount = 0;

            appState.monthlySpaces
                .filter(space => space.selected)
                .forEach(function (space) {
                    const subtotal =
                        Number(space.monthlyPrice) * Number(space.months);

                    original += subtotal;
                    discount += subtotal * getSpaceDiscountRate(space.months);
                    selectedCount += 1;
                });

            const arrears = appState.arrears
                .filter(item => item.selected)
                .reduce((sum, item) => sum + Number(item.amount), 0);

            return {
                original,
                discount,
                arrears,
                selectedCount,
                total: Math.max(0, original - discount + arrears)
            };
        }

        function renderMonthlySpaces() {
            const owner = appState.monthlyOwner;
            const fees = calculateMonthlyFees();

            if (!owner) {
                return renderMonthlyEntry();
            }

            setHeader(

                appState.plateNo + " · 分别选择续费时长",

        `).join("")}
      </div>

      ${renderArrearsSection()}

      <div class="section-header">

      </div>

      <div class="card summary-card">

        </div>

        <div class="summary-row discount">

        </div>

        </div>

        <div class="summary-row total">
          <span>合并应支付</span>
          <strong>${money(fees.total)}</strong>
        </div>
      </div>

    </section>
  `;
        }

        /* =========================================================
           进入统一收银台
        ========================================================= */

        function buildCashierFromCurrentRoute() {
            const items = [];
            let title = "";
            let paymentScene = "";

            if (
                appState.route === "parkingFees" ||
                appState.route === "couponFees"
            ) {
                const fees = calculateParkingFees();

                title =
                    appState.route === "couponFees"
                        ? "优惠后停车费用"
                        : "停车场合并费用";

                paymentScene =
                    appState.route === "couponFees"
                        ? "coupon"
                        : "parking";

                if (fees.currentFee > 0) {
                    items.push({
                        name: "当前临时停车费",
                        detail: appState.order.id,
                        amount: fees.currentFee
                    });
                }

                if (fees.occupancy > 0) {
                    items.push({
                        name: "充电超时占位费",
                        detail: appState.order.chargingOccupancy.id,
                        amount: fees.occupancy
                    });
                }

                appState.arrears
                    .filter(item => item.selected)
                    .forEach(function (item) {
                        items.push({
                            name: item.title,
                            detail: item.id,
                            amount: item.amount
                        });
                    });

                if (fees.couponDiscount > 0) {
                    items.push({
                        name: appState.coupon.couponName,
                        detail: appState.coupon.token,
                        amount: -fees.couponDiscount,
                        discount: true
                    });
                }

                appState.paymentAmount = fees.total;
            }

            if (appState.route === "roadTicket") {
                const fees = calculateRoadFees();

                title = "道路停车合并费用";
                paymentScene = "road";

                items.push({
                    name: "本次道路停车费",
                    detail: appState.roadTicket.id,
                    amount: fees.ticketAmount
                });

                appState.arrears
                    .filter(item => item.selected)
                    .forEach(function (item) {
                        items.push({
                            name: item.title,
                            detail: item.id,
                            amount: item.amount
                        });
                    });

                appState.paymentAmount = fees.total;
            }

            if (appState.route === "monthlySpaces") {
                const fees = calculateMonthlyFees();

                title = "包月车位合并续费";
                paymentScene = "monthly";

                appState.monthlySpaces
                    .filter(space => space.selected)
                    .forEach(function (space) {
                        const original =
                            space.monthlyPrice * space.months;

                        const discount =
                            original * getSpaceDiscountRate(space.months);

                        items.push({
                            name: space.name,
                            detail:
                                `${space.months}个月 · 新有效期${addMonths(
                                    space.validUntil,
                                    space.months
                                )}`,
                            amount: original - discount
                        });
                    });

                appState.arrears
                    .filter(item => item.selected)
                    .forEach(function (item) {
                        items.push({
                            name: item.title,
                            detail: item.id,
                            amount: item.amount
                        });
                    });

                appState.paymentAmount = fees.total;
            }

            appState.cashierItems = items;
            appState.cashierTitle = title;
            appState.paymentScene = paymentScene;

            navigate("cashier");
        }

        function submitPayment() {
            if (!appState.agreementChecked) {
                toast("请先阅读并同意停车缴费服务协议", "warning");
                return;
            }

            if (appState.paymentAmount <= 0) {
                toast("当前订单无需支付", "warning");
                return;
            }

            simulateRequest(function () {
                const paymentId = generateId("PAY");

                appState.lastPayment = {
                    id: paymentId,
                    amount: appState.paymentAmount,
                    method: appState.paymentMethod,
                    time: nowString(),
                    plateNo:
                        appState.plateNo ||
                        appState.roadTicket?.plateNo ||
                        "",
                    scene: appState.paymentScene,
                    items: JSON.parse(
                        JSON.stringify(appState.cashierItems)
                    )
                };

                if (appState.paymentScene === "coupon" && appState.coupon) {
                    appState.coupon.status = "used";
                    appState.coupon.usedTime = nowString();
                    appState.coupon.parkingOrderId = appState.order.id;
                    appState.coupon.plateNo = appState.order.plateNo;
                }

                navigate("success");
            }, "正在唤起" + paymentMethodName(appState.paymentMethod) + "...");
        }

            const queryParkingButton =
                document.getElementById("queryParkingButton");

            if (queryParkingButton) {
                queryParkingButton.onclick = queryParkingByPlate;
            }

            const parkingPlateInput =
                document.getElementById("parkingPlateInput");

            if (parkingPlateInput) {
                parkingPlateInput.onkeydown = function (event) {
                    if (event.key === "Enter") {
                        queryParkingByPlate();
                    }
                };
            }

            const goMonthlyFromParking =
                document.getElementById("goMonthlyFromParking");

            if (goMonthlyFromParking) {
                goMonthlyFromParking.onclick = function () {
                    appState.route = "monthlyEntry";
                    appState.history.push("parkingEntry");
                    render();
                };
            }

            const queryCouponPlate =
                document.getElementById("queryCouponPlate");

            const couponContinueButton =
                document.getElementById("couponContinueButton");

            if (queryCouponPlate) {
                queryCouponPlate.onclick = queryCouponParking;
            }

            if (couponContinueButton) {
                couponContinueButton.onclick = queryCouponParking;
            }

            const couponPlateInput =
                document.getElementById("couponPlateInput");

            if (couponPlateInput) {
                couponPlateInput.onkeydown = function (event) {
                    if (event.key === "Enter") {
                        queryCouponParking();
                    }
                };
            }

            const queryMonthlyButton =
                document.getElementById("queryMonthlyButton");

            const monthlyContinueButton =
                document.getElementById("monthlyContinueButton");

            if (queryMonthlyButton) {
                queryMonthlyButton.onclick = queryMonthlySpaces;
            }

            if (monthlyContinueButton) {
                monthlyContinueButton.onclick = queryMonthlySpaces;
            }

            const monthlyPlateInput =
                document.getElementById("monthlyPlateInput");

            if (monthlyPlateInput) {
                monthlyPlateInput.onkeydown = function (event) {
                    if (event.key === "Enter") {
                        queryMonthlySpaces();
                    }
                };
            }

            document.querySelectorAll("[data-arrear-id]").forEach(function (card) {
                card.onclick = function () {
                    const item = appState.arrears.find(
                        arrear => arrear.id === card.dataset.arrearId
                    );

                    if (!item) return;

                    item.selected = !item.selected;
                    render();
                };
            });

            const toggleAllArrears =
                document.getElementById("toggleAllArrears");

            if (toggleAllArrears) {
                toggleAllArrears.onclick = function () {
                    const allSelected =
                        appState.arrears.every(item => item.selected);

                    appState.arrears.forEach(function (item) {
                        item.selected = !allSelected;
                    });

                    render();
                };
            }

            document.querySelectorAll("[data-space-id]").forEach(function (card) {
                card.onclick = function (event) {
                    if (event.target.closest("[data-space-duration]")) {
                        return;
                    }

                    const space = appState.monthlySpaces.find(
                        item => item.id === card.dataset.spaceId
                    );

                    if (!space) return;

                    space.selected = !space.selected;
                    render();
                };
            });

            document
                .querySelectorAll("[data-space-duration]")
                .forEach(function (button) {
                    button.onclick = function (event) {
                        event.stopPropagation();

                        const space = appState.monthlySpaces.find(
                            item => item.id === button.dataset.spaceDuration
                        );

                        if (!space) return;

                        space.selected = true;
                        space.months = Number(button.dataset.months);
                        render();
                    };
                });

            document
                .querySelectorAll("[data-payment-method]")
                .forEach(function (method) {
                    method.onclick = function () {
                        appState.paymentMethod =
                            method.dataset.paymentMethod;

                        setEnvironmentText();
                        render();
                    };
                });

            const agreementCheck =
                document.getElementById("agreementCheck");

            if (agreementCheck) {
                agreementCheck.onclick = function () {
                    appState.agreementChecked =
                        !appState.agreementChecked;

                    render();
                };
            }

            const submitPaymentButton =
                document.getElementById("submitPayment");

            if (submitPaymentButton) {
                submitPaymentButton.onclick = submitPayment;
            }

            const backToEntry =
                document.getElementById("backToEntry");

            if (backToEntry) {
                backToEntry.onclick = initializeScene;
            }

            const viewReceipt =
                document.getElementById("viewReceipt");

            if (viewReceipt) {
                viewReceipt.onclick = openReceipt;
            }

            const retryScan =
                document.getElementById("retryScan");

            if (retryScan) {
                retryScan.onclick = initializeScene;
            }
        }

          <strong style="
            color:${item.discount ? "var(--green)" : "#3c5264"}
          ">
            ${item.amount < 0 ? "-" : ""}
            ${money(Math.abs(item.amount))}
          </strong>
        </div>
      `).join("")}

      <div class="summary-row total">
        <span>实付金额</span>
        <strong>${money(payment.amount)}</strong>
      </div>
    </div>

    <div class="button-row">
      <button class="ghost-btn" id="saveReceiptImage">
        保存凭证
      </button>

      <button class="primary-btn" id="sendReceiptEmail">
        发送到邮箱
      </button>
    </div>
  `);

            setTimeout(function () {
                const saveButton =
                    document.getElementById("saveReceiptImage");

                const emailButton =
                    document.getElementById("sendReceiptEmail");

                if (saveButton) {
                    saveButton.onclick = function () {
                        toast("电子凭证已生成，可长按页面保存", "success");
                    };
                }

                if (emailButton) {
                    emailButton.onclick = function () {
                        openModal("发送电子凭证", `
          <div class="form-group">
            <label class="form-label">
              <span>接收邮箱</span>
              <em>必填</em>
            </label>

            <input
              type="email"
              class="form-control"
              id="receiptEmail"
              placeholder="请输入邮箱地址"
            >
          </div>

          <button class="primary-btn full-btn" id="submitReceiptEmail">
            发送电子凭证
          </button>
        `);

                        setTimeout(function () {
                            const submit =
                                document.getElementById("submitReceiptEmail");

                            if (submit) {
                                submit.onclick = function () {
                                    const email =
                                        document.getElementById("receiptEmail").value.trim();

                                    if (!email.includes("@")) {
                                        toast("请输入正确的邮箱地址", "warning");
                                        return;
                                    }

                                    closeModal();
                                    toast("电子缴费凭证已发送到邮箱", "success");
                                };
                            }
                        }, 0);
                    };
                }
            }, 0);
        }

        /* =========================================================
           顶部及弹窗事件
        ========================================================= */

        document
            .getElementById("headerBack")
            .addEventListener("click", goBack);

        document
            .getElementById("headerMore")
            .addEventListener("click", function () {
                openModal("停车缴费服务", `
      <div class="card compact">
        <div class="info-row">
          <span>当前扫码类型</span>
          <strong>
            ${scene === "road"
                        ? "道路停车小票"
                        : scene === "coupon"
                            ? "商户停车优惠券"
                            : scene === "monthly"
                                ? "包月续费二维码"
                                : "停车场缴费二维码"
                    }
          </strong>
        </div>

        <div class="info-row">
          <span>支付环境</span>
          <strong>${paymentMethodName(appState.paymentMethod)}</strong>
        </div>

        <div class="info-row">
          <span>数据连接</span>
          <strong style="color:var(--green)">安全连接</strong>
        </div>
      </div>

      <button class="secondary-btn full-btn" id="contactService">
        联系停车客服
      </button>
    `);

                setTimeout(function () {
                    const button =
                        document.getElementById("contactService");

                    if (button) {
                        button.onclick = function () {
                            toast("正在为您连接停车客服", "success");
                        };
                    }
                }, 0);
            });

        document
            .getElementById("modalClose")
            .addEventListener("click", closeModal);

        document
            .getElementById("modalOverlay")
            .addEventListener("click", function (event) {
                if (event.target.id === "modalOverlay") {
                    closeModal();
                }
            });

        /* =========================================================
           初始化
        ========================================================= */

        updateClock();
        setInterval(updateClock, 30000);

        setEnvironmentText();
        initializeScene();
    </script>

</body>

</html>
