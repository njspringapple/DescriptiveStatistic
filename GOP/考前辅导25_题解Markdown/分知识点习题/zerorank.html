<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>粉笔板书 · 秩-零化度定理（变换思维 · 图形化）</title>
<style>
:root{--chalk:#eef3ea;--y:#ffe08a;--p:#ffa6c9;--c:#8fd9ff;--g:#8ef2a0;--r:#ff7a90}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#2b2118;overflow:hidden;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;
 font-family:"LXGW WenKai","霞鹜文楷","KaiTi","STKaiti","楷体","PingFang SC","Microsoft YaHei",sans-serif}
.frame{width:min(1200px,100%);flex:1;min-height:0;border:16px solid #6d4a2a;border-radius:10px;background:#5b3d21;
 box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 0 4px #543619;position:relative}
.board{position:absolute;inset:0;overflow:hidden;background:
 radial-gradient(120% 90% at 20% 10%,rgba(255,255,255,.06),transparent 60%),
 radial-gradient(80% 70% at 85% 80%,rgba(255,255,255,.05),transparent 60%),#1e4335}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;filter:blur(6px);background:
 radial-gradient(60% 22% at 30% 28%,#fff,transparent 70%),radial-gradient(50% 18% at 72% 60%,#fff,transparent 70%)}
.head{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;
 padding:9px 20px 5px;color:rgba(238,243,234,.7);font-size:13px;letter-spacing:1px;border-bottom:1px dashed rgba(255,255,255,.15)}
.content{position:absolute;inset:40px 22px 22px 28px;overflow:auto;z-index:2;color:var(--chalk);
 font-size:clamp(14px,1.85vw,19px);line-height:1.8;transition:opacity .3s,filter .3s}
.content.fade{opacity:0;filter:blur(4px)}
.content::-webkit-scrollbar{width:8px;height:8px}.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:8px}
.atom{opacity:0;display:inline-block}
.atom.shown{animation:ci .18s ease-out forwards}
@keyframes ci{from{opacity:0;filter:blur(3px);transform:translateY(2px)}to{opacity:1;filter:none;transform:none}}
.line,.box,.ctitle,.matlabel,.cell{text-shadow:0 0 1px rgba(255,255,255,.5),0 0 7px rgba(255,255,255,.15)}
.line{margin:3px 0;white-space:pre-wrap}
.ctitle{display:inline-block;font-size:1.3em;color:var(--y);margin:0 0 10px;letter-spacing:2px;
 border-bottom:2px dashed rgba(255,224,138,.5);padding-bottom:4px}
.hl{color:var(--y)}.note{color:var(--c);font-size:.85em}
.box{display:inline-block;margin:9px 0;padding:5px 15px;color:var(--g);border:2px dashed rgba(142,242,160,.6);border-radius:14px}
.matwrap{display:flex;align-items:center;gap:8px;margin:6px 0}
.matrix{display:flex}.brk{width:10px;border-top:3px solid var(--chalk);border-bottom:3px solid var(--chalk)}
.brk.l{border-left:3px solid var(--chalk);border-radius:8px 0 0 8px}.brk.r{border-right:3px solid var(--chalk);border-radius:0 8px 8px 0}
.mgrid{display:grid;gap:1px 14px;padding:4px 8px}.cell{min-width:1.6em;text-align:right}
/* viz */
.viz{display:block;width:max-content;max-width:100%;margin:12px 0;padding:9px 11px;border:1px solid rgba(255,255,255,.18);
 border-radius:12px;background:rgba(0,0,0,.15)}
.vh{color:var(--y);font-size:.78em;margin-bottom:6px}
.vrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.vctl{display:flex;gap:7px;align-items:center;margin-top:7px;flex-wrap:wrap}
.vctl button{font-size:12px;padding:4px 10px}
.ro{font-size:.76em;color:var(--c);font-family:ui-monospace,Consolas,monospace;margin-top:5px;min-height:1.2em}
.ro b{color:var(--p)}
canvas{display:block;border-radius:8px;touch-action:none}
.cap{font-size:.72em;color:rgba(238,243,234,.65);text-align:center;margin-top:3px}
/* dimbar */
.drow{display:flex;gap:8px}
.dblk{width:56px;height:42px;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:8px;
 border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.06);transition:.55s}
.dblk.alive{border-color:var(--g);color:var(--g);background:rgba(142,242,160,.15);transform:translateY(-8px)}
.dblk.dead{border-color:var(--r);color:var(--r);background:rgba(255,122,144,.15);transform:translateY(12px) scale(.85)}
.dbr{display:flex;gap:8px;margin-top:16px}
.dbrl{border-top:2px dashed var(--g);color:var(--g)}.dbrr{border-top:2px dashed var(--r);color:var(--r)}
.dbrl,.dbrr{font-size:12px;text-align:center;padding-top:5px;transform:scaleX(0);transform-origin:left;transition:transform .6s .3s}
.dimwrap.go .dbrl,.dimwrap.go .dbrr{transform:scaleX(1)}
.deq{margin-top:12px;color:var(--y);font-size:.95em;opacity:0;transition:opacity .5s 1s}
.dimwrap.go .deq{opacity:1}
/* chalk & eraser */
.chalk{position:absolute;width:11px;height:28px;border-radius:3px;z-index:6;pointer-events:none;opacity:0;
 background:linear-gradient(#fff,#dfe6dc);box-shadow:0 2px 6px rgba(0,0,0,.4);transform:translate(-9999px,-9999px) rotate(28deg);transition:transform .08s linear}
.chalk.on{opacity:1}
.dust{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;z-index:5;pointer-events:none;animation:fl .8s ease-in forwards}
@keyframes fl{to{transform:translate(4px,40px);opacity:0}}
.er{position:absolute;top:0;left:-160px;width:120px;height:100%;z-index:7;pointer-events:none;opacity:0;
 background:linear-gradient(90deg,rgba(255,255,255,.02),rgba(255,255,255,.13),rgba(255,255,255,.02))}
.er.sw{animation:sw .55s linear}
@keyframes sw{0%{opacity:1;left:-160px}100%{opacity:1;left:100%}}
.tray{position:absolute;left:0;right:0;bottom:0;height:13px;background:linear-gradient(#7a5530,#4d3319);z-index:4}
/* bar */
.bar{width:min(1200px,100%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font-family:inherit;font-size:14px;padding:6px 13px;border-radius:20px;cursor:pointer;color:#f6efe2;background:#3d2b1a;border:1px solid #7a5530}
button:hover{background:#57391f}
button.act{background:#1e4335;border-color:#8fd6b6;color:#d9ffe9}
.toc{width:min(1200px,100%);display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}
.toc button{font-size:12px;padding:4px 9px;border-radius:13px;opacity:.7;white-space:nowrap}
.toc button.cur{opacity:1;background:#1e4335;border-color:#8fd9ff;color:#e7f7ff}
.lbl{color:#d9c9ae;font-size:13px}input[type=range]{width:100px;accent-color:#8fd6b6}
</style>
</head>
<body>
<div class="frame"><div class="board" id="board">
  <div class="head"><span>线性代数 · 秩 - 零化度定理（变换视角）</span><span id="hr"></span></div>
  <div class="content" id="content"></div>
  <div class="chalk" id="chalk"></div><div class="er" id="er"></div><div class="tray"></div>
</div></div>
<div class="bar">
  <button id="bF">⏮ 从头</button><button id="bP">◀ 上一页</button>
  <button id="bA">▶ 自动讲课</button><button id="bN">下一页 ▶</button><button id="bR">↻ 重写本页</button>
  <span class="lbl">语速</span><input id="sp" type="range" min="0.6" max="2.6" step="0.1" value="1.4">
  <button id="bS">🔇 粉笔声</button>
</div>
<div class="toc" id="toc"></div>

<script>
/* =============== 画布小工具 =============== */
const CH='#eef3ea',DIMC='rgba(238,243,234,.30)',RED='#ff7a90',GRN='#8ef2a0',YEL='#ffe08a',CYA='#8fd9ff',PNK='#ffa6c9';
const F='13px "LXGW WenKai","KaiTi","楷体",sans-serif';
function mkc(w,h){const c=document.createElement('canvas'),d=window.devicePixelRatio||1;
 c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';
 const g=c.getContext('2d');g.scale(d,d);g.font=F;g.textBaseline='middle';return{c,g};}
function ln(g,a,b,x,y,col,lw){g.strokeStyle=col;g.lineWidth=lw||1;g.beginPath();g.moveTo(a,b);g.lineTo(x,y);g.stroke();}
function dt(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function ar(g,x1,y1,x2,y2,col,lw){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw||2.4;
 g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
 const a=Math.atan2(y2-y1,x2-x1),L=9;g.beginPath();g.moveTo(x2,y2);
 g.lineTo(x2-L*Math.cos(a-.42),y2-L*Math.sin(a-.42));g.lineTo(x2-L*Math.cos(a+.42),y2-L*Math.sin(a+.42));g.closePath();g.fill();}
function tx(g,s,x,y,col,al){g.fillStyle=col;g.textAlign=al||'left';g.fillText(s,x,y);}
function grid(g,cx,cy,s,W,H){g.strokeStyle='rgba(238,243,234,.12)';g.lineWidth=1;
 for(let i=-30;i<=30;i++){const X=cx+i*s,Y=cy+i*s;
  if(X>0&&X<W){g.beginPath();g.moveTo(X,0);g.lineTo(X,H);g.stroke();}
  if(Y>0&&Y<H){g.beginPath();g.moveTo(0,Y);g.lineTo(W,Y);g.stroke();}}
 ln(g,0,cy,W,cy,'rgba(238,243,234,.42)',1.3);ln(g,cx,0,cx,H,'rgba(238,243,234,.42)',1.3);}
function bt(t){const b=document.createElement('button');b.textContent=t;return b;}
function dv(c,h){const d=document.createElement('div');if(c)d.className=c;if(h)d.innerHTML=h;return d;}

/* =============== 可视化组件 =============== */
const VIZ={};

/* ① 平面morph：整个平面被 A 拉扯 / 压扁 */
VIZ.lt2d=function(o){
 const A=o.A,W=o.w||520,H=o.h||330,s=o.s||30,cx=W/2,cy=H/2;
 const el=dv('viz');el.appendChild(dv('vh',o.title||''));
 const{c,g}=mkc(W,H);el.appendChild(c);
 const ctl=dv('vctl'),bp=bt('▶ 施加变换 A'),br=bt('⟲ 复原'),ro=dv('ro');
 ctl.append(bp,br);el.append(ctl,ro);
 const det=A[0][0]*A[1][1]-A[0][1]*A[1][0];
 let kv=null;
 if(Math.abs(det)<1e-9){let v=[-A[0][1],A[0][0]];if(Math.hypot(v[0],v[1])<1e-9)v=[-A[1][1],A[1][0]];
   const n=Math.hypot(v[0],v[1]);if(n>1e-9)kv=[v[0]/n,v[1]/n];}
 let t=0,raf=null,st=null,run=false;
 const M=()=>[[1+(A[0][0]-1)*t,A[0][1]*t],[A[1][0]*t,1+(A[1][1]-1)*t]];
 const P=(x,y)=>{const m=M();return[cx+(m[0][0]*x+m[0][1]*y)*s,cy-(m[1][0]*x+m[1][1]*y)*s];};
 function draw(){
  g.clearRect(0,0,W,H);grid(g,cx,cy,s,W,H);
  const R=12;
  for(let i=-R;i<=R;i++){
   const c1=(i===0)?'rgba(238,243,234,.75)':'rgba(143,217,255,.42)';
   let p=P(-R,i),q=P(R,i);ln(g,p[0],p[1],q[0],q[1],c1,i===0?2:1.1);
   const c2=(i===0)?'rgba(238,243,234,.75)':'rgba(255,166,201,.38)';
   p=P(i,-R);q=P(i,R);ln(g,p[0],p[1],q[0],q[1],c2,i===0?2:1.1);
  }
  // 单位方块（面积）
  const a=P(0,0),b=P(1,0),d2=P(1,1),e=P(0,1);
  g.fillStyle='rgba(142,242,160,.20)';g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(d2[0],d2[1]);g.lineTo(e[0],e[1]);g.closePath();g.fill();
  if(kv){ // 核方向
   const p=P(-5*kv[0],-5*kv[1]),q=P(5*kv[0],5*kv[1]);
   g.setLineDash([7,5]);ln(g,p[0],p[1],q[0],q[1],RED,3);g.setLineDash([]);
   for(let k=-4;k<=4;k++){if(!k)continue;const z=P(k*kv[0],k*kv[1]);dt(g,z[0],z[1],3.4,RED);}
   if(t<.15)tx(g,'红线 = 将被压成 0 的方向',10,18,RED);
  }
  ar(g,cx,cy,b[0],b[1],YEL,3);ar(g,cx,cy,e[0],e[1],CYA,3);
  tx(g,'A î',b[0]+6,b[1]-8,YEL);tx(g,'A ĵ',e[0]+6,e[1]-8,CYA);
  dt(g,cx,cy,4,'#fff');
  const m=M(),dd=m[0][0]*m[1][1]-m[0][1]*m[1][0];
  ro.innerHTML='t = '+t.toFixed(2)+' ｜ 面积倍率 |det| = <b>'+Math.abs(dd).toFixed(2)+'</b>'+
   (Math.abs(dd)<.02?' ← 面积归零：<b>平面被压成一条线</b>':'');
 }
 function loop(ts){if(!st)st=ts;t=Math.min(1,(ts-st)/1900);draw();
  if(t<1)raf=requestAnimationFrame(loop);else run=false;}
 bp.onclick=()=>{if(run)return;run=true;st=null;t=0;raf=requestAnimationFrame(loop);};
 br.onclick=()=>{cancelAnimationFrame(raf);run=false;t=0;draw();};
 draw();
 return{el,start(){setTimeout(()=>bp.onclick(),350);},stop(){cancelAnimationFrame(raf);}};
};

/* ② 双平面：左拖 x，右看 Ax —— 核空间的直观定义 */
VIZ.twoplane=function(o){
 const A=o.A,W=300,H=262,s=o.s||27,so=o.so||16,cx=W/2,cy=H/2;
 const el=dv('viz');el.appendChild(dv('vh',o.title||''));
 const rw=dv('vrow');
 const L=mkc(W,H),Rt=mkc(W,H);
 const lw=dv(),rwp=dv();
 lw.append(L.c,dv('cap','定义域 ℝ²（输入 x）'));rwp.append(Rt.c,dv('cap','目标空间 ℝ²（输出 Ax）'));
 rw.append(lw,rwp);el.appendChild(rw);
 const ro=dv('ro'),ctl=dv('vctl');
 const det=A[0][0]*A[1][1]-A[0][1]*A[1][0],rank=Math.abs(det)<1e-9?((Math.abs(A[0][0])+Math.abs(A[0][1])+Math.abs(A[1][0])+Math.abs(A[1][1]))<1e-9?0:1):2;
 let kv=null;if(rank===1){let v=[-A[0][1],A[0][0]];if(Math.hypot(v[0],v[1])<1e-9)v=[-A[1][1],A[1][0]];
  const n=Math.hypot(v[0],v[1]);kv=[v[0]/n,v[1]/n];}
 let col=[A[0][0],A[1][0]];if(Math.hypot(col[0],col[1])<1e-9)col=[A[0][1],A[1][1]];
 const cn=Math.hypot(col[0],col[1]);if(cn>1e-9)col=[col[0]/cn,col[1]/cn];
 let x=o.x0?o.x0.slice():[2,1],mode=o.mode||'free',raf=null,ph=0;
 const Ax=()=>[A[0][0]*x[0]+A[0][1]*x[1],A[1][0]*x[0]+A[1][1]*x[1]];
 function draw(){
  const g=L.g;g.clearRect(0,0,W,H);grid(g,cx,cy,s,W,H);
  if(kv){const p=[cx-6*kv[0]*s,cy+6*kv[1]*s],q=[cx+6*kv[0]*s,cy-6*kv[1]*s];
   g.setLineDash([7,5]);ln(g,p[0],p[1],q[0],q[1],RED,3);g.setLineDash([]);
   tx(g,'N(A) 核空间',8,16,RED);}
  else{dt(g,cx,cy,6,RED);g.strokeStyle=RED;g.lineWidth=2;g.beginPath();g.arc(cx,cy,11,0,7);g.stroke();
   tx(g,'N(A) = {0} 只有这一个点',8,16,RED);}
  ar(g,cx,cy,cx+x[0]*s,cy-x[1]*s,PNK,3);dt(g,cx+x[0]*s,cy-x[1]*s,6,PNK);
  tx(g,'x',cx+x[0]*s+8,cy-x[1]*s-9,PNK);
  const g2=Rt.g,y=Ax();g2.clearRect(0,0,W,H);grid(g2,cx,cy,so,W,H);
  if(rank===1){const p=[cx-14*col[0]*so,cy+14*col[1]*so],q=[cx+14*col[0]*so,cy-14*col[1]*so];
   ln(g2,p[0],p[1],q[0],q[1],GRN,2.5);tx(g2,'R(A) 像空间（1 维）',8,16,GRN);}
  else tx(g2,'R(A) = 整个 ℝ²（2 维）',8,16,GRN);
  const zero=Math.hypot(y[0],y[1])<1e-6;
  if(zero){dt(g2,cx,cy,8,RED);g2.strokeStyle=RED;g2.lineWidth=2;g2.beginPath();g2.arc(cx,cy,14,0,7);g2.stroke();
   tx(g2,'Ax = 0',cx+18,cy-14,RED);}
  else{ar(g2,cx,cy,cx+y[0]*so,cy-y[1]*so,YEL,3);dt(g2,cx+y[0]*so,cy-y[1]*so,6,YEL);
   tx(g2,'Ax',cx+y[0]*so+8,cy-y[1]*so-9,YEL);}
  const big=Math.hypot(x[0],x[1])>.25;
  ro.innerHTML='x = ('+x[0].toFixed(2)+', '+x[1].toFixed(2)+')  ⟶  Ax = ('+y[0].toFixed(2)+', '+y[1].toFixed(2)+')'+
   (zero&&big?'　<b>非零的 x 被坍缩成 0 ！它在核里</b>':(!big?'　（x 本身就是零向量）':''));
 }
 function loop(){ph+=.016;
  if(mode==='kernel'&&kv){const k=3*Math.sin(ph);x=[kv[0]*k,kv[1]*k];}
  else if(mode==='circle'){x=[2.6*Math.cos(ph),2.6*Math.sin(ph)];}
  draw();raf=requestAnimationFrame(loop);}
 function pos(e){const r=L.c.getBoundingClientRect();
  return[((e.clientX-r.left)*(W/r.width)-cx)/s,(cy-(e.clientY-r.top)*(H/r.height))/s];}
 let drag=false;
 L.c.addEventListener('pointerdown',e=>{drag=true;mode='free';L.c.setPointerCapture(e.pointerId);x=pos(e);draw();});
 L.c.addEventListener('pointermove',e=>{if(drag){x=pos(e);draw();}});
 L.c.addEventListener('pointerup',()=>drag=false);
 if(kv){const b1=bt('▶ 沿核方向巡游');b1.onclick=()=>{mode='kernel';};ctl.appendChild(b1);}
 const b2=bt('▶ 绕圈巡游');b2.onclick=()=>{mode='circle';};
 const b3=bt('✋ 手动拖动');b3.onclick=()=>{mode='free';};
 ctl.append(b2,b3);el.append(ctl,ro);
 draw();
 return{el,start(){if(!raf){mode=o.mode||'free';raf=requestAnimationFrame(loop);}},
        stop(){cancelAnimationFrame(raf);raf=null;}};
};

/* ③ 零空间的四种"长相"：{0} 不是 ∅ */
VIZ.zeroset=function(){
 const W=740,H=215,el=dv('viz');el.appendChild(dv('vh','核空间可能长什么样？'));
 const{c,g}=mkc(W,H);el.appendChild(c);
 const cells=[['满秩 r = n','N(A) = {0}','0 维 ｜ 1 个元素'],
              ['n − r = 1','一条过原点的直线','1 维 ｜ 无穷多元素'],
              ['n − r = 2','一张过原点的平面','2 维 ｜ 无穷多元素'],
              ['✗ 错误认知','N(A) = ∅ 空集','不可能！0 永远在里面']];
 for(let i=0;i<4;i++){
  const cx=92+185*i,cy=100;
  if(i)ln(g,cx-92,20,cx-92,H-20,'rgba(255,255,255,.15)',1);
  ln(g,cx-62,cy,cx+62,cy,'rgba(238,243,234,.3)',1);ln(g,cx,cy-46,cx,cy+46,'rgba(238,243,234,.3)',1);
  if(i===0){dt(g,cx,cy,6,RED);g.strokeStyle=RED;g.lineWidth=2;g.beginPath();g.arc(cx,cy,13,0,7);g.stroke();}
  if(i===1){const a=.55;ln(g,cx-58*Math.cos(a),cy+58*Math.sin(a),cx+58*Math.cos(a),cy-58*Math.sin(a),RED,3);
   for(let k=-2;k<=2;k++)dt(g,cx+k*24*Math.cos(a),cy-k*24*Math.sin(a),3.5,RED);}
  if(i===2){g.fillStyle='rgba(255,122,144,.28)';g.strokeStyle=RED;g.lineWidth=2;
   g.beginPath();g.moveTo(cx-58,cy+16);g.lineTo(cx-14,cy-26);g.lineTo(cx+58,cy-14);g.lineTo(cx+14,cy+28);g.closePath();g.fill();g.stroke();
   ar(g,cx,cy,cx-30,cy-14,YEL,2);ar(g,cx,cy,cx+34,cy+6,CYA,2);
   tx(g,'ξ₁',cx-46,cy-22,YEL);tx(g,'ξ₂',cx+38,cy+16,CYA);dt(g,cx,cy,4,'#fff');}
  if(i===3){g.setLineDash([5,4]);g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;
   g.beginPath();g.arc(cx,cy,34,0,7);g.stroke();g.setLineDash([]);
   g.strokeStyle=RED;g.lineWidth=4;g.beginPath();g.moveTo(cx-38,cy-38);g.lineTo(cx+38,cy+38);
   g.moveTo(cx+38,cy-38);g.lineTo(cx-38,cy+38);g.stroke();}

/* ⑤ 3D：ℝ³ 被压成平面，核是一条直线 */
VIZ.space3d=function(){
 const A=[[1,0,1],[0,1,1],[1,1,2]],W=540,H=350,s=40,cx=W/2,cy=H/2+8;
 const el=dv('viz');el.appendChild(dv('vh','ℝ³ ──A──▶ 2 维平面 ｜ 红线整条被送到原点'));
 const{c,g}=mkc(W,H);el.appendChild(c);
 const ctl=dv('vctl'),bp=bt('▶ 施加变换'),br=bt('⟲ 复原'),bt2=bt('⟳ 暂停旋转'),ro=dv('ro');
 ctl.append(bp,br,bt2);el.append(ctl,ro);
 const R=2,segs=[];
 for(let i=-R;i<=R;i++)for(let j=-R;j<=R;j++){
  segs.push([[-R,i,j],[R,i,j]]);segs.push([[i,-R,j],[i,R,j]]);segs.push([[i,j,-R],[i,j,R]]);}
 const kv=[-1,-1,1];
 let t=0,yaw=.7,rot=true,raf=null,last=null,anim=false,st=null;
 const M=v=>{const m=(i,j)=>((i===j)?1:0)*(1-t)+A[i][j]*t;
  return[0,1,2].map(i=>m(i,0)*v[0]+m(i,1)*v[1]+m(i,2)*v[2]);};
 function pj(v){const cyw=Math.cos(yaw),sy=Math.sin(yaw);
  const X=v[0]*cyw+v[2]*sy,Z=-v[0]*sy+v[2]*cyw,Y=v[1];
  const p=.42,cp=Math.cos(p),sp=Math.sin(p);
  const Y2=Y*cp-Z*sp,Z2=Y*sp+Z*cp;return[cx+X*s,cy-Y2*s,Z2];}
 function draw(){
  g.clearRect(0,0,W,H);
  const out=segs.map(sg=>[pj(M(sg[0])),pj(M(sg[1]))]);
  out.sort((a,b)=>(a[0][2]+a[1][2])-(b[0][2]+b[1][2]));
  out.forEach(p=>{const dp=(p[0][2]+p[1][2])/2,al=.16+.20*(1/(1+Math.exp(-dp)));
   ln(g,p[0][0],p[0][1],p[1][0],p[1][1],'rgba(143,217,255,'+al.toFixed(2)+')',1);});
  const a=pj(M([-3*kv[0],-3*kv[1],-3*kv[2]])),b=pj(M([3*kv[0],3*kv[1],3*kv[2]]));
  ln(g,a[0],a[1],b[0],b[1],RED,3.5);
  for(let q=-3;q<=3;q++){const z=pj(M([q*kv[0],q*kv[1],q*kv[2]]));dt(g,z[0],z[1],4,RED);}
  [[[1,0,0],YEL,'Aê₁'],[[0,1,0],GRN,'Aê₂'],[[0,0,1],PNK,'Aê₃']].forEach(u=>{
   const o=pj([0,0,0]),p=pj(M(u[0]));ar(g,o[0],o[1],p[0],p[1],u[1],2.5);tx(g,u[2],p[0]+5,p[1]-8,u[1]);});
  const o=pj([0,0,0]);dt(g,o[0],o[1],4.5,'#fff');
  const m=(i,j)=>((i===j)?1:0)*(1-t)+A[i][j]*t;
  const D=m(0,0)*(m(1,1)*m(2,2)-m(1,2)*m(2,1))-m(0,1)*(m(1,0)*m(2,2)-m(1,2)*m(2,0))+m(0,2)*(m(1,0)*m(2,1)-m(1,1)*m(2,0));
  ro.innerHTML='t = '+t.toFixed(2)+' ｜ 体积倍率 |det| = <b>'+Math.abs(D).toFixed(2)+'</b>'+
   (t>.97?' ← 体积归零：立体被压成 <b>2 维平面</b>，核 = 1 维直线':'');
 }
 function loop(ts){if(last==null)last=ts;const dtm=(ts-last)/1000;last=ts;
  if(rot)yaw+=dtm*.32;
  if(anim){if(st==null)st=ts;t=Math.min(1,(ts-st)/2400);if(t>=1)anim=false;}
  draw();raf=requestAnimationFrame(loop);}
 bp.onclick=()=>{t=0;st=null;anim=true;};
 br.onclick=()=>{anim=false;t=0;};
 bt2.onclick=()=>{rot=!rot;bt2.textContent=rot?'⟳ 暂停旋转':'⟳ 继续旋转';};
 draw();
 return{el,start(){if(!raf){last=null;raf=requestAnimationFrame(loop);}setTimeout(()=>{t=0;st=null;anim=true;},500);},
        stop(){cancelAnimationFrame(raf);raf=null;}};
};

 if(it.y==='b'){const d=E('div','box');chars(d,it.t,at);return{el:d,at};}
 if(it.y==='m'){const w=E('div','matwrap');
  if(it.l){const lb=E('div','matlabel');chars(lb,it.l,at);w.appendChild(lb);}
  const mx=E('div','matrix'),l=E('div','brk l atom'),r=E('div','brk r atom'),gr=E('div','mgrid');
  gr.style.gridTemplateColumns='repeat('+it.r[0].length+',auto)';
  const cs=[];it.r.forEach(row=>row.forEach(v=>{const c=E('div','cell atom');c.textContent=v;gr.appendChild(c);cs.push(c);}));
  mx.append(l,gr,r);w.appendChild(mx);at.push(l,r,...cs);return{el:w,at};}
 if(it.y==='v'){const inst=VIZ[it.k](it.o);inst.el.classList.add('atom');inst.el._v=inst;pool.push(inst);return{el:inst.el,at:[inst.el]};}
 return{el:E('div'),at:[]};
}
let idx=0,tok=0,anim=false,play=false,snd=false,spd=1.4,ac=null;
const nap=m=>new Promise(r=>setTimeout(r,m));
function tick(){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
 const n=.03,b=ac.createBuffer(1,ac.sampleRate*n,ac.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)*.22;
 const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';
 f.frequency.value=2600+Math.random()*900;const g=ac.createGain();g.gain.value=.3;
 s.connect(f);f.connect(g);g.connect(ac.destination);s.start();}catch(e){}}
function moveChalk(a){const r=a.getBoundingClientRect(),b=board.getBoundingClientRect();
 if(!r.width&&!r.height)return;const x=r.right-b.left,y=r.bottom-b.top;
 chalk.style.transform='translate('+x+'px,'+(y-24)+'px) rotate(28deg)';
 if(Math.random()<.15){const d=E('div','dust');d.style.left=x+'px';d.style.top=y+'px';board.appendChild(d);setTimeout(()=>d.remove(),850);}}
function killPool(){pool.forEach(p=>p.stop&&p.stop());pool=[];}
async function erase(){eraser.classList.remove('sw');void eraser.offsetWidth;eraser.classList.add('sw');
 content.classList.add('fade');await nap(500);killPool();content.innerHTML='';content.classList.remove('fade');eraser.classList.remove('sw');}
function statik(i){killPool();content.innerHTML='';
 slides[i].it.forEach(it=>{const r=build(it);content.appendChild(r.el);
  r.at.forEach(a=>{a.classList.add('shown');a.style.animation='none';a.style.opacity=1;if(a._v)a._v.start();});});}
async function show(i,ers){const my=++tok;idx=(i+slides.length)%slides.length;ui();
 if(ers!==false)await erase();else{killPool();content.innerHTML='';}
 if(my!==tok)return;
 const gs=[];slides[idx].it.forEach(it=>{const r=build(it);content.appendChild(r.el);gs.push(r);});
 anim=true;chalk.classList.add('on');
 for(const g of gs){if(my!==tok)return;g.el.scrollIntoView({block:'nearest',behavior:'smooth'});
  for(const a of g.at){if(my!==tok)return;a.classList.add('shown');moveChalk(a);
   if(a._v){a._v.start();await nap(1600/spd);continue;}
   if(!a.dataset.f&&Math.random()<.33)tick();
   await nap((a.dataset.f?9:(a.classList.contains('c')?32:52))/spd);}
  await nap(230/spd);}
 anim=false;chalk.classList.remove('on');
 if(play&&my===tok){await nap(2600/spd);if(my!==tok)return;
  if(idx<slides.length-1)show(idx+1);else setP(false);}}
function skip(){tok++;anim=false;chalk.classList.remove('on');statik(idx);}
function nx(){if(anim){skip();if(play)setTimeout(()=>show(idx+1),800);return;}
 if(idx<slides.length-1)show(idx+1);else setP(false);}
function pv(){setP(false);if(idx>0)show(idx-1);}
function setP(v){play=v;$('bA').textContent=v?'⏸ 暂停':'▶ 自动讲课';$('bA').classList.toggle('act',v);if(v&&!anim)show(idx);}
const toc=$('toc');
slides.forEach((s,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'.'+s.n;b.onclick=()=>{setP(false);show(i);};toc.appendChild(b);});
function ui(){$('hr').textContent='第 '+(idx+1)+' / '+slides.length+' 页';
 [...toc.children].forEach((b,i)=>b.classList.toggle('cur',i===idx));
 toc.children[idx].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}
$('bN').onclick=nx;$('bP').onclick=pv;$('bF').onclick=()=>{setP(false);show(0);};
$('bR').onclick=()=>show(idx);$('bA').onclick=()=>setP(!play);
$('bS').onclick=e=>{snd=!snd;e.target.textContent=(snd?'🔊':'🔇')+' 粉笔声';e.target.classList.toggle('act',snd);};
$('sp').oninput=e=>spd=parseFloat(e.target.value);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nx();}if(e.key==='ArrowLeft')pv();});
show(0,false);
</script>
</body>
